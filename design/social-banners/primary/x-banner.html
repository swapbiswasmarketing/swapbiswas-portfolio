<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Builder Masthead X</title>
<link rel="stylesheet" href="/design/social-banners/brand.css">
<style>
	/* Builder masthead, v2 final. Grid: A = 64 (nameplate, URL slot), B = 562 (the left edge of "who": deck, stack,
	   first proof slot), C = 1108 (plate, second proof slot). Measure 64-1436.
	   The nameplate is the positioning, on one line, two-tone (DESIGN.md s.3): "A marketer" in
	   muted, "who builds." in ink, so the pivot word is what a phone reads first. X prints the
	   name and bio under the header, so the big type never spends itself on the name.
	   Dateline = two proofs, one marketing outcome and one builder output (desktop texture).
	   Stack row: fixed cell padding either side of hairline separators, flush left at B and
	   flush right at 1436. 42px names with 28.35px padding = 0.67em, the same rhythm as the
	   LinkedIn row (35px / 23.25px). First cell is "Claude", the tool he named. Label is "Stack"
	   with a trailing hairline, so the small type does not repeat "builds" from the nameplate.
	   Deck is set in a banner-only Inter subset that keeps cv08 (serifed capital I), so
	   "I love AI" cannot read as "l love Al" at phone size. Same Inter 4.001 metrics otherwise.
	   Deck line 2 names tools and automations, so it does not restate the dateline's "agents & apps".
	   The strand leaves the avatar as a vermilion wave and settles into an ink rule by column B.
	   The headline period stays ink so the painting's ribbon is the vermilion note in the frame. */
	@font-face { font-family: 'Inter Banner'; font-style: normal; font-weight: 100 900;
		src: url('/design/social-banners/fonts/inter-cv08-latin.woff2') format('woff2'); }
	body { background: var(--paper); color: var(--ink); position: relative; }
	.rule { position: absolute; left: 64px; right: 64px; height: 0; border-top: 1px solid var(--hair-strong); }
	.rule.ink { border-top: 1.5px solid var(--ink); }

	.slot { position: absolute; top: 72px; height: 44px; display: flex; align-items: center; gap: 12px;
		font: 500 19px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
	.slot b { font-weight: 500; color: var(--ink); }
	.slot svg { width: 24px; height: 24px; flex: none; margin-left: -4.5px; }

	.nameplate { position: absolute; left: 62.5px; top: 124px; font: 600 106px/0.9 var(--font-display); letter-spacing: -0.03em; white-space: nowrap; }
	.nameplate .dim { color: var(--muted); }

	.deck { position: absolute; left: 562px; top: 246px; font: 400 34px/1.18 'Inter Banner', var(--font-body); font-feature-settings: 'cv08' 1; letter-spacing: -0.016em; color: var(--lede); white-space: nowrap; }
	.deck b { font-weight: 600; color: var(--ink); }

	.stack { position: absolute; left: 562px; right: 64px; top: 340px; }
	.stack .lab { display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
		font: 500 16px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
	.stack .lab::after { content: ''; flex: 1; height: 0; border-top: 1px solid var(--hair-strong); }
	.stack .row { display: flex; white-space: nowrap; }
	.stack .t { font: 600 42px/1 var(--font-body); letter-spacing: -0.012em; padding: 0 28.35px; border-left: 1px solid var(--hair-strong); }
	.stack .t:first-child { padding-left: 0; border-left: 0; }
	.stack .t:last-child { padding-right: 0; }
	.stack .t.more { color: var(--muted); font-weight: 500; }

	.plate { position: absolute; left: 1108px; top: 136px; width: 328px; height: 182px; border-radius: 12px; border: 1px solid var(--hair); overflow: hidden; }
	/* source crop x 1250-2325, y 395-992 of 2400x1792: the octahedron bleeds off the left edge
	   (no sliver of the icosahedron behind it), the gear-drawn scroll and ribbon hold the middle. */
	.plate img { position: absolute; width: 732px; left: -381px; top: -120.5px; }

	.strand { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
	<div class="rule ink" style="top:72px"></div>
	<div class="slot" style="left:64px"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M47.5 16.5 C44 10.5 36 8 28 10.5 C18.5 13.5 16 23.5 22.5 27.5 C28 31 36.5 32 42 36 C50.5 42 48 52.5 39 55 C31 57.3 22 54.5 17.5 47.5" fill="none" stroke="#15130f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.5" cy="47.5" r="5.8" fill="#b53b15"/></svg><b>swapbiswas.com</b></div>
	<div class="slot" style="left:562px"><b>18M+</b>organic visits</div>
	<div class="slot" style="left:1108px"><b>20+</b>AI agents &amp; apps</div>
	<div class="rule" style="top:116px"></div>

	<div class="nameplate"><span class="dim">A marketer</span> who builds.</div>

	<div class="rule" style="top:236px; left:562px; right:430px"></div>
	<p class="deck"><b>I love AI</b> enough to ship my own<br>tools and automations.</p>

	<div class="stack">
		<div class="lab">Stack</div>
		<div class="row" id="row">
			<span class="t">Claude</span>
			<span class="t">Replit</span>
			<span class="t">Lovable</span>
			<span class="t">Gemini</span>
			<span class="t more">+ more</span>
		</div>
	</div>

	<div class="plate"><img src="/design/social-banners/art/tools-workshop.jpg" alt=""></div>

	<svg class="strand" width="1500" height="500" viewBox="0 0 1500 500" aria-hidden="true">
		<defs>
			<linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="440" y1="0" x2="760" y2="0">
				<stop offset="0" stop-color="#b53b15"/>
				<stop offset=".45" stop-color="#6a3a2a"/>
				<stop offset=".75" stop-color="#15130f"/>
				<stop offset="1" stop-color="#15130f"/>
			</linearGradient>
		</defs>
		<path id="strand" fill="none" stroke="url(#sg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
	</svg>
	<script>
		// Raw carrier -> settled rule. Deterministic, so re-renders match.
		(function () {
			var c = { x0: 188, x1: 1436, y: 430, s0: 250, s1: 610, A: 8, P: 64 };
			var d = '';
			for (var x = c.x0; x <= c.s1; x += 1) {
				var t = Math.min(1, Math.max(0, (x - c.s0) / (c.s1 - c.s0)));
				var k = 1 - t * t * (3 - 2 * t);
				var n = 0.82 * Math.sin(2 * Math.PI * (x - c.x0) / c.P) + 0.22 * Math.sin(2 * Math.PI * (x - c.x0) / (c.P * 0.43) + 1.1);
				d += (x === c.x0 ? 'M' : 'L') + x + ' ' + (c.y + c.A * k * n).toFixed(2);
			}
			d += 'L' + c.x1 + ' ' + c.y;
			document.getElementById('strand').setAttribute('d', d);
		})();
	</script>
</body>
</html>
