<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dusk alternate - LinkedIn background</title>
<link rel="stylesheet" href="/design/social-banners/brand.css">
<style>
	/* Deck uses the banner-only Inter subset with cv08 (serifed capital I), same as v2/final, so "I love AI" cannot read as "l love Al" on phones. */
	@font-face { font-family: 'Inter Banner'; font-style: normal; font-weight: 100 900;
		src: url('/design/social-banners/fonts/inter-cv08-latin.woff2') format('woff2'); }
	/* Dark alternate to the light workshop masthead, LinkedIn cut. Same order as X:
	   dateline > nameplate > deck > tool row > strand. Copy column L = 676, R = 1320, inside the
	   phone crop (228-1356) with 36px to spare. Nothing sits in the outer 228px; the masthead
	   rules and the strand bleed off the right edge so the desktop frame still holds.
	   Vermilion notes: the painting's campfire (the one hot spot) and the tiny S head. The strand is
	   bone only: it fades in from under the avatar, crosses the painting faintly, settles at .8. */
	html, body { overflow: hidden; }
	body { background: var(--d-ground); color: var(--d-text); }
	.canvas { position: relative; width: 1584px; height: 396px; overflow: hidden; background: var(--d-ground); }

	/* Dusk painting at 0.44 scale, campfire centroid at (572, 318): the flame sits just right of the
	   phone-app avatar (x 274-552). Feather on an 8-degree lean; smoothstep stops along the 82deg
	   gradient line (length 1623.7px): s = 0.9903 * (x - 792) - 0.1392 * (y - 198) + 811.85. */
	.art {
		position: absolute; inset: 0;
		background: url('/design/social-banners/art/hero-landscape-dusk-banner.jpg') -173px -89px / 1211px 676px no-repeat;
		-webkit-mask-image:
			linear-gradient(82deg, #000 0, #000 597.1px, rgba(0,0,0,.972) 604.3px, rgba(0,0,0,.896) 611.5px, rgba(0,0,0,.784) 618.7px, rgba(0,0,0,.648) 625.9px, rgba(0,0,0,.5) 633.1px, rgba(0,0,0,.352) 640.3px, rgba(0,0,0,.216) 647.5px, rgba(0,0,0,.104) 654.7px, rgba(0,0,0,.028) 661.9px, transparent 669.1px),
			linear-gradient(to bottom, rgba(0,0,0,.55) 0, rgba(0,0,0,.8) 16px, rgba(0,0,0,.95) 28px, #000 40px, #000 396px);
		-webkit-mask-composite: source-in;
		mask-composite: intersect;
	}

	.rule { position: absolute; left: 676px; right: 0; height: 0; border-top: 1px solid #3b3631; }
	.rule.top { border-top: 1.5px solid rgba(244,240,232,.8); }

	.dateline { position: absolute; left: 676px; width: 644px; top: 32px; height: 36px; display: flex; align-items: center; justify-content: space-between; }
	.proof { font: 500 19px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--d-muted); white-space: nowrap; }
	.proof b { font-weight: 500; color: var(--d-text); }
	.proof .dot { margin: 0 .3em; }
	.lockup { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1; letter-spacing: -0.01em; color: var(--d-text); }
	.mark { width: 26px; height: 26px; flex: none; }

	h1 {
		position: absolute; left: 674.5px; top: 80px;
		font: 600 69.6px/0.9 var(--font-display); letter-spacing: -0.03em; white-space: nowrap;
		color: var(--d-text); font-variation-settings: 'opsz' 96;
	}
	h1 .dim { color: var(--d-muted); }

	.deck {
		position: absolute; left: 676px; top: 163px;
		font: 400 30px/1.2 'Inter Banner', var(--font-body); font-feature-settings: 'cv08' 1; letter-spacing: -0.016em; color: #b0a89c; white-space: nowrap;
	}
	.deck b { font-weight: 600; color: var(--d-text); }

	.stack { position: absolute; left: 676px; width: 644px; top: 256px; }
	.label { display: flex; align-items: center; gap: 14px; }
	.label span { font: 500 15px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--d-muted); flex: none; }
	.label::after { content: ''; flex: 1; height: 1px; background: #3b3631; }
	.tools { display: flex; align-items: stretch; margin-top: 12px; white-space: nowrap; }
	.tools .t { font: 600 29px/1 var(--font-body); letter-spacing: -0.012em; color: var(--d-text); padding: 0 14.37px; border-left: 1px solid #57514a; }
	.tools .t:first-child { padding-left: 0; border-left: 0; }
	.tools .t:last-child { padding-right: 0; }
	.tools .t.more { color: var(--d-muted); font-weight: 500; }

	.strand { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="canvas">
	<div class="art" aria-hidden="true"></div>

	<div class="rule top" style="top:32px"></div>
	<div class="dateline">
		<span class="proof" data-m="proof"><b>20+</b> agents &amp; apps<span class="dot">·</span><b>18M+</b> visits</span>
		<span class="lockup" data-m="lockup"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M47.5 16.5 C44 10.5 36 8 28 10.5 C18.5 13.5 16 23.5 22.5 27.5 C28 31 36.5 32 42 36 C50.5 42 48 52.5 39 55 C31 57.3 22 54.5 17.5 47.5" fill="none" stroke="#f4f0e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.5" cy="47.5" r="5.8" fill="#e85c33"/></svg>swapbiswas.com</span>
	</div>
	<div class="rule" style="top:68px"></div>

	<h1 data-m="h1"><span class="dim">A marketer</span> who builds.</h1>

	<p class="deck" data-m="deck"><b>I love AI</b> enough to ship my own<br>tools and automations.</p>

	<div class="stack" data-m="stack">
		<div class="label"><span>Stack</span></div>
		<div class="tools"><span class="t">Claude</span><span class="t">Replit</span><span class="t">Lovable</span><span class="t">Gemini</span><span class="t more">+ more</span></div>
	</div>

	<svg class="strand" width="1584" height="396" viewBox="0 0 1584 396" aria-hidden="true">
		<defs>
			<!-- x 320 -> 760. Bone throughout: invisible under the desktop avatar, ~.3 where it leaves the
			     phone avatar (552) and crosses the fire's reflection (~572), .8 on charcoal (676+). -->
			<linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="320" y1="0" x2="760" y2="0">
				<stop offset="0" stop-color="#e2dbd0" stop-opacity="0"/>
				<stop offset=".3" stop-color="#e2dbd0" stop-opacity=".2"/>
				<stop offset=".575" stop-color="#e2dbd0" stop-opacity=".32"/>
				<stop offset=".793" stop-color="#f4f0e8" stop-opacity=".7"/>
				<stop offset=".809" stop-color="#f4f0e8" stop-opacity=".8"/>
				<stop offset="1" stop-color="#f4f0e8" stop-opacity=".8"/>
			</linearGradient>
		</defs>
		<path id="strand" fill="none" stroke="url(#sg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
	</svg>
</div>
<script>
	(function () {
		var c = { x0: 320, x1: 1584, y: 346, s0: 400, s1: 690, A: 7, P: 58 };
		var d = '';
		for (var x = c.x0; x <= c.s1; x += 1) {
			var t = Math.min(1, Math.max(0, (x - c.s0) / (c.s1 - c.s0)));
			var k = 1 - t * t * (3 - 2 * t);
			var n = 0.82 * Math.sin(2 * Math.PI * (x - c.x0) / c.P) + 0.22 * Math.sin(2 * Math.PI * (x - c.x0) / (c.P * 0.43) + 1.1);
			d += (x === c.x0 ? 'M' : 'L') + x + ' ' + (c.y + c.A * k * n).toFixed(2);
		}
		d += 'L' + c.x1 + ' ' + c.y;
		document.getElementById('strand').setAttribute('d', d);
	})();
</script>
<script>
	// Tool row: fit edge to edge with padding at 0.6em, as in v2/final. Deterministic, so re-renders match.
	document.fonts.ready.then(function () {
		var row = document.querySelector('.tools'), cells = [].slice.call(row.children), n = cells.length, r = 0.6, MAX = 36;
		var fs0 = parseFloat(getComputedStyle(cells[0]).fontSize), W = row.getBoundingClientRect().width;
		cells.forEach(function (c) { c.style.padding = '0'; });
		var S0 = cells.reduce(function (a, c) { return a + c.getBoundingClientRect().width; }, 0);
		var fs = Math.min(MAX, W / (S0 / fs0 + 2 * (n - 1) * r));
		cells.forEach(function (c) { c.style.fontSize = fs + 'px'; });
		var S = cells.reduce(function (a, c) { return a + c.getBoundingClientRect().width; }, 0), p = (W - S) / (2 * (n - 1));
		cells.forEach(function (c, i) { c.style.paddingLeft = i ? p + 'px' : '0'; c.style.paddingRight = i < n - 1 ? p + 'px' : '0'; });
		document.body.dataset.toolFit = fs.toFixed(1) + 'px / pad ' + p.toFixed(1) + 'px';
	});
</script>
</body>
</html>
