<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dusk alternate - X header</title>
<link rel="stylesheet" href="/design/social-banners/brand.css">
<style>
	/* Deck uses the banner-only Inter subset with cv08 (serifed capital I), same as v2/final, so "I love AI" cannot read as "l love Al" on phones. */
	@font-face { font-family: 'Inter Banner'; font-style: normal; font-weight: 100 900;
		src: url('/design/social-banners/fonts/inter-cv08-latin.woff2') format('woff2'); }
	/* Dark alternate to the light workshop masthead. Same copy system and the same order:
	   dateline > nameplate > deck > tool row > strand. The painting is the homepage's dark-mode
	   art, bled in from the left so the avatar lands on trees, feathered into charcoal before
	   the copy column (L = 640, R = 1436, the light set's right margin).
	   Vermilion notes: the painting's campfire (the one hot spot) and the tiny S head. The strand is
	   bone only: it fades in from under the avatar, crosses the painting faintly, settles at .8. */
	html, body { overflow: hidden; }
	body { background: var(--d-ground); color: var(--d-text); }
	.canvas { position: relative; width: 1500px; height: 500px; overflow: hidden; background: var(--d-ground); }

	/* Dusk painting at 0.5 scale, campfire centroid at (481, 391), right of both avatar circles. */
	.art {
		position: absolute; inset: 0;
		background: url('/design/social-banners/art/hero-landscape-dusk-banner.jpg') -366px -71px / 1376px 768px no-repeat;
		-webkit-mask-image:
			linear-gradient(to right, #000 0, #000 504px, rgba(0,0,0,.972) 516px, rgba(0,0,0,.896) 528px, rgba(0,0,0,.784) 540px, rgba(0,0,0,.648) 552px, rgba(0,0,0,.5) 564px, rgba(0,0,0,.352) 576px, rgba(0,0,0,.216) 588px, rgba(0,0,0,.104) 600px, rgba(0,0,0,.028) 612px, transparent 624px),
			linear-gradient(to bottom, rgba(0,0,0,.55) 0, rgba(0,0,0,.8) 16px, rgba(0,0,0,.95) 28px, #000 40px, #000 440px, rgba(0,0,0,.6) 500px);
		-webkit-mask-composite: source-in;
		mask-composite: intersect;
	}

	.rule { position: absolute; left: 640px; right: 64px; height: 0; border-top: 1px solid #3b3631; }
	.rule.top { border-top: 1.5px solid rgba(244,240,232,.8); }

	/* Dateline: proof in muted mono (folded out of the old side column), lockup at display size. */
	.dateline { position: absolute; left: 640px; right: 64px; top: 72px; height: 44px; display: flex; align-items: center; justify-content: space-between; }
	.proof { font: 500 22px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--d-muted); white-space: nowrap; }
	.proof b { font-weight: 500; color: var(--d-text); }
	.proof .dot { margin: 0 .35em; }
	.lockup { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1; letter-spacing: -0.01em; color: var(--d-text); }
	.mark { width: 30px; height: 30px; flex: none; }

	/* Two-tone nameplate (DESIGN.md s.3): muted first half, paper on the pivot. */
	h1 {
		position: absolute; left: 638px; top: 128px;
		font: 600 86px/0.9 var(--font-display); letter-spacing: -0.03em; white-space: nowrap;
		color: var(--d-text); font-variation-settings: 'opsz' 96;
	}
	h1 .dim { color: var(--d-muted); }

	.deck {
		position: absolute; left: 640px; top: 230px;
		font: 400 36px/1.18 'Inter Banner', var(--font-body); font-feature-settings: 'cv08' 1; letter-spacing: -0.016em; color: #b0a89c; white-space: nowrap;
	}
	.deck b { font-weight: 600; color: var(--d-text); }

	.stack { position: absolute; left: 640px; right: 64px; top: 340px; }
	.label { display: flex; align-items: center; gap: 16px; }
	.label span { font: 500 16px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--d-muted); flex: none; }
	.label::after { content: ''; flex: 1; height: 1px; background: #3b3631; }
	.tools { display: flex; align-items: stretch; margin-top: 14px; white-space: nowrap; }
	.tools .t { font: 600 36px/1 var(--font-body); letter-spacing: -0.012em; color: var(--d-text); padding: 0 18.38px; border-left: 1px solid #57514a; }
	.tools .t:first-child { padding-left: 0; border-left: 0; }
	.tools .t:last-child { padding-right: 0; }
	.tools .t.more { color: var(--d-muted); font-weight: 500; }

	.strand { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="canvas">
	<div class="art" aria-hidden="true"></div>

	<div class="rule top" style="top:72px"></div>
	<div class="dateline">
		<span class="proof" data-m="proof"><b>20+</b> agents &amp; apps<span class="dot">·</span><b>18M+</b> visits</span>
		<span class="lockup" data-m="lockup"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M47.5 16.5 C44 10.5 36 8 28 10.5 C18.5 13.5 16 23.5 22.5 27.5 C28 31 36.5 32 42 36 C50.5 42 48 52.5 39 55 C31 57.3 22 54.5 17.5 47.5" fill="none" stroke="#f4f0e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.5" cy="47.5" r="5.8" fill="#e85c33"/></svg>swapbiswas.com</span>
	</div>
	<div class="rule" style="top:116px"></div>

	<h1 data-m="h1"><span class="dim">A marketer</span> who builds.</h1>

	<p class="deck" data-m="deck"><b>I love AI</b> enough to ship my own<br>tools and automations.</p>

	<div class="stack" data-m="stack">
		<div class="label"><span>Stack</span></div>
		<div class="tools"><span class="t">Claude</span><span class="t">Replit</span><span class="t">Lovable</span><span class="t">Gemini</span><span class="t more">+ more</span></div>
	</div>

	<svg class="strand" width="1500" height="500" viewBox="0 0 1500 500" aria-hidden="true">
		<defs>
			<!-- x 188 -> 700. Bone throughout: invisible under the avatar, ~.3 where it leaves the
			     phone avatar (436) and crosses the fire's reflection (480-490), .8 on charcoal (640+). -->
			<linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="188" y1="0" x2="700" y2="0">
				<stop offset="0" stop-color="#e2dbd0" stop-opacity="0"/>
				<stop offset=".34" stop-color="#e2dbd0" stop-opacity=".22"/>
				<stop offset=".6" stop-color="#e2dbd0" stop-opacity=".34"/>
				<stop offset=".85" stop-color="#f4f0e8" stop-opacity=".7"/>
				<stop offset=".883" stop-color="#f4f0e8" stop-opacity=".8"/>
				<stop offset="1" stop-color="#f4f0e8" stop-opacity=".8"/>
			</linearGradient>
		</defs>
		<path id="strand" fill="none" stroke="url(#sg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
	</svg>
</div>
<script>
	// Raw carrier -> settled rule. Deterministic, so re-renders match.
	(function () {
		var c = { x0: 188, x1: 1436, y: 430, s0: 300, s1: 650, A: 8, P: 64 };
		var d = '';
		for (var x = c.x0; x <= c.s1; x += 1) {
			var t = Math.min(1, Math.max(0, (x - c.s0) / (c.s1 - c.s0)));
			var k = 1 - t * t * (3 - 2 * t);
			var n = 0.82 * Math.sin(2 * Math.PI * (x - c.x0) / c.P) + 0.22 * Math.sin(2 * Math.PI * (x - c.x0) / (c.P * 0.43) + 1.1);
			d += (x === c.x0 ? 'M' : 'L') + x + ' ' + (c.y + c.A * k * n).toFixed(2);
		}
		d += 'L' + c.x1 + ' ' + c.y;
		document.getElementById('strand').setAttribute('d', d);
	})();
</script>
<script>
	// Tool row: fit edge to edge with padding at 0.6em, as in v2/final. Deterministic, so re-renders match.
	document.fonts.ready.then(function () {
		var row = document.querySelector('.tools'), cells = [].slice.call(row.children), n = cells.length, r = 0.6, MAX = 44;
		var fs0 = parseFloat(getComputedStyle(cells[0]).fontSize), W = row.getBoundingClientRect().width;
		cells.forEach(function (c) { c.style.padding = '0'; });
		var S0 = cells.reduce(function (a, c) { return a + c.getBoundingClientRect().width; }, 0);
		var fs = Math.min(MAX, W / (S0 / fs0 + 2 * (n - 1) * r));
		cells.forEach(function (c) { c.style.fontSize = fs + 'px'; });
		var S = cells.reduce(function (a, c) { return a + c.getBoundingClientRect().width; }, 0), p = (W - S) / (2 * (n - 1));
		cells.forEach(function (c, i) { c.style.paddingLeft = i ? p + 'px' : '0'; c.style.paddingRight = i < n - 1 ? p + 'px' : '0'; });
		document.body.dataset.toolFit = fs.toFixed(1) + 'px / pad ' + p.toFixed(1) + 'px';
	});
</script>
</body>
</html>
