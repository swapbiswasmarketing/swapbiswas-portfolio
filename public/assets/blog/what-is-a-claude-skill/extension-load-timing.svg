  <text x="368" y="418" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Name + description only</text>
  <text x="698" y="404" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Body when invoked;</text>
  <text x="698" y="434" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">files when a step needs them</text>
  <text x="1028" y="418" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>

