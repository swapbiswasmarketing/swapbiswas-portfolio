  <text x="368" y="586" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>
  <text x="698" y="572" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Own context window,</text>
  <text x="698" y="602" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">when spawned</text>
  <text x="1028" y="586" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>

  <text x="88" y="662" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Hook</text>
  <text x="368" y="662" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>
  <text x="698" y="662" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>
  <text x="1028" y="648" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Runs outside the chat;</text>
  <text x="1028" y="678" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">no context by default</text>
