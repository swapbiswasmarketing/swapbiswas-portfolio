  <text x="368" y="488" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Tool names and</text>
  <text x="368" y="518" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">server instructions</text>
  <text x="698" y="488" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Full tool schema when</text>
  <text x="698" y="518" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">a tool is used</text>
  <text x="1028" y="502" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>

