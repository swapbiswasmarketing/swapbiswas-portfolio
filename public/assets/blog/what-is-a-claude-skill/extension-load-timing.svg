  <text x="88" y="250" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">CLAUDE.md</text>
  <text x="368" y="250" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Full file, every session</text>
  <text x="698" y="236" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Subfolder files, when</text>
  <text x="698" y="266" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Claude works there</text>
  <text x="1028" y="250" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>

  <text x="88" y="334" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Auto memory</text>
  <text x="368" y="320" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">MEMORY.md index, first</text>
  <text x="368" y="350" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">200 lines or 25KB</text>
  <text x="698" y="320" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Topic files, read</text>
  <text x="698" y="350" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">when relevant</text>
  <text x="1028" y="334" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">-</text>

