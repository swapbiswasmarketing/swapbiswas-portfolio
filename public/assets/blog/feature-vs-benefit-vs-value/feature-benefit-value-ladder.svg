<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" width="1400" height="810">
  <rect x="0" y="0" width="1400" height="810" fill="#f6f4ef"/>

  <text x="50" y="74" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Where each tier is checked, and how it fails</text>
  <text x="50" y="114" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Each tier has its own owner and its own place to check it.</text>

  <text x="50" y="236" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Climb one rung at a time</text>
  <text x="50" y="274" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Write the next line only when</text>
  <text x="50" y="306" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">the one below passes its test.</text>

  <rect x="50" y="410" width="390" height="350" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="78" y="454" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">1 / FEATURE</text>
  <text x="78" y="498" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Belongs to the product</text>
  <line x1="78" y1="522" x2="412" y2="522" stroke="#e4dfd6" stroke-width="1"/>
  <text x="78" y="556" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">CHECK IT IN</text>
  <text x="78" y="590" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Docs, spec sheet, pricing</text>
  <text x="78" y="622" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">page or changelog</text>
  <text x="78" y="664" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">FAILS WHEN</text>
  <text x="78" y="698" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">It is only an adjective:</text>
  <text x="78" y="730" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">"enterprise-grade"</text>

  <line x1="446" y1="535" x2="481" y2="535" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="480,528 494,535 480,542" fill="#15130f"/>

  <rect x="500" y="310" width="390" height="350" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="528" y="354" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">2 / BENEFIT</text>
  <text x="528" y="398" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Belongs to the user</text>
  <line x1="528" y1="422" x2="862" y2="422" stroke="#e4dfd6" stroke-width="1"/>
  <text x="528" y="456" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">CHECK IT IN</text>
  <text x="528" y="490" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">The user's working week:</text>
  <text x="528" y="522" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">a task they now do or drop</text>
  <text x="528" y="564" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">FAILS WHEN</text>
  <text x="528" y="598" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No task is named:</text>
  <text x="528" y="630" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">"save time"</text>

  <line x1="896" y1="435" x2="931" y2="435" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="930,428 944,435 930,442" fill="#15130f"/>

  <rect x="950" y="210" width="390" height="350" rx="12" fill="#ffffff" stroke="#b53b15" stroke-width="2"/>
  <text x="978" y="254" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#b53b15">3 / VALUE</text>
  <text x="978" y="298" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Belongs to the buyer</text>
  <line x1="978" y1="322" x2="1312" y2="322" stroke="#e4dfd6" stroke-width="1"/>
  <text x="978" y="356" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">CHECK IT IN</text>
  <text x="978" y="390" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">A report the buyer</text>
  <text x="978" y="422" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">already sends upward</text>
  <text x="978" y="464" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">FAILS WHEN</text>
  <text x="978" y="498" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No reported number moves:</text>
  <text x="978" y="530" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">"drive growth"</text>
</svg>
