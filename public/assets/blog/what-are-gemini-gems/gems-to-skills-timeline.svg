<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <rect x="0" y="0" width="1400" height="820" fill="#f6f4ef"/>

  <text x="40" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" fill="#15130f" letter-spacing="-0.76">When Gemini Gems go away, by account type</text>
  <text x="40" y="110" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">From Google's Gemini and Workspace help pages, read 25 October 2026. Workspace dates are "no sooner than".</text>

  <g font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#6a645c">
    <text x="384" y="168">Oct 2026</text>
    <text x="494" y="168">Nov</text>
    <text x="604" y="168">Dec</text>
    <text x="714" y="168">Jan 2027</text>
    <text x="824" y="168">Feb</text>
    <text x="934" y="168">Mar</text>
    <text x="1044" y="168">Apr</text>
    <text x="1154" y="168">May</text>
    <text x="1264" y="168">Jun</text>
  </g>

  <g fill="#ffffff" stroke="#e4dfd6" stroke-width="1">
    <rect x="40" y="186" width="1320" height="96" rx="12"/>
    <rect x="40" y="294" width="1320" height="96" rx="12"/>
    <rect x="40" y="402" width="1320" height="96" rx="12"/>
    <rect x="40" y="510" width="1320" height="96" rx="12"/>
    <rect x="40" y="618" width="1320" height="96" rx="12"/>
  </g>

  <g stroke="#e4dfd6" stroke-width="1">
    <line x1="380" y1="176" x2="380" y2="714"/>
    <line x1="490" y1="176" x2="490" y2="714"/>
    <line x1="600" y1="176" x2="600" y2="714"/>
    <line x1="710" y1="176" x2="710" y2="714"/>
    <line x1="820" y1="176" x2="820" y2="714"/>
    <line x1="930" y1="176" x2="930" y2="714"/>
    <line x1="1040" y1="176" x2="1040" y2="714"/>
    <line x1="1150" y1="176" x2="1150" y2="714"/>
    <line x1="1260" y1="176" x2="1260" y2="714"/>
  </g>

  <g font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">
    <text x="62" y="222">Personal account</text>
    <text x="62" y="330">Personal account</text>
    <text x="62" y="436">Workspace</text>
    <text x="62" y="546">Workspace</text>
    <text x="62" y="654">Opal and</text>
  </g>
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">
    <text x="62" y="250">18 and over</text>
    <text x="62" y="358">under 18</text>
    <text x="62" y="462">business, enterprise,</text>
    <text x="62" y="486">non-profit</text>
    <text x="62" y="574">education</text>
    <text x="62" y="682">Gems made by Labs</text>
  </g>

  <rect x="380" y="208" width="169" height="22" fill="#6a645c"/>
  <rect x="549" y="208" width="110" height="22" fill="#eeebe4" stroke="#6a645c" stroke-width="1.5"/>
  <circle cx="659" cy="219" r="11" fill="#b53b15"/>
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20">
    <text x="543" y="266" text-anchor="end" fill="#3a3632">17 Nov: read-only</text>
    <text x="667" y="266" fill="#b53b15" font-weight="600">17 Dec: removed from Gemini</text>
  </g>

  <rect x="380" y="316" width="960" height="22" fill="#ffffff" stroke="#6a645c" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="384" y="374" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Later date; Google says it will share more details soon</text>

  <rect x="380" y="424" width="550" height="22" fill="#6a645c"/>
  <line x1="549" y1="418" x2="549" y2="452" stroke="#15130f" stroke-width="3"/>
  <circle cx="930" cy="435" r="11" fill="#15130f"/>
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <text x="950" y="430">No sooner than 1 Mar 2027:</text>
    <text x="950" y="456">removed, become draft skills</text>
    <text x="384" y="484">17 Nov: Gems move to Settings, still usable</text>
  </g>

  <rect x="380" y="532" width="880" height="22" fill="#6a645c"/>
  <line x1="549" y1="526" x2="549" y2="560" stroke="#15130f" stroke-width="3"/>
  <circle cx="1260" cy="543" r="11" fill="#15130f"/>
  <text x="384" y="592" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">17 Nov: moves to Settings</text>
  <text x="1250" y="592" text-anchor="end" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No sooner than 1 Jun 2027: removed, become draft skills</text>

  <rect x="380" y="640" width="169" height="22" fill="#6a645c"/>
  <circle cx="549" cy="651" r="11" fill="#15130f"/>
  <text x="569" y="658" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">17 Nov 2026: turned off; Opal workflows do not migrate</text>

  <rect x="40" y="748" width="34" height="20" fill="#6a645c"/>
  <text x="86" y="765" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Gems usable</text>
  <rect x="250" y="748" width="34" height="20" fill="#eeebe4" stroke="#6a645c" stroke-width="1.5"/>
  <text x="296" y="765" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Read-only: open, but no use, edits or new Gems</text>
  <rect x="790" y="748" width="34" height="20" fill="#ffffff" stroke="#6a645c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="836" y="765" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Date not announced</text>
</svg>
