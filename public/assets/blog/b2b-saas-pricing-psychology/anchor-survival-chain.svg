<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" width="1400" height="1120" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="1120" rx="24" fill="url(#bg)"/>

  <text x="80" y="64" font-size="40" font-weight="700" fill="#f0f6fc">Where a B2B Price Anchor Has to Survive</text>
  <text x="80" y="106" font-size="24" fill="#9ca3af">Four artifacts carry the price. The audit scores five checks in each.</text>

  <!-- CARD 1 -->
  <rect x="80" y="150" width="580" height="376" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="110" y="178" width="70" height="6" rx="3" fill="#c084fc"/>
  <text x="110" y="216" font-size="20" font-weight="700" fill="#c084fc" letter-spacing="0.08em">ARTIFACT 1</text>
  <text x="110" y="260" font-size="30" font-weight="600" fill="#f0f6fc">Pricing Page</text>
  <line x1="110" y1="284" x2="630" y2="284" stroke="#30363d" stroke-width="1.5"/>
  <text x="110" y="320" font-size="20" fill="#9ca3af" letter-spacing="0.06em">WHO FEELS IT</text>
  <text x="110" y="350" font-size="22" fill="#c8cfd8">The champion, alone at a desk</text>
  <text x="110" y="390" font-size="20" fill="#9ca3af" letter-spacing="0.06em">DOMINANT BIAS</text>
  <text x="110" y="420" font-size="22" fill="#c8cfd8">Anchoring and the badged tier</text>
  <text x="110" y="460" font-size="20" fill="#9ca3af" letter-spacing="0.06em">BREAKS WHEN</text>
  <text x="110" y="490" font-size="22" fill="#c8cfd8">The ladder has no stated reason</text>

  <!-- ARROW 1 -> 2 -->
  <line x1="666" y1="338" x2="716" y2="338" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="716,331 732,338 716,345" fill="#5eead4"/>

  <!-- CARD 2 -->
  <rect x="740" y="150" width="580" height="376" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="770" y="178" width="70" height="6" rx="3" fill="#60a5fa"/>
  <text x="770" y="216" font-size="20" font-weight="700" fill="#60a5fa" letter-spacing="0.08em">ARTIFACT 2</text>
  <text x="770" y="260" font-size="30" font-weight="600" fill="#f0f6fc">Sales Deck</text>
  <line x1="770" y1="284" x2="1290" y2="284" stroke="#30363d" stroke-width="1.5"/>
  <text x="770" y="320" font-size="20" fill="#9ca3af" letter-spacing="0.06em">WHO FEELS IT</text>
  <text x="770" y="350" font-size="22" fill="#c8cfd8">The committee, second-hand</text>
  <text x="770" y="390" font-size="20" fill="#9ca3af" letter-spacing="0.06em">DOMINANT BIAS</text>
  <text x="770" y="420" font-size="22" fill="#c8cfd8">Framing and social proof</text>
  <text x="770" y="460" font-size="20" fill="#9ca3af" letter-spacing="0.06em">BREAKS WHEN</text>
  <text x="770" y="490" font-size="22" fill="#c8cfd8">It is re-pitched from memory</text>

  <!-- ROW TRANSITION 2 -> 3 -->
  <line x1="1030" y1="526" x2="1030" y2="556" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1030" y1="556" x2="370" y2="556" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="370" y1="556" x2="370" y2="580" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="362,580 378,580 370,594" fill="#5eead4"/>

  <!-- CARD 3 -->
  <rect x="80" y="596" width="580" height="376" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="110" y="624" width="70" height="6" rx="3" fill="#fb923c"/>
  <text x="110" y="662" font-size="20" font-weight="700" fill="#fb923c" letter-spacing="0.08em">ARTIFACT 3</text>
  <text x="110" y="706" font-size="30" font-weight="600" fill="#f0f6fc">Quote and Order Form</text>
  <line x1="110" y1="730" x2="630" y2="730" stroke="#30363d" stroke-width="1.5"/>
  <text x="110" y="766" font-size="20" fill="#9ca3af" letter-spacing="0.06em">WHO FEELS IT</text>
  <text x="110" y="796" font-size="22" fill="#c8cfd8">Procurement and finance</text>
  <text x="110" y="836" font-size="20" fill="#9ca3af" letter-spacing="0.06em">DOMINANT BIAS</text>
  <text x="110" y="866" font-size="22" fill="#c8cfd8">Charm pricing, inverted</text>
  <text x="110" y="906" font-size="20" fill="#9ca3af" letter-spacing="0.06em">BREAKS WHEN</text>
  <text x="110" y="936" font-size="22" fill="#c8cfd8">A .99 price meets 240 seats</text>

  <!-- ARROW 3 -> 4 -->
  <line x1="666" y1="784" x2="716" y2="784" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="716,777 732,784 716,791" fill="#5eead4"/>

  <!-- CARD 4 -->
  <rect x="740" y="596" width="580" height="376" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="770" y="624" width="70" height="6" rx="3" fill="#f5a0a1"/>
  <text x="770" y="662" font-size="20" font-weight="700" fill="#f5a0a1" letter-spacing="0.08em">ARTIFACT 4</text>
  <text x="770" y="706" font-size="30" font-weight="600" fill="#f0f6fc">Renewal Notice</text>
  <line x1="770" y1="730" x2="1290" y2="730" stroke="#30363d" stroke-width="1.5"/>
  <text x="770" y="766" font-size="20" fill="#9ca3af" letter-spacing="0.06em">WHO FEELS IT</text>
  <text x="770" y="796" font-size="22" fill="#c8cfd8">The budget owner</text>
  <text x="770" y="836" font-size="20" fill="#9ca3af" letter-spacing="0.06em">DOMINANT BIAS</text>
  <text x="770" y="866" font-size="22" fill="#c8cfd8">Loss aversion</text>
  <text x="770" y="906" font-size="20" fill="#9ca3af" letter-spacing="0.06em">BREAKS WHEN</text>
  <text x="770" y="936" font-size="22" fill="#c8cfd8">The anchor was never re-set</text>

  <!-- FOOTER -->
  <rect x="320" y="1010" width="760" height="74" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
  <text x="700" y="1055" font-size="22" fill="#c8cfd8" text-anchor="middle">20 checks, 5 per artifact. 17 or more and the anchor holds.</text>
</svg>
