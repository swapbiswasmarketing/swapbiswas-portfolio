<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830">
  <rect x="0" y="0" width="1400" height="830" fill="#f6f4ef"/>

  <text x="40" y="62" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" fill="#15130f" letter-spacing="-0.02em">The Customer Discovery Loop for Established Teams</text>
  <text x="40" y="102" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Five steps, run against the answer you are hoping to hear</text>

  <!-- Row 1 -->
  <rect x="40" y="140" width="400" height="230" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="68" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c" letter-spacing="0.12em">STEP 01</text>
  <text x="68" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Frame the Decision</text>
  <text x="68" y="264" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Name the call this research</text>
  <text x="68" y="296" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">will change, and the answer</text>
  <text x="68" y="328" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">you are hoping to hear.</text>

  <rect x="500" y="140" width="400" height="230" rx="12" fill="#f3dcd2" stroke="#e4dfd6" stroke-width="1"/>
  <text x="528" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#b53b15" letter-spacing="0.12em">STEP 02</text>
  <text x="528" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Recruit Against It</text>
  <text x="528" y="264" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Pick the accounts most</text>
  <text x="528" y="296" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">likely to contradict you.</text>
  <text x="528" y="328" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Sales does not pick them.</text>

  <rect x="960" y="140" width="400" height="230" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="988" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c" letter-spacing="0.12em">STEP 03</text>
  <text x="988" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Ask About Last Time</text>
  <text x="988" y="264" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Past behaviour, with dates</text>
  <text x="988" y="296" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">and names. No opinions,</text>
  <text x="988" y="328" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">no would-you-buy answers.</text>

  <!-- Arrows row 1 -->
  <line x1="452" y1="255" x2="484" y2="255" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="484,248 498,255 484,262" fill="#15130f"/>
  <line x1="912" y1="255" x2="944" y2="255" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="944,248 958,255 944,262" fill="#15130f"/>

  <!-- Row transition 3 to 4 -->
  <line x1="1160" y1="370" x2="1160" y2="405" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1160" y1="405" x2="470" y2="405" stroke="#15130f" stroke-width="2.5"/>
  <line x1="470" y1="405" x2="470" y2="426" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="463,426 477,426 470,440" fill="#15130f"/>

  <!-- Row 2 -->
  <rect x="270" y="440" width="400" height="230" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="298" y="482" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c" letter-spacing="0.12em">STEP 04</text>
  <text x="298" y="522" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Write One Snapshot</text>
  <text x="298" y="564" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Same template, inside 24</text>
  <text x="298" y="596" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">hours. Tag by the job, not</text>
  <text x="298" y="628" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">by the feature requested.</text>

  <rect x="730" y="440" width="400" height="230" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="758" y="482" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c" letter-spacing="0.12em">STEP 05</text>
  <text x="758" y="522" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Stop at Saturation</text>
  <text x="758" y="564" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Two interviews in a row</text>
  <text x="758" y="596" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">with no new theme. Then</text>
  <text x="758" y="628" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">log what changed.</text>

  <!-- Arrow 4 to 5 -->
  <line x1="682" y1="555" x2="714" y2="555" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="714,548 728,555 714,562" fill="#15130f"/>

  <!-- Footer band -->
  <rect x="40" y="712" width="1320" height="78" rx="12" fill="#eeebe4"/>
  <text x="700" y="759" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#15130f">The scarce input at an established company is a story that contradicts the roadmap you already wrote.</text>
</svg>
