<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880">
  <rect x="0" y="0" width="1400" height="880" fill="#f6f4ef"/>

  <text x="60" y="72" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Where each section of the brief goes next</text>
  <text x="60" y="114" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Seven sections each feed an asset built from them. The header links the launch plan.</text>

  <text x="60" y="162" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">IN THE BRIEF</text>
  <text x="700" y="162" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">FEEDS</text>

  <rect x="60" y="180" width="520" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="218" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Launch plan link (header)</text>
  <line x1="592" y1="210" x2="672" y2="210" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="672,203 686,210 672,217" fill="#15130f"/>
  <rect x="700" y="180" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="217" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">The launch plan: tier, dates, owners, channels</text>

  <rect x="60" y="256" width="520" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Audience</text>
  <line x1="592" y1="286" x2="672" y2="286" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="672,279 686,286 672,293" fill="#15130f"/>
  <rect x="700" y="256" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="293" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Buyer persona, messaging matrix columns</text>

  <rect x="60" y="332" width="520" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="370" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Problem, in the buyer's words</text>
  <line x1="592" y1="362" x2="672" y2="362" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="672,355 686,362 672,369" fill="#15130f"/>
  <rect x="700" y="332" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="369" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Landing page hero, value proposition canvas</text>

  <rect x="60" y="408" width="520" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="446" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Competitive alternative</text>
  <line x1="592" y1="438" x2="672" y2="438" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="672,431 686,438 672,445" fill="#15130f"/>
  <rect x="700" y="408" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="445" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Battlecard and objection handling</text>

  <rect x="60" y="484" width="520" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="522" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Positioning statement</text>
  <line x1="592" y1="514" x2="672" y2="514" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="672,507 686,514 672,521" fill="#15130f"/>
  <rect x="700" y="484" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="521" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">One-pager, first slide of the sales deck</text>

  <rect x="60" y="560" width="520" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="598" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Messages and proof</text>
  <line x1="592" y1="590" x2="672" y2="590" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="672,583 686,590 672,597" fill="#15130f"/>
  <rect x="700" y="560" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="597" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Messaging matrix, homepage, emails, ads</text>

  <rect x="60" y="636" width="520" height="60" rx="12" fill="#f3dcd2" stroke="#b53b15" stroke-width="1.5"/>
  <text x="88" y="674" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Claims we will not make</text>
  <line x1="592" y1="666" x2="672" y2="666" stroke="#b53b15" stroke-width="2.5"/>
  <polygon points="672,659 686,666 672,673" fill="#b53b15"/>
  <rect x="700" y="636" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="673" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Legal review, creative briefs, battlecard do-not-say list</text>

  <rect x="60" y="712" width="520" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="750" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Enablement asks</text>
  <line x1="592" y1="742" x2="672" y2="742" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="672,735 686,742 672,749" fill="#15130f"/>
  <rect x="700" y="712" width="640" height="60" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="728" y="749" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Launch enablement package for each team</text>

  <text x="60" y="826" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Section 8, open questions, feeds nothing: it is empty before the brief is signed.</text>
</svg>
