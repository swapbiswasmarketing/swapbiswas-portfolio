<svg width="1400" height="440" viewBox="0 0 1400 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1400" height="440" rx="24" fill="url(#bg)"/>
  <text x="700" y="60" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">Win-Loss Questions by Deal Stage</text>
  <text x="700" y="100" text-anchor="middle" fill="#9ca3af" font-size="24">Ask open questions across all five moments of the deal</text>

  <!-- Card 1: Trigger -->
  <rect x="60" y="150" width="224" height="210" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="84" y="178" width="44" height="6" rx="3" fill="#5eead4"/>
  <text x="84" y="222" fill="#5eead4" font-size="22" font-weight="700">TRIGGER</text>
  <line x1="84" y1="242" x2="260" y2="242" stroke="#30363d" stroke-width="1.5"/>
  <text x="84" y="280" fill="#c8cfd8" font-size="18">Why did they</text>
  <text x="84" y="304" fill="#c8cfd8" font-size="18">start looking?</text>

  <!-- Card 2: Evaluation -->
  <rect x="324" y="150" width="224" height="210" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="348" y="178" width="44" height="6" rx="3" fill="#60a5fa"/>
  <text x="348" y="222" fill="#60a5fa" font-size="22" font-weight="700">EVALUATION</text>
  <line x1="348" y1="242" x2="524" y2="242" stroke="#30363d" stroke-width="1.5"/>
  <text x="348" y="280" fill="#c8cfd8" font-size="18">Who decided,</text>
  <text x="348" y="304" fill="#c8cfd8" font-size="18">on what criteria?</text>

  <!-- Card 3: Competition -->
  <rect x="588" y="150" width="224" height="210" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="612" y="178" width="44" height="6" rx="3" fill="#c084fc"/>
  <text x="612" y="222" fill="#c084fc" font-size="22" font-weight="700">COMPETITION</text>
  <line x1="612" y1="242" x2="788" y2="242" stroke="#30363d" stroke-width="1.5"/>
  <text x="612" y="280" fill="#c8cfd8" font-size="18">Where did we</text>
  <text x="612" y="304" fill="#c8cfd8" font-size="18">stand vs rivals?</text>

  <!-- Card 4: Decision -->
  <rect x="852" y="150" width="224" height="210" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="876" y="178" width="44" height="6" rx="3" fill="#b388f2"/>
  <text x="876" y="222" fill="#b388f2" font-size="22" font-weight="700">DECISION</text>
  <line x1="876" y1="242" x2="1052" y2="242" stroke="#30363d" stroke-width="1.5"/>
  <text x="876" y="280" fill="#c8cfd8" font-size="18">What ultimately</text>
  <text x="876" y="304" fill="#c8cfd8" font-size="18">tipped it?</text>

  <!-- Card 5: Future -->
  <rect x="1116" y="150" width="224" height="210" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="1140" y="178" width="44" height="6" rx="3" fill="#fb923c"/>
  <text x="1140" y="222" fill="#fb923c" font-size="22" font-weight="700">FUTURE</text>
  <line x1="1140" y1="242" x2="1316" y2="242" stroke="#30363d" stroke-width="1.5"/>
  <text x="1140" y="280" fill="#c8cfd8" font-size="18">What would have</text>
  <text x="1140" y="304" fill="#c8cfd8" font-size="18">changed it?</text>

  <!-- Arrows -->
  <line x1="289" y1="255" x2="311" y2="255" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="311,248 311,262 323,255" fill="#5eead4"/>
  <line x1="553" y1="255" x2="575" y2="255" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="575,248 575,262 587,255" fill="#5eead4"/>
  <line x1="817" y1="255" x2="839" y2="255" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="839,248 839,262 851,255" fill="#5eead4"/>
  <line x1="1081" y1="255" x2="1103" y2="255" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="1103,248 1103,262 1115,255" fill="#5eead4"/>

  <text x="700" y="408" text-anchor="middle" fill="#9ca3af" font-size="20">Use a neutral interviewer, ask open questions, then stay quiet</text>
</svg>
