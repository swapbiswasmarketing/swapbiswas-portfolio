<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="700" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">ABM vs Inbound: Two Motions, One Program</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="22">Inbound casts a wide net. ABM goes narrow and deep. The best teams run both as a loop.</text>

  <!-- Inbound card -->
  <rect x="60" y="140" width="600" height="420" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="60" y="140" width="600" height="6" rx="3" fill="#fb923c"/>
  <text x="90" y="190" fill="#fb923c" font-size="21" font-weight="700" letter-spacing="0.07em">INBOUND MARKETING</text>
  <text x="90" y="232" fill="#f0f6fc" font-size="27" font-weight="600">Wide net · they find you</text>
  <text x="90" y="292" fill="#c8cfd8" font-size="22">SEO, content, and organic reach</text>
  <text x="90" y="344" fill="#c8cfd8" font-size="22">Aimed at the whole market</text>
  <text x="90" y="396" fill="#c8cfd8" font-size="22">Low cost per touch, high volume</text>
  <text x="90" y="448" fill="#c8cfd8" font-size="22">Best for large TAM, lower ACV</text>
  <text x="90" y="512" fill="#9ca3af" font-size="20">Fails on relevance: poor-fit leads</text>

  <!-- ABM card -->
  <rect x="740" y="140" width="600" height="420" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="740" y="140" width="600" height="6" rx="3" fill="#c084fc"/>
  <text x="770" y="190" fill="#c084fc" font-size="21" font-weight="700" letter-spacing="0.07em">ACCOUNT-BASED MARKETING</text>
  <text x="770" y="232" fill="#f0f6fc" font-size="27" font-weight="600">Narrow net · you pick them</text>
  <text x="770" y="292" fill="#c8cfd8" font-size="22">Targeted ads and 1:1 outreach</text>
  <text x="770" y="344" fill="#c8cfd8" font-size="22">Aimed at a named account list</text>
  <text x="770" y="396" fill="#c8cfd8" font-size="22">High cost per account, low volume</text>
  <text x="770" y="448" fill="#c8cfd8" font-size="22">Best for small TAM, high ACV</text>
  <text x="770" y="512" fill="#9ca3af" font-size="20">Fails on selection: wrong accounts</text>

  <!-- Mutual-feed arrows in the gap -->
  <line x1="666" y1="300" x2="734" y2="300" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="729,293 743,300 729,307" fill="#5eead4"/>
  <line x1="734" y1="410" x2="666" y2="410" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="671,403 657,410 671,417" fill="#5eead4"/>

  <!-- Combined loop band -->
  <rect x="60" y="600" width="1280" height="120" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="60" y="600" width="8" height="120" rx="4" fill="#5eead4"/>
  <text x="96" y="644" fill="#5eead4" font-size="20" font-weight="700" letter-spacing="0.08em">ONE PROGRAM, ONE LOOP</text>
  <text x="96" y="680" fill="#c8cfd8" font-size="21">Inbound signals feed ABM account selection. ABM converts the accounts inbound already warmed.</text>
  <text x="96" y="708" fill="#c8cfd8" font-size="21">Closed accounts feed the next inbound cycle with proof and referrals.</text>
</svg>
