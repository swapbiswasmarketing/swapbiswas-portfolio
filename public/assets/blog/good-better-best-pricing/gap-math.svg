<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" width="1400" height="810" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="810" rx="24" fill="url(#bg2)"/>

  <text x="700" y="62" text-anchor="middle" fill="#f0f6fc" font-size="38" font-weight="700">The Gap Math</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="24">How far apart the three tiers sit, and what each one owes you</text>

  <!-- Tier cards -->
  <rect x="60" y="140" width="360" height="260" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="88" y="184" fill="#5eead4" font-size="20" font-weight="700" letter-spacing="0.08em">GOOD</text>
  <text x="88" y="226" fill="#f0f6fc" font-size="28" font-weight="600">Price index 1.0x</text>
  <text x="88" y="268" fill="#c8cfd8" font-size="21">Target revenue mix</text>
  <text x="88" y="310" fill="#5eead4" font-size="30" font-weight="700">10 to 20%</text>
  <line x1="88" y1="336" x2="392" y2="336" stroke="#30363d" stroke-width="1.5"/>
  <text x="88" y="368" fill="#9ca3af" font-size="21">Land and activate</text>

  <rect x="520" y="140" width="360" height="260" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="548" y="184" fill="#f5a0a1" font-size="20" font-weight="700" letter-spacing="0.08em">BETTER</text>
  <text x="548" y="226" fill="#f0f6fc" font-size="28" font-weight="600">Price index 1.5x</text>
  <text x="548" y="268" fill="#c8cfd8" font-size="21">Target revenue mix</text>
  <text x="548" y="310" fill="#f5a0a1" font-size="30" font-weight="700">55 to 70%</text>
  <line x1="548" y1="336" x2="852" y2="336" stroke="#30363d" stroke-width="1.5"/>
  <text x="548" y="368" fill="#9ca3af" font-size="21">Carry the revenue</text>

  <rect x="980" y="140" width="360" height="260" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="1008" y="184" fill="#b388f2" font-size="20" font-weight="700" letter-spacing="0.08em">BEST</text>
  <text x="1008" y="226" fill="#f0f6fc" font-size="28" font-weight="600">Price index 2.5x</text>
  <text x="1008" y="268" fill="#c8cfd8" font-size="21">Target revenue mix</text>
  <text x="1008" y="310" fill="#b388f2" font-size="30" font-weight="700">20 to 30%</text>
  <line x1="1008" y1="336" x2="1312" y2="336" stroke="#30363d" stroke-width="1.5"/>
  <text x="1008" y="368" fill="#9ca3af" font-size="21">Hold the ceiling</text>

  <!-- Gap arrows -->
  <text x="470" y="248" text-anchor="middle" fill="#5eead4" font-size="21" font-weight="700">1.5-2.5x</text>
  <line x1="436" y1="280" x2="490" y2="280" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="490,273 504,280 490,287" fill="#5eead4"/>

  <text x="930" y="248" text-anchor="middle" fill="#5eead4" font-size="21" font-weight="700">1.5-2.5x</text>
  <line x1="896" y1="280" x2="950" y2="280" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="950,273 964,280 950,287" fill="#5eead4"/>

  <!-- Published ratios -->
  <rect x="60" y="440" width="1280" height="248" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="88" y="490" fill="#f0f6fc" font-size="26" font-weight="600">Published list prices, and the step between them</text>
  <text x="88" y="536" fill="#c8cfd8" font-size="22">Ahrefs Lite / Standard / Advanced</text>
  <text x="700" y="536" fill="#c8cfd8" font-size="22">$129 / $249 / $449</text>
  <text x="1060" y="536" fill="#5eead4" font-size="22" font-weight="600">1.93x, 1.80x</text>
  <text x="88" y="576" fill="#c8cfd8" font-size="22">Semrush Starter / Pro+ / Advanced</text>
  <text x="700" y="576" fill="#c8cfd8" font-size="22">$199 / $299 / $549</text>
  <text x="1060" y="576" fill="#5eead4" font-size="22" font-weight="600">1.50x, 1.84x</text>
  <text x="88" y="616" fill="#c8cfd8" font-size="22">Linear Basic / Business</text>
  <text x="700" y="616" fill="#c8cfd8" font-size="22">$10 / $16 per user</text>
  <text x="1060" y="616" fill="#5eead4" font-size="22" font-weight="600">1.60x</text>
  <text x="88" y="656" fill="#c8cfd8" font-size="22">iCloud+ 50GB / 200GB / 2TB (consumer)</text>
  <text x="700" y="656" fill="#c8cfd8" font-size="22">$0.99 / $2.99 / $9.99</text>
  <text x="1060" y="656" fill="#5eead4" font-size="22" font-weight="600">3.02x, 3.34x</text>

  <text x="700" y="738" text-anchor="middle" fill="#9ca3af" font-size="22">Price steps of 1.5x to 2.5x between adjacent B2B self-serve tiers are normal.</text>
  <text x="700" y="772" text-anchor="middle" fill="#9ca3af" font-size="22">The step only works when the value gap between tiers is bigger than the price gap.</text>
</svg>
