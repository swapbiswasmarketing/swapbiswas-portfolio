<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="760" rx="24" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="62" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">How Product Marketing and Growth Marketing Compound</text>
  <text x="700" y="100" text-anchor="middle" fill="#9ca3af" font-size="25">Different jobs, one system - each half makes the other stronger</text>

  <!-- Top connector: Product Marketing -> Growth Marketing -->
  <text x="700" y="140" text-anchor="middle" fill="#5eead4" font-size="22" font-weight="500">Positioning becomes testable experiments</text>
  <line x1="350" y1="195" x2="350" y2="160" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="350" y1="160" x2="1050" y2="160" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1050" y1="160" x2="1050" y2="192" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="1043,180 1057,180 1050,196" fill="#5eead4"/>

  <!-- Left card: Product Marketing -->
  <rect x="100" y="195" width="500" height="350" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="130" y="228" width="56" height="6" rx="3" fill="#c084fc"/>
  <text x="130" y="274" fill="#f0f6fc" font-size="30" font-weight="700">PRODUCT MARKETING</text>
  <text x="130" y="308" fill="#c084fc" font-size="22" font-weight="600">Sets the narrative</text>
  <line x1="130" y1="332" x2="570" y2="332" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="139" cy="372" r="5" fill="#c084fc"/>
  <text x="159" y="379" fill="#c8cfd8" font-size="21">Positioning and messaging</text>
  <circle cx="139" cy="414" r="5" fill="#c084fc"/>
  <text x="159" y="421" fill="#c8cfd8" font-size="21">Launches and enablement</text>
  <circle cx="139" cy="456" r="5" fill="#c084fc"/>
  <text x="159" y="463" fill="#c8cfd8" font-size="21">Competitive intelligence</text>
  <text x="130" y="514" fill="#9ca3af" font-size="20">Changes what people believe</text>

  <!-- Right card: Growth Marketing -->
  <rect x="800" y="195" width="500" height="350" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="830" y="228" width="56" height="6" rx="3" fill="#fb923c"/>
  <text x="830" y="274" fill="#f0f6fc" font-size="30" font-weight="700">GROWTH MARKETING</text>
  <text x="830" y="308" fill="#fb923c" font-size="22" font-weight="600">Runs the experiments</text>
  <line x1="830" y1="332" x2="1270" y2="332" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="839" cy="372" r="5" fill="#fb923c"/>
  <text x="859" y="379" fill="#c8cfd8" font-size="21">Acquisition and activation</text>
  <circle cx="839" cy="414" r="5" fill="#fb923c"/>
  <text x="859" y="421" fill="#c8cfd8" font-size="21">Retention and referral</text>
  <circle cx="839" cy="456" r="5" fill="#fb923c"/>
  <text x="859" y="463" fill="#c8cfd8" font-size="21">Funnel A/B testing</text>
  <text x="830" y="514" fill="#9ca3af" font-size="20">Changes what people do</text>

  <!-- Bottom connector: Growth Marketing -> Product Marketing -->
  <line x1="1050" y1="545" x2="1050" y2="590" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1050" y1="590" x2="350" y2="590" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="350" y1="590" x2="350" y2="548" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="343,562 357,562 350,546" fill="#5eead4"/>
  <text x="700" y="620" text-anchor="middle" fill="#5eead4" font-size="22" font-weight="500">Behavioral data sharpens the message</text>

  <!-- Footer summary -->
  <rect x="250" y="656" width="900" height="70" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
  <text x="700" y="699" text-anchor="middle" fill="#c8cfd8" font-size="22">Diagnose the bottleneck, then run both as one loop - not two rival hires</text>
</svg>
