<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 570" width="1400" height="570" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="570" rx="24" fill="url(#bg2)"/>

  <text x="60" y="62" fill="#f0f6fc" font-size="38" font-weight="700">The Handoff Trigger That Keeps a Reference Program Alive</text>
  <text x="60" y="104" fill="#9ca3af" font-size="24">Every contested artifact needs a written trigger, not a standing assumption.</text>

  <!-- Step 1 -->
  <g filter="url(#cardShadow2)">
    <rect x="60" y="150" width="293" height="290" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
  </g>
  <rect x="60" y="150" width="293" height="6" rx="3" fill="#c084fc"/>
  <text x="84" y="196" fill="#c084fc" font-size="20" font-weight="700" letter-spacing="0.08em">STEP 1</text>
  <text x="84" y="236" fill="#f0f6fc" font-size="23" font-weight="600">PMM writes the ask</text>
  <text x="84" y="282" fill="#c8cfd8" font-size="20">Story angle, the proof</text>
  <text x="84" y="310" fill="#c8cfd8" font-size="20">point it must carry,</text>
  <text x="84" y="338" fill="#c8cfd8" font-size="20">and the launch date</text>
  <text x="84" y="404" fill="#c084fc" font-size="20" font-weight="500">Owner: PMM</text>

  <!-- Step 2 -->
  <g filter="url(#cardShadow2)">
    <rect x="389" y="150" width="293" height="290" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
  </g>
  <rect x="389" y="150" width="293" height="6" rx="3" fill="#fb923c"/>
  <text x="413" y="196" fill="#fb923c" font-size="20" font-weight="700" letter-spacing="0.08em">STEP 2</text>
  <text x="413" y="236" fill="#f0f6fc" font-size="23" font-weight="600">Trigger fires</text>
  <text x="413" y="282" fill="#c8cfd8" font-size="20">A named account and</text>
  <text x="413" y="310" fill="#c8cfd8" font-size="20">a written deadline</text>
  <text x="413" y="338" fill="#c8cfd8" font-size="20">land in one ticket</text>
  <text x="413" y="404" fill="#fb923c" font-size="20" font-weight="500">Owner: shared</text>

  <!-- Step 3 -->
  <g filter="url(#cardShadow2)">
    <rect x="718" y="150" width="293" height="290" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
  </g>
  <rect x="718" y="150" width="293" height="6" rx="3" fill="#60a5fa"/>
  <text x="742" y="196" fill="#60a5fa" font-size="20" font-weight="700" letter-spacing="0.08em">STEP 3</text>
  <text x="742" y="236" fill="#f0f6fc" font-size="23" font-weight="600">Sourcing + approval</text>
  <text x="742" y="282" fill="#c8cfd8" font-size="20">Qualifies the account,</text>
  <text x="742" y="310" fill="#c8cfd8" font-size="20">runs the interview,</text>
  <text x="742" y="338" fill="#c8cfd8" font-size="20">chases the approval</text>
  <text x="742" y="404" fill="#60a5fa" font-size="20" font-weight="500">Owner: customer mktg</text>

  <!-- Step 4 -->
  <g filter="url(#cardShadow2)">
    <rect x="1047" y="150" width="293" height="290" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
  </g>
  <rect x="1047" y="150" width="293" height="6" rx="3" fill="#d98ee0"/>
  <text x="1071" y="196" fill="#d98ee0" font-size="20" font-weight="700" letter-spacing="0.08em">STEP 4</text>
  <text x="1071" y="236" fill="#f0f6fc" font-size="23" font-weight="600">PMM ships it</text>
  <text x="1071" y="282" fill="#c8cfd8" font-size="20">Launch, enablement,</text>
  <text x="1071" y="310" fill="#c8cfd8" font-size="20">and the review-site</text>
  <text x="1071" y="338" fill="#c8cfd8" font-size="20">program all get it</text>
  <text x="1071" y="404" fill="#d98ee0" font-size="20" font-weight="500">Owner: PMM</text>

  <!-- Arrows -->
  <line x1="357" y1="295" x2="371" y2="295" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="371,288 385,295 371,302" fill="#5eead4"/>
  <line x1="686" y1="295" x2="700" y2="295" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="700,288 714,295 700,302" fill="#5eead4"/>
  <line x1="1015" y1="295" x2="1029" y2="295" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="1029,288 1043,295 1029,302" fill="#5eead4"/>

  <text x="60" y="504" fill="#9ca3af" font-size="21">No written trigger, no owner. The asset stalls between two teams that each believed it was covered.</text>
</svg>
