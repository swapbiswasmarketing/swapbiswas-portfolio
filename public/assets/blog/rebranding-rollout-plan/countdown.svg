<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" width="1400" height="930" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cs2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="930" fill="url(#bg2)" rx="24"/>

  <text x="60" y="62" fill="#f0f6fc" font-size="40" font-weight="700">The T-90 to T+30 Rebrand Countdown</text>
  <text x="60" y="100" fill="#9ca3af" font-size="24">Every phase closes a workstream, and every workstream has one named owner</text>

  <!-- PHASE 1 -->
  <rect x="60" y="140" width="1280" height="118" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cs2)"/>
  <rect x="80" y="162" width="160" height="74" rx="12" fill="#f5a0a1" fill-opacity="0.12" stroke="#f5a0a1" stroke-width="1.5"/>
  <text x="160" y="196" fill="#f5a0a1" font-size="30" font-weight="700" text-anchor="middle">T-90</text>
  <text x="160" y="222" fill="#9ca3af" font-size="18" text-anchor="middle">to T-61</text>
  <text x="270" y="184" fill="#f0f6fc" font-size="25" font-weight="600">Lock the name, the legal file, and the inventory</text>
  <text x="270" y="216" fill="#c8cfd8" font-size="20">Trademark filed. Domain and handles secured. Systems inventory built, one owner per line.</text>
  <text x="270" y="242" fill="#9ca3af" font-size="20">Owners: Legal, Brand, RevOps. Nothing customer-facing changes yet.</text>

  <line x1="160" y1="262" x2="160" y2="277" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="153,277 167,277 160,288" fill="#5eead4"/>

  <!-- PHASE 2 -->
  <rect x="60" y="292" width="1280" height="118" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cs2)"/>
  <rect x="80" y="314" width="160" height="74" rx="12" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-width="1.5"/>
  <text x="160" y="348" fill="#fb923c" font-size="30" font-weight="700" text-anchor="middle">T-60</text>
  <text x="160" y="374" fill="#9ca3af" font-size="18" text-anchor="middle">to T-31</text>
  <text x="270" y="336" fill="#f0f6fc" font-size="25" font-weight="600">Rebuild the collateral and draft the 301 map</text>
  <text x="270" y="368" fill="#c8cfd8" font-size="20">Decks, one-pagers and battlecards rebuilt. Help docs rewritten. 301 map drafted URL by URL.</text>
  <text x="270" y="394" fill="#9ca3af" font-size="20">Owners: PMM, Enablement, SEO. Sales still sells under the old name.</text>

  <line x1="160" y1="414" x2="160" y2="429" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="153,429 167,429 160,440" fill="#5eead4"/>

  <!-- PHASE 3 -->
  <rect x="60" y="444" width="1280" height="118" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cs2)"/>
  <rect x="80" y="466" width="160" height="74" rx="12" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-width="1.5"/>
  <text x="160" y="500" fill="#c084fc" font-size="30" font-weight="700" text-anchor="middle">T-30</text>
  <text x="160" y="526" fill="#9ca3af" font-size="18" text-anchor="middle">to T-8</text>
  <text x="270" y="488" fill="#f0f6fc" font-size="25" font-weight="600">Pre-brief Tier 1 and stage the systems</text>
  <text x="270" y="520" fill="#c8cfd8" font-size="20">Tier 1 calls booked. Contract and invoice templates staged. Macros and signatures queued.</text>
  <text x="270" y="546" fill="#9ca3af" font-size="20">Owners: CEO, AEs, Legal, RevOps, Support. Nothing is published yet.</text>

  <line x1="160" y1="566" x2="160" y2="581" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="153,581 167,581 160,592" fill="#5eead4"/>

  <!-- PHASE 4 -->
  <rect x="60" y="596" width="1280" height="118" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cs2)"/>
  <rect x="80" y="618" width="160" height="74" rx="12" fill="#b388f2" fill-opacity="0.12" stroke="#b388f2" stroke-width="1.5"/>
  <text x="160" y="652" fill="#b388f2" font-size="30" font-weight="700" text-anchor="middle">T-7</text>
  <text x="160" y="678" fill="#9ca3af" font-size="18" text-anchor="middle">to T-1</text>
  <text x="270" y="640" fill="#f0f6fc" font-size="25" font-weight="600">Run the tiered comms and freeze changes</text>
  <text x="270" y="672" fill="#c8cfd8" font-size="20">Tier 2 emails sent by named owners. In-app banner scheduled. Freeze on billing and DNS.</text>
  <text x="270" y="698" fill="#9ca3af" font-size="20">Owners: CSM, Lifecycle, Product, IT. The press embargo holds until Day 0.</text>

  <line x1="160" y1="718" x2="160" y2="733" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="153,733 167,733 160,744" fill="#5eead4"/>

  <!-- PHASE 5 -->
  <rect x="60" y="748" width="1280" height="118" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cs2)"/>
  <rect x="80" y="770" width="160" height="74" rx="12" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="160" y="804" fill="#60a5fa" font-size="30" font-weight="700" text-anchor="middle">DAY 0</text>
  <text x="160" y="830" fill="#9ca3af" font-size="18" text-anchor="middle">to T+30</text>
  <text x="270" y="792" fill="#f0f6fc" font-size="25" font-weight="600">Flip, redirect, and hunt the leftovers</text>
  <text x="270" y="824" fill="#c8cfd8" font-size="20">301s live. App stores and review profiles updated. Brand-term rankings tracked weekly.</text>
  <text x="270" y="850" fill="#9ca3af" font-size="20">Owners: SEO, Web, Brand. Sweep for the old name weekly until it stops appearing.</text>
</svg>
