  <text x="60" y="790" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Award records: Webby Awards winners gallery (2014 to 2026) and Cannes Lions press releases (2022 to 2026).</text>
