  <text x="90" y="704" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Volvo Trucks' The Epic Split (won 2014), Squarespace's Malkovich spot (won 2018), Adobe's I Love You, Acrobat (won 2024)</text>

