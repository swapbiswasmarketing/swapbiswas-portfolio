<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 928" width="1400" height="928">
  <rect x="0" y="0" width="1400" height="928" fill="#f6f4ef"/>

  <text x="60" y="62" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" fill="#15130f" letter-spacing="-0.6">Where One Release Note Goes</text>
  <text x="60" y="102" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">One note, reshaped per surface, one owner each. The changelog page is the least important row.</text>

  <!-- source card -->
  <rect x="60" y="370" width="300" height="200" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="414" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" fill="#6a645c" letter-spacing="2">SOURCE</text>
  <text x="88" y="452" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">One release note</text>
  <text x="88" y="488" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Six parts, written</text>
  <text x="88" y="514" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">once, then reshaped</text>
  <text x="88" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">for each surface.</text>

  <!-- spine -->
  <line x1="360" y1="470" x2="420" y2="470" stroke="#15130f" stroke-width="2.5"/>
  <line x1="420" y1="200" x2="420" y2="848" stroke="#15130f" stroke-width="2.5"/>

  <!-- branch arrows -->
  <line x1="420" y1="200" x2="482" y2="200" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="482,193 496,200 482,207" fill="#15130f"/>
  <line x1="420" y1="308" x2="482" y2="308" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="482,301 496,308 482,315" fill="#15130f"/>
  <line x1="420" y1="416" x2="482" y2="416" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="482,409 496,416 482,423" fill="#15130f"/>
  <line x1="420" y1="524" x2="482" y2="524" stroke="#b53b15" stroke-width="2.5"/>
  <polygon points="482,517 496,524 482,531" fill="#b53b15"/>
  <line x1="420" y1="632" x2="482" y2="632" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="482,625 496,632 482,639" fill="#15130f"/>
  <line x1="420" y1="740" x2="482" y2="740" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="482,733 496,740 482,747" fill="#15130f"/>
  <line x1="420" y1="848" x2="482" y2="848" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="482,841 496,848 482,855" fill="#15130f"/>

  <!-- surface cards -->
  <rect x="510" y="156" width="830" height="88" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="194" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="600" fill="#15130f">Changelog page</text>
  <text x="538" y="222" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Full dated entry with a permalink</text>
  <text x="1312" y="194" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c">PMM</text>

  <rect x="510" y="264" width="830" height="88" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="302" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="600" fill="#15130f">In-app announcement</text>
  <text x="538" y="330" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Only accounts the eligibility line names</text>
  <text x="1312" y="302" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c">PMM + LIFECYCLE</text>

  <rect x="510" y="372" width="830" height="88" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="410" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="600" fill="#15130f">Documentation update</text>
  <text x="538" y="438" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Reference content, shipped the same day, no news framing</text>
  <text x="1312" y="410" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c">PRODUCT + TECH WRITING</text>

  <rect x="510" y="480" width="830" height="88" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <rect x="510" y="480" width="6" height="88" rx="3" fill="#b53b15"/>
  <text x="538" y="518" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="600" fill="#15130f">Customer success brief</text>
  <text x="538" y="546" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Two sentences plus the list of eligible accounts</text>
  <text x="1312" y="518" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#b53b15">PMM TO CS</text>

  <rect x="510" y="588" width="830" height="88" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="626" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="600" fill="#15130f">Sales enablement channel</text>
  <text x="538" y="654" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">One line on what it unblocks in a live cycle</text>
  <text x="1312" y="626" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c">PMM</text>

  <rect x="510" y="696" width="830" height="88" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="734" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="600" fill="#15130f">Monthly customer digest</text>
  <text x="538" y="762" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Three to five ranked items, never a full month</text>
  <text x="1312" y="734" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c">CUSTOMER MKTG</text>

  <rect x="510" y="804" width="830" height="88" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="842" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="600" fill="#15130f">Developer feed or RSS</text>
  <text x="538" y="870" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Versioned, with breaking changes flagged</text>
  <text x="1312" y="842" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c">PMM + PRODUCT</text>
</svg>
