<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830">
  <rect x="0" y="0" width="1400" height="830" fill="#f6f4ef"/>

  <text x="60" y="68" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.02em" fill="#15130f">Six routes to an image file</text>
  <text x="60" y="106" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Sorted by what produces the pixels, for a Claude Code session in October 2026</text>

  <rect x="60" y="140" width="1280" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="92" y="180" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#b53b15">THE SORTING QUESTION</text>
  <text x="92" y="216" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Would one wrong character make the image wrong?</text>

  <line x1="460" y1="240" x2="460" y2="292" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="453,292 467,292 460,306" fill="#15130f"/>
  <text x="482" y="278" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Yes: labels, numbers, layout</text>

  <line x1="1120" y1="240" x2="1120" y2="292" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="1113,292 1127,292 1120,306" fill="#15130f"/>
  <text x="1098" y="278" text-anchor="end" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No: it is a picture</text>

  <rect x="60" y="306" width="800" height="84" rx="12" fill="#eeebe4"/>
  <text x="84" y="340" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#15130f">CODE PRODUCES THE PIXELS</text>
  <text x="84" y="370" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#2a7347">No image model needed</text>

  <rect x="900" y="306" width="440" height="84" rx="12" fill="#eeebe4"/>
  <text x="924" y="340" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#15130f">A MODEL PRODUCES THE PIXELS</text>
  <text x="924" y="370" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Needs an image model you connect</text>

  <rect x="60" y="406" width="390" height="160" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="84" y="440" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.12em" fill="#6a645c">ROUTE 1</text>
  <text x="84" y="474" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">SVG rendered by a script</text>
  <text x="84" y="508" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">resvg draws it, sharp encodes it</text>
  <text x="84" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Diagrams, charts, tables</text>

  <rect x="470" y="406" width="390" height="160" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="494" y="440" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.12em" fill="#6a645c">ROUTE 2</text>
  <text x="494" y="474" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">HTML rendered to PNG</text>
  <text x="494" y="508" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">A headless browser screenshot</text>
  <text x="494" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Banners, social cards</text>

  <rect x="60" y="582" width="390" height="160" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="84" y="616" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.12em" fill="#6a645c">ROUTE 3</text>
  <text x="84" y="650" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Build-time card generator</text>
  <text x="84" y="684" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Satori, a renderer, an encoder</text>
  <text x="84" y="716" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">One image per page</text>

  <rect x="470" y="582" width="390" height="160" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="494" y="616" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.12em" fill="#6a645c">ROUTE 4</text>
  <text x="494" y="650" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">The /design export</text>
  <text x="494" y="684" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Claude Design canvas, PNG or PDF</text>
  <text x="494" y="716" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Mockups, posters, screen flows</text>

  <rect x="900" y="406" width="440" height="160" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="924" y="440" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.12em" fill="#6a645c">ROUTE 5</text>
  <text x="924" y="474" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Image model called from a script</text>
  <text x="924" y="508" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">The model's API returns the image</text>
  <text x="924" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Photos, paintings, illustrations</text>

  <rect x="900" y="582" width="440" height="160" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="924" y="616" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.12em" fill="#6a645c">ROUTE 6</text>
  <text x="924" y="650" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Image skill or MCP server</text>
  <text x="924" y="684" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">The model the skill or server calls</text>
  <text x="924" y="716" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">An occasional picture in a session</text>

  <text x="60" y="784" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">Routes 2 and 3 need an image model only when the layout places a picture inside it.</text>
</svg>
