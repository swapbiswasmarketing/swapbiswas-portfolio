<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <rect x="0" y="0" width="1400" height="760" fill="#f6f4ef"/>

  <text x="45" y="72" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.02em" fill="#15130f">Who sits at each LinkedIn degree, and how you reach them</text>
  <text x="45" y="110" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">1st to 3rd step out one connection at a time; Out of network is outside all of them.</text>

  <rect x="45" y="140" width="290" height="320" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="70" y="180" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">1ST DEGREE</text>
  <text x="70" y="220" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Connected to you</text>
  <text x="70" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">One of you accepted</text>
  <text x="70" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">the other's invitation</text>
  <line x1="70" y1="330" x2="310" y2="330" stroke="#e4dfd6" stroke-width="1"/>
  <text x="70" y="366" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">REACH</text>
  <text x="70" y="400" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Free message</text>

  <rect x="385" y="140" width="290" height="320" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="410" y="180" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">2ND DEGREE</text>
  <text x="410" y="220" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Knows your 1st</text>
  <text x="410" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Connected to one of</text>
  <text x="410" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">your 1st-degree</text>
  <line x1="410" y1="330" x2="650" y2="330" stroke="#e4dfd6" stroke-width="1"/>
  <text x="410" y="366" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">REACH</text>
  <text x="410" y="400" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Connect button on</text>
  <text x="410" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">profile, or InMail</text>

  <rect x="725" y="140" width="290" height="320" rx="12" fill="#ffffff" stroke="#b53b15" stroke-width="2.5"/>
  <text x="750" y="180" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#b53b15">3RD DEGREE</text>
  <text x="750" y="220" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Knows your 2nd</text>
  <text x="750" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Connected to one of</text>
  <text x="750" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">your 2nd-degree</text>
  <line x1="750" y1="330" x2="990" y2="330" stroke="#e4dfd6" stroke-width="1"/>
  <text x="750" y="366" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">REACH</text>
  <text x="750" y="400" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Degrees page gives</text>
  <text x="750" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">none; InMail (Premium)</text>

  <rect x="1065" y="140" width="290" height="320" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1090" y="180" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">OUT OF NETWORK</text>
  <text x="1090" y="220" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">LinkedIn Member</text>
  <text x="1090" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Not 1st, 2nd or 3rd,</text>
  <text x="1090" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">follower or group</text>
  <line x1="1090" y1="330" x2="1330" y2="330" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1090" y="366" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">REACH</text>
  <text x="1090" y="400" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">InMail, "if the option</text>
  <text x="1090" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">is available"</text>

  <line x1="341" y1="300" x2="365" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="365,293 379,300 365,307" fill="#15130f"/>
  <line x1="681" y1="300" x2="705" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="705,293 719,300 705,307" fill="#15130f"/>
  <line x1="1021" y1="300" x2="1045" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="1045,293 1059,300 1045,307" fill="#15130f"/>

  <line x1="45" y1="500" x2="1015" y2="500" stroke="#15130f" stroke-width="2.5"/>
  <line x1="45" y1="488" x2="45" y2="500" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1015" y1="488" x2="1015" y2="500" stroke="#15130f" stroke-width="2.5"/>
  <text x="45" y="536" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Free search shows full profiles with names for 1st, 2nd and 3rd degree,</text>
  <text x="45" y="566" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">plus members you share groups with, subject to their settings</text>

  <line x1="725" y1="610" x2="1355" y2="610" stroke="#15130f" stroke-width="2.5"/>
  <line x1="725" y1="598" x2="725" y2="610" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1355" y1="598" x2="1355" y2="610" stroke="#15130f" stroke-width="2.5"/>
  <text x="725" y="646" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">3RD+ SEARCH FILTER, MY READING</text>
  <text x="725" y="678" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">"will include everyone that falls in</text>
  <text x="725" y="708" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">your search criteria"</text>

  <text x="45" y="678" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Sources: LinkedIn Help a545636, a528043,</text>
  <text x="45" y="708" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">a520842, a546814, read 4 November 2026</text>
</svg>
