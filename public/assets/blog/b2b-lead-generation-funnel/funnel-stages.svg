<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="700" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">The B2B Lead Generation Funnel</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="22">Five stages, each with its own job. The MQL-to-SQL handoff is where funnels leak.</text>

  <!-- Left group labels -->
  <text x="58" y="252" fill="#f5a0a1" font-size="20" font-weight="700" letter-spacing="0.06em">DEMAND GEN</text>
  <text x="58" y="278" fill="#9ca3af" font-size="18">reach the 95%</text>
  <text x="58" y="508" fill="#60a5fa" font-size="20" font-weight="700" letter-spacing="0.06em">LEAD GEN</text>
  <text x="58" y="534" fill="#9ca3af" font-size="18">convert the 5%</text>

  <!-- Band 1: Awareness -->
  <rect x="250" y="150" width="900" height="86" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="250" y="150" width="8" height="86" rx="4" fill="#f5a0a1"/>
  <text x="286" y="202" font-size="23"><tspan fill="#f5a0a1" font-weight="700">1. Awareness</tspan><tspan fill="#c8cfd8" font-weight="400"> · create category demand</tspan></text>

  <!-- Band 2: Interest -->
  <rect x="310" y="248" width="780" height="86" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="310" y="248" width="8" height="86" rx="4" fill="#d98ee0"/>
  <text x="346" y="300" font-size="23"><tspan fill="#d98ee0" font-weight="700">2. Interest</tspan><tspan fill="#c8cfd8" font-weight="400"> · earn engagement</tspan></text>

  <!-- Band 3: Consideration -->
  <rect x="370" y="346" width="660" height="86" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="370" y="346" width="8" height="86" rx="4" fill="#c084fc"/>
  <text x="406" y="398" font-size="23"><tspan fill="#c084fc" font-weight="700">3. Consideration</tspan><tspan fill="#c8cfd8" font-weight="400"> · qualify by fit</tspan></text>
  <!-- MQL tag -->
  <rect x="1060" y="372" width="86" height="40" rx="10" fill="#161b22" stroke="#c084fc" stroke-width="1.5"/>
  <text x="1103" y="399" text-anchor="middle" fill="#c084fc" font-size="20" font-weight="700">MQL</text>
  <line x1="1030" y1="389" x2="1060" y2="389" stroke="#5eead4" stroke-width="2.5"/>

  <!-- Handoff seam -->
  <text x="700" y="474" text-anchor="middle" fill="#5eead4" font-size="18" font-weight="700" letter-spacing="0.08em">MQL TO SQL HANDOFF</text>

  <!-- Band 4: Intent -->
  <rect x="430" y="486" width="540" height="86" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="430" y="486" width="8" height="86" rx="4" fill="#60a5fa"/>
  <text x="466" y="538" font-size="23"><tspan fill="#60a5fa" font-weight="700">4. Intent</tspan><tspan fill="#c8cfd8" font-weight="400"> · route fast to sales</tspan></text>
  <!-- SQL tag -->
  <rect x="1060" y="512" width="86" height="40" rx="10" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1103" y="539" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="700">SQL</text>
  <line x1="970" y1="529" x2="1060" y2="529" stroke="#5eead4" stroke-width="2.5"/>

  <!-- Band 5: Conversion -->
  <rect x="490" y="584" width="420" height="86" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="490" y="584" width="8" height="86" rx="4" fill="#5eead4"/>
  <text x="526" y="636" font-size="23"><tspan fill="#5eead4" font-weight="700">5. Conversion</tspan><tspan fill="#c8cfd8" font-weight="400"> · win the deal</tspan></text>

  <text x="700" y="716" text-anchor="middle" fill="#9ca3af" font-size="21">Measure each stage on its own metric, and fix the leak where accounts actually drop</text>
</svg>
