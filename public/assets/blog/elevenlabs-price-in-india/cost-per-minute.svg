  <text x="558" y="740" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Annual billing (10 months' price spread over 12)</text>

  <text x="60" y="830" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Worked line: Creator, $22 / ~121 min = $0.182, the ~$0.18 the page lists as Creator's extra-minute price.</text>
  <text x="60" y="864" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Prices exclude taxes. Free (10k credits, ~10 min) has no price to divide. Minutes are ElevenLabs' approximations.</text>
