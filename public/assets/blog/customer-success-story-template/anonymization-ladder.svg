<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="940" rx="24" fill="url(#bg)"/>

  <text x="700" y="66" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">The Anonymization Ladder</text>
  <text x="700" y="106" text-anchor="middle" fill="#9ca3af" font-size="24">What you can still publish when the customer will not give you the logo</text>

  <text x="70" y="180" fill="#9ca3af" font-size="20" font-weight="600" letter-spacing="0.06em">RUNG</text>
  <text x="400" y="180" fill="#9ca3af" font-size="20" font-weight="600" letter-spacing="0.06em">WHAT YOU CAN PUBLISH</text>
  <text x="880" y="180" fill="#9ca3af" font-size="20" font-weight="600" letter-spacing="0.06em">APPROVAL NEEDED</text>
  <text x="1180" y="180" fill="#9ca3af" font-size="20" font-weight="600" letter-spacing="0.06em">CREDIBILITY</text>

  <!-- Rung 1 -->
  <rect x="40" y="200" width="1320" height="126" rx="16" fill="#151b23" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="48" y="230" width="6" height="66" rx="3" fill="#5eead4"/>
  <text x="70" y="248" fill="#5eead4" font-size="21" font-weight="700" letter-spacing="0.08em">RUNG 1</text>
  <text x="70" y="286" fill="#c8cfd8" font-size="21">Named + verified</text>
  <text x="400" y="248" fill="#c8cfd8" font-size="21">Logo, customer name, hard</text>
  <text x="400" y="286" fill="#c8cfd8" font-size="21">numbers, attributed quotes</text>
  <text x="880" y="272" fill="#9ca3af" font-size="20">Legal + comms + champion</text>
  <text x="1180" y="272" fill="#5eead4" font-size="21" font-weight="600">Highest</text>

  <!-- Rung 2 -->
  <rect x="40" y="340" width="1320" height="126" rx="16" fill="#151b23" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="48" y="370" width="6" height="66" rx="3" fill="#60a5fa"/>
  <text x="70" y="388" fill="#60a5fa" font-size="21" font-weight="700" letter-spacing="0.08em">RUNG 2</text>
  <text x="70" y="426" fill="#c8cfd8" font-size="21">Named + percentages</text>
  <text x="400" y="388" fill="#c8cfd8" font-size="21">Logo and name, percentage</text>
  <text x="400" y="426" fill="#c8cfd8" font-size="21">deltas, no absolute figures</text>
  <text x="880" y="412" fill="#9ca3af" font-size="20">Comms + champion</text>
  <text x="1180" y="412" fill="#60a5fa" font-size="21" font-weight="600">Strong</text>

  <!-- Rung 3 -->
  <rect x="40" y="480" width="1320" height="126" rx="16" fill="#151b23" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="48" y="510" width="6" height="66" rx="3" fill="#c084fc"/>
  <text x="70" y="528" fill="#c084fc" font-size="21" font-weight="700" letter-spacing="0.08em">RUNG 3</text>
  <text x="70" y="566" fill="#c8cfd8" font-size="21">Named + directional</text>
  <text x="400" y="528" fill="#c8cfd8" font-size="21">Logo and name, directional</text>
  <text x="400" y="566" fill="#c8cfd8" font-size="21">claims, no figures at all</text>
  <text x="880" y="552" fill="#9ca3af" font-size="20">Champion email is enough</text>
  <text x="1180" y="552" fill="#c084fc" font-size="21" font-weight="600">Moderate</text>

  <!-- Rung 4 -->
  <rect x="40" y="620" width="1320" height="126" rx="16" fill="#151b23" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="48" y="650" width="6" height="66" rx="3" fill="#fb923c"/>
  <text x="70" y="668" fill="#fb923c" font-size="21" font-weight="700" letter-spacing="0.08em">RUNG 4</text>
  <text x="70" y="706" fill="#c8cfd8" font-size="21">Described anonymity</text>
  <text x="400" y="668" fill="#c8cfd8" font-size="21">No logo. A top-5 US retail</text>
  <text x="400" y="706" fill="#c8cfd8" font-size="21">bank plus hard numbers</text>
  <text x="880" y="692" fill="#9ca3af" font-size="20">Legal, no logo rights</text>
  <text x="1180" y="692" fill="#fb923c" font-size="21" font-weight="600">Good</text>

  <!-- Rung 5 -->
  <rect x="40" y="760" width="1320" height="126" rx="16" fill="#151b23" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="48" y="790" width="6" height="66" rx="3" fill="#f5a0a1"/>
  <text x="70" y="808" fill="#f5a0a1" font-size="21" font-weight="700" letter-spacing="0.08em">RUNG 5</text>
  <text x="70" y="846" fill="#c8cfd8" font-size="21">Segment anonymity</text>
  <text x="400" y="808" fill="#c8cfd8" font-size="21">No logo. A mid-market</text>
  <text x="400" y="846" fill="#c8cfd8" font-size="21">fintech, direction only</text>
  <text x="880" y="832" fill="#9ca3af" font-size="20">No approval needed</text>
  <text x="1180" y="832" fill="#f5a0a1" font-size="21" font-weight="600">Weakest</text>
</svg>
