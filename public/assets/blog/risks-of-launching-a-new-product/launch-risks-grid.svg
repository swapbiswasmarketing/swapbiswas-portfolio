<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="700" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">The 9 Biggest Product Launch Risks</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="24">Grouped into the three questions every launch has to answer before day one</text>

  <!-- Column 1: Market readiness -->
  <rect x="40" y="140" width="430" height="480" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="40" y="140" width="430" height="6" rx="3" fill="#f5a0a1"/>
  <text x="72" y="190" fill="#f5a0a1" font-size="22" font-weight="700" letter-spacing="0.06em">MARKET READINESS</text>
  <text x="72" y="222" fill="#9ca3af" font-size="20">Is there real demand?</text>
  <circle cx="88" cy="284" r="17" fill="#f5a0a1"/><text x="88" y="291" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">1</text>
  <text x="122" y="279" fill="#f0f6fc" font-size="22">No real market need</text>
  <text x="122" y="308" fill="#9ca3af" font-size="20">Validate demand up front</text>
  <circle cx="88" cy="394" r="17" fill="#f5a0a1"/><text x="88" y="401" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">2</text>
  <text x="122" y="389" fill="#f0f6fc" font-size="22">Fuzzy ICP and buyer</text>
  <text x="122" y="418" fill="#9ca3af" font-size="20">Pin down the real ICP</text>
  <circle cx="88" cy="504" r="17" fill="#f5a0a1"/><text x="88" y="511" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">3</text>
  <text x="122" y="499" fill="#f0f6fc" font-size="22">Competitive + timing risk</text>
  <text x="122" y="528" fill="#9ca3af" font-size="20">Map rivals, time the window</text>

  <!-- Column 2: Product readiness -->
  <rect x="485" y="140" width="430" height="480" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="485" y="140" width="430" height="6" rx="3" fill="#c084fc"/>
  <text x="517" y="190" fill="#c084fc" font-size="22" font-weight="700" letter-spacing="0.06em">PRODUCT READINESS</text>
  <text x="517" y="222" fill="#9ca3af" font-size="20">Is the offer sharp?</text>
  <circle cx="533" cy="284" r="17" fill="#c084fc"/><text x="533" y="291" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">4</text>
  <text x="567" y="279" fill="#f0f6fc" font-size="22">Weak positioning</text>
  <text x="567" y="308" fill="#9ca3af" font-size="20">Lock positioning first</text>
  <circle cx="533" cy="394" r="17" fill="#c084fc"/><text x="533" y="401" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">5</text>
  <text x="567" y="389" fill="#f0f6fc" font-size="22">Pricing and packaging miss</text>
  <text x="567" y="418" fill="#9ca3af" font-size="20">Test willingness to pay early</text>
  <circle cx="533" cy="504" r="17" fill="#c084fc"/><text x="533" y="511" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">6</text>
  <text x="567" y="499" fill="#f0f6fc" font-size="22">Feature-led messaging</text>
  <text x="567" y="528" fill="#9ca3af" font-size="20">Lead with outcomes</text>

  <!-- Column 3: Go-to-market readiness -->
  <rect x="930" y="140" width="430" height="480" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="930" y="140" width="430" height="6" rx="3" fill="#60a5fa"/>
  <text x="962" y="190" fill="#60a5fa" font-size="22" font-weight="700" letter-spacing="0.06em">GO-TO-MARKET</text>
  <text x="962" y="222" fill="#9ca3af" font-size="20">Can you actually sell it?</text>
  <circle cx="978" cy="284" r="17" fill="#60a5fa"/><text x="978" y="291" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">7</text>
  <text x="1012" y="279" fill="#f0f6fc" font-size="22">Sales not enabled</text>
  <text x="1012" y="308" fill="#9ca3af" font-size="20">Enable reps before launch</text>
  <circle cx="978" cy="394" r="17" fill="#60a5fa"/><text x="978" y="401" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">8</text>
  <text x="1012" y="389" fill="#f0f6fc" font-size="22">Launching to silence</text>
  <text x="1012" y="418" fill="#9ca3af" font-size="20">Build demand pre-launch</text>
  <circle cx="978" cy="504" r="17" fill="#60a5fa"/><text x="978" y="511" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">9</text>
  <text x="1012" y="499" fill="#f0f6fc" font-size="22">No success metrics</text>
  <text x="1012" y="528" fill="#9ca3af" font-size="20">Define a launch scorecard</text>

  <text x="700" y="682" text-anchor="middle" fill="#9ca3af" font-size="22">Name each risk, assign an owner, and de-risk it before you ship - not after</text>
</svg>
