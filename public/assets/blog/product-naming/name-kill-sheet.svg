<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="830" rx="24" fill="url(#bg)"/>

  <text x="60" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="700" fill="#f0f6fc">The Name Kill Sheet</text>
  <text x="60" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="24" fill="#9ca3af">Four hard-fail gates eliminate. Three weighted criteria rank what survives.</text>

  <rect x="60" y="140" width="275" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="84" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#f5a0a1">GATE 1</text>
  <text x="84" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Trademark</text>
  <text x="84" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Confusable mark,</text>
  <text x="84" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">related goods</text>
  <rect x="84" y="302" width="138" height="34" rx="8" fill="#3a1a1c" stroke="#f87171" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="98" y="325" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#f87171">HARD FAIL</text>

  <rect x="395" y="140" width="275" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="419" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#fb923c">GATE 2</text>
  <text x="419" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">.com + handle</text>
  <text x="419" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Exact .com or</text>
  <text x="419" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">handle blocked</text>
  <rect x="419" y="302" width="138" height="34" rx="8" fill="#3a1a1c" stroke="#f87171" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="433" y="325" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#f87171">HARD FAIL</text>

  <rect x="730" y="140" width="275" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="754" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#c084fc">GATE 3</text>
  <text x="754" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Category clash</text>
  <text x="754" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Live SaaS owns it</text>
  <text x="754" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">in your category</text>
  <rect x="754" y="302" width="138" height="34" rx="8" fill="#3a1a1c" stroke="#f87171" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="768" y="325" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#f87171">HARD FAIL</text>

  <rect x="1065" y="140" width="275" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="1089" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#60a5fa">GATE 4</text>
  <text x="1089" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">SERP owner</text>
  <text x="1089" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Page 1 belongs</text>
  <text x="1089" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">to someone else</text>
  <rect x="1089" y="302" width="138" height="34" rx="8" fill="#3a1a1c" stroke="#f87171" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="1103" y="325" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#f87171">HARD FAIL</text>

  <line x1="343" y1="246" x2="379" y2="246" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="379,239 393,246 379,253" fill="#5eead4"/>
  <line x1="678" y1="246" x2="714" y2="246" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="714,239 728,246 714,253" fill="#5eead4"/>
  <line x1="1013" y1="246" x2="1049" y2="246" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="1049,239 1063,246 1049,253" fill="#5eead4"/>

  <line x1="1202" y1="356" x2="1202" y2="380" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1202" y1="380" x2="250" y2="380" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="250" y1="380" x2="250" y2="392" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="243,392 250,406 257,392" fill="#5eead4"/>

  <rect x="60" y="410" width="380" height="214" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="84" y="448" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#d98ee0">WEIGHT x2</text>
  <text x="84" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Say it, spell it</text>
  <text x="84" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Pronounceable on a cold call,</text>
  <text x="84" y="554" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">typed right from memory.</text>
  <rect x="84" y="574" width="140" height="34" rx="8" fill="#1b222b" stroke="#d98ee0" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="98" y="597" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#d98ee0">SCORE 0-3</text>

  <rect x="510" y="410" width="380" height="214" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="534" y="448" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#b388f2">WEIGHT x2</text>
  <text x="534" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Three-year fit</text>
  <text x="534" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Still reads right beside the</text>
  <text x="534" y="554" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">next two products you ship.</text>
  <rect x="534" y="574" width="140" height="34" rx="8" fill="#1b222b" stroke="#b388f2" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="548" y="597" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#b388f2">SCORE 0-3</text>

  <rect x="960" y="410" width="380" height="214" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="984" y="448" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#5eead4">WEIGHT x3</text>
  <text x="984" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Rename migration cost</text>
  <text x="984" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Docs, URLs, API names,</text>
  <text x="984" y="554" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">in-app strings, macros.</text>
  <rect x="984" y="574" width="140" height="34" rx="8" fill="#1b222b" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="998" y="597" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#5eead4">SCORE 0-3</text>

  <line x1="700" y1="628" x2="700" y2="662" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="693,662 700,676 707,662" fill="#5eead4"/>

  <rect x="250" y="676" width="900" height="104" rx="16" fill="#151b23" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="274" y="716" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#f0f6fc">Eliminate first, then rank the survivors</text>
  <text x="274" y="752" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Any gate fails, the name is dead. Survivors rank on 21 weighted points.</text>
</svg>
