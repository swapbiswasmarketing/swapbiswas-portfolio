<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 910" width="1400" height="910">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="910" rx="24" fill="url(#bgA)"/>

  <text x="700" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc">One Artifact, Two Outputs</text>
  <text x="700" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="25" fill="#9ca3af">Four fields build the campaign name. The same four build the UTM.</text>

  <!-- Field 1 -->
  <rect x="70" y="150" width="300" height="240" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#shadowA)"/>
  <text x="98" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#c084fc" letter-spacing="0.08em">FIELD 1</text>
  <text x="98" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">Tier</text>
  <text x="98" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">t1 | t2 | t3</text>
  <text x="98" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">Business weight</text>
  <text x="98" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#c084fc">No tool stores it</text>

  <!-- Field 2 -->
  <rect x="390" y="150" width="300" height="240" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#shadowA)"/>
  <text x="418" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#60a5fa" letter-spacing="0.08em">FIELD 2</text>
  <text x="418" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">Motion</text>
  <text x="418" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">launch | demandgen</text>
  <text x="418" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">The GTM play</text>
  <text x="418" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#60a5fa">No tool stores it</text>

  <!-- Field 3 -->
  <rect x="710" y="150" width="300" height="240" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#shadowA)"/>
  <text x="738" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#fb923c" letter-spacing="0.08em">FIELD 3</text>
  <text x="738" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">Offer</text>
  <text x="738" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">webinar | trial</text>
  <text x="738" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">What you asked for</text>
  <text x="738" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#fb923c">No tool stores it</text>

  <!-- Field 4 -->
  <rect x="1030" y="150" width="300" height="240" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#shadowA)"/>
  <text x="1058" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#f5a0a1" letter-spacing="0.08em">FIELD 4</text>
  <text x="1058" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">Period</text>
  <text x="1058" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">2026-09</text>
  <text x="1058" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">Start month</text>
  <text x="1058" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#f5a0a1">Sort by name = time</text>

  <!-- Merge bus -->
  <line x1="220" y1="390" x2="220" y2="430" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="540" y1="390" x2="540" y2="430" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="860" y1="390" x2="860" y2="430" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1180" y1="390" x2="1180" y2="430" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="220" y1="430" x2="1180" y2="430" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="380" y1="430" x2="380" y2="486" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="373,486 387,486 380,500" fill="#5eead4"/>
  <line x1="1020" y1="430" x2="1020" y2="486" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="1013,486 1027,486 1020,500" fill="#5eead4"/>

  <!-- Output A -->
  <rect x="70" y="500" width="620" height="270" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#shadowA)"/>
  <text x="102" y="546" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#d98ee0" letter-spacing="0.08em">AD PLATFORM</text>
  <text x="102" y="592" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">Campaign name</text>
  <text x="102" y="650" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#5eead4">t1_launch_webinar_2026-09</text>
  <text x="102" y="700" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">25 characters. Fits every documented</text>
  <text x="102" y="732" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">platform limit with room to spare.</text>

  <!-- Output B -->
  <rect x="710" y="500" width="620" height="270" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#shadowA)"/>
  <text x="742" y="546" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#5eead4" letter-spacing="0.08em">ANALYTICS</text>
  <text x="742" y="592" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">utm_campaign</text>
  <text x="742" y="650" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#5eead4">utm_campaign=t1_launch_webinar_2026-09</text>
  <text x="742" y="700" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Same string, character for character.</text>
  <text x="742" y="732" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Channel rides in source and medium.</text>

  <!-- Footer -->
  <rect x="70" y="805" width="1260" height="60" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
  <text x="700" y="843" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">Nothing is typed twice, so the two strings cannot drift apart.</text>
</svg>
