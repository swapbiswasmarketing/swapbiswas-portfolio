<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="700" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">Positioning Decides, Branding Expresses</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="22">Positioning is the choice you make inside. Branding is how the market sees it.</text>

  <!-- Positioning card -->
  <rect x="80" y="150" width="560" height="460" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="80" y="150" width="560" height="6" rx="3" fill="#c084fc"/>
  <text x="110" y="200" fill="#c084fc" font-size="21" font-weight="700" letter-spacing="0.08em">POSITIONING</text>
  <text x="110" y="244" fill="#f0f6fc" font-size="28" font-weight="600">The strategic decision</text>
  <text x="110" y="280" fill="#9ca3af" font-size="20">The choice you make on the inside</text>
  <circle cx="120" cy="330" r="5" fill="#c084fc"/>
  <text x="142" y="337" fill="#c8cfd8" font-size="22">Who you are for</text>
  <circle cx="120" cy="382" r="5" fill="#c084fc"/>
  <text x="142" y="389" fill="#c8cfd8" font-size="22">What category you compete in</text>
  <circle cx="120" cy="434" r="5" fill="#c084fc"/>
  <text x="142" y="441" fill="#c8cfd8" font-size="22">Who you beat</text>
  <circle cx="120" cy="486" r="5" fill="#c084fc"/>
  <text x="142" y="493" fill="#c8cfd8" font-size="22">Why you win</text>
  <text x="110" y="566" fill="#9ca3af" font-size="19">Product marketing owns it · 1-3 year horizon</text>

  <!-- Branding card -->
  <rect x="760" y="150" width="560" height="460" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="760" y="150" width="560" height="6" rx="3" fill="#fb923c"/>
  <text x="790" y="200" fill="#fb923c" font-size="21" font-weight="700" letter-spacing="0.08em">BRANDING</text>
  <text x="790" y="244" fill="#f0f6fc" font-size="28" font-weight="600">The expression</text>
  <text x="790" y="280" fill="#9ca3af" font-size="20">What the market sees and feels</text>
  <circle cx="800" cy="330" r="5" fill="#fb923c"/>
  <text x="822" y="337" fill="#c8cfd8" font-size="22">Name and identity</text>
  <circle cx="800" cy="382" r="5" fill="#fb923c"/>
  <text x="822" y="389" fill="#c8cfd8" font-size="22">Voice and tone</text>
  <circle cx="800" cy="434" r="5" fill="#fb923c"/>
  <text x="822" y="441" fill="#c8cfd8" font-size="22">Look and feel</text>
  <circle cx="800" cy="486" r="5" fill="#fb923c"/>
  <text x="822" y="493" fill="#c8cfd8" font-size="22">The buying experience</text>
  <text x="790" y="566" fill="#9ca3af" font-size="19">Brand team owns it · evolves slowly</text>

  <!-- Directs arrow -->
  <text x="700" y="356" text-anchor="middle" fill="#5eead4" font-size="19" font-weight="700" letter-spacing="0.1em">DIRECTS</text>
  <line x1="655" y1="382" x2="745" y2="382" stroke="#5eead4" stroke-width="3"/>
  <polygon points="740,374 756,382 740,390" fill="#5eead4"/>

  <text x="700" y="690" text-anchor="middle" fill="#9ca3af" font-size="22">Positioning comes first and directs branding, always in that order</text>
</svg>
