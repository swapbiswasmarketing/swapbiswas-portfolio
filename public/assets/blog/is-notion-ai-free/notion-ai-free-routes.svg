<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <rect x="0" y="0" width="1400" height="760" fill="#f6f4ef"/>

  <text x="60" y="72" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Three free routes to try Notion AI, and where they lead</text>
  <text x="60" y="112" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">From notion.com pricing and help pages, read 31 October 2026. Prices in USD per member per month.</text>

  <rect x="60" y="150" width="400" height="290" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="192" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">FREE, PLUS, EDUCATION</text>
  <text x="88" y="234" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Trial allowance</text>
  <text x="88" y="280" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">A limited number of</text>
  <text x="88" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">complimentary AI responses</text>
  <text x="88" y="356" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Size not published</text>
  <text x="88" y="400" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Free to Plus does not renew it</text>

  <rect x="500" y="150" width="400" height="290" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="528" y="192" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">TEAMS ON A WORK DOMAIN</text>
  <text x="528" y="234" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Business trial</text>
  <text x="528" y="280" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">30 days of Business features,</text>
  <text x="528" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Notion AI included</text>
  <text x="528" y="356" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No school or personal domains</text>
  <text x="528" y="400" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Renews if payment details were added</text>

  <rect x="940" y="150" width="400" height="290" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="968" y="192" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">STARTUPS AND SMBS</text>
  <text x="968" y="234" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Notion for Startups</text>
  <text x="968" y="280" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">1, 3 or 6 months of Business,</text>
  <text x="968" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">monthly AI credits included</text>
  <text x="968" y="356" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">By application</text>
  <text x="968" y="400" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">New, non-paying customers only</text>

  <line x1="260" y1="440" x2="260" y2="500" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="253,500 267,500 260,514" fill="#15130f"/>
  <line x1="700" y1="440" x2="700" y2="500" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="693,500 707,500 700,514" fill="#15130f"/>
  <line x1="1140" y1="440" x2="1140" y2="500" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="1133,500 1147,500 1140,514" fill="#15130f"/>

  <rect x="60" y="520" width="1280" height="190" rx="12" fill="#ffffff" stroke="#b53b15" stroke-width="2.5"/>
  <text x="88" y="562" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">WHERE NOTION SAYS AI IS INCLUDED</text>
  <text x="88" y="604" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Business ($20 billed yearly, $24 billed monthly) and Enterprise (custom pricing)</text>
  <text x="88" y="648" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Business members get 1,500 Standard and 500 Select credits a month, no rollover (Enterprise may vary).</text>
  <text x="88" y="680" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">The credit system applies to new workspaces from 19 October 2026 and existing ones from 2 November 2026.</text>
</svg>
