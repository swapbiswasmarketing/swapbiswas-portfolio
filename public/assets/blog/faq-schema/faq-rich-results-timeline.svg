<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <rect x="0" y="0" width="1400" height="780" fill="#f6f4ef"/>

  <text x="60" y="78" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">FAQ rich results in Google, dated</text>
  <text x="60" y="118" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">From Google's changelog, 2023 blog post and 11 Jun 2026 notice; last card is my 16 Oct 2026 check. Not to scale.</text>

  <line x1="60" y1="440" x2="1326" y2="440" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="1326,433 1340,440 1326,447" fill="#15130f"/>

  <rect x="440" y="430" width="22" height="20" fill="#f6f4ef"/>
  <line x1="434" y1="454" x2="446" y2="426" stroke="#15130f" stroke-width="2.5"/>
  <line x1="456" y1="454" x2="468" y2="426" stroke="#15130f" stroke-width="2.5"/>

  <line x1="200" y1="360" x2="200" y2="431" stroke="#6a645c" stroke-width="2.5"/>
  <line x1="367" y1="449" x2="367" y2="530" stroke="#6a645c" stroke-width="2.5"/>
  <line x1="533" y1="360" x2="533" y2="428" stroke="#6a645c" stroke-width="2.5"/>
  <line x1="700" y1="449" x2="700" y2="530" stroke="#6a645c" stroke-width="2.5"/>
  <line x1="867" y1="360" x2="867" y2="431" stroke="#6a645c" stroke-width="2.5"/>
  <line x1="1033" y1="449" x2="1033" y2="530" stroke="#6a645c" stroke-width="2.5"/>
  <line x1="1200" y1="360" x2="1200" y2="431" stroke="#6a645c" stroke-width="2.5"/>

  <circle cx="200" cy="440" r="9" fill="#15130f"/>
  <circle cx="367" cy="440" r="9" fill="#15130f"/>
  <circle cx="533" cy="440" r="12" fill="#b53b15"/>
  <circle cx="700" cy="440" r="9" fill="#15130f"/>
  <circle cx="867" cy="440" r="9" fill="#15130f"/>
  <circle cx="1033" cy="440" r="9" fill="#15130f"/>
  <circle cx="1200" cy="440" r="9" fill="#15130f"/>

  <rect x="45" y="150" width="310" height="210" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="69" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">8 AUG 2023</text>
  <text x="69" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">FAQ limited</text>
  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <tspan x="69" y="266">Only for well-known</tspan>
    <tspan x="69" y="298">government and</tspan>
    <tspan x="69" y="330">health websites</tspan>
  </text>

  <rect x="212" y="530" width="310" height="210" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="236" y="570" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">13 SEP 2023</text>
  <text x="236" y="610" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">How-to retired</text>
  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <tspan x="236" y="646">How-to rich results</tspan>
    <tspan x="236" y="678">end on desktop too;</tspan>
    <tspan x="236" y="710">type deprecated</tspan>
  </text>

  <rect x="378" y="150" width="310" height="210" rx="12" fill="#ffffff" stroke="#b53b15" stroke-width="2.5"/>
  <text x="402" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#b53b15">7 MAY 2026</text>
  <text x="402" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">FAQ results stop</text>
  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <tspan x="402" y="266">No FAQ rich results</tspan>
    <tspan x="402" y="298">in Google Search,</tspan>
    <tspan x="402" y="330">for any site</tspan>
  </text>

  <rect x="545" y="530" width="310" height="210" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="569" y="570" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">SET FOR JUN 2026</text>
  <text x="569" y="610" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Tools to drop FAQ</text>
  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <tspan x="569" y="646">Report, appearance</tspan>
    <tspan x="569" y="678">and Rich Results</tspan>
    <tspan x="569" y="710">Test support to go</tspan>
  </text>

  <rect x="712" y="150" width="310" height="210" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="736" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">15 JUN 2026</text>
  <text x="736" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Docs removed</text>
  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <tspan x="736" y="266">FAQ documentation</tspan>
    <tspan x="736" y="298">taken down from</tspan>
    <tspan x="736" y="330">Search Central</tspan>
  </text>

  <rect x="878" y="530" width="310" height="210" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="902" y="570" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">SET FOR AUG 2026</text>
  <text x="902" y="610" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">API support to go</text>
  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <tspan x="902" y="646">FAQ support in the</tspan>
    <tspan x="902" y="678">Search Console API</tspan>
    <tspan x="902" y="710">set to be removed</tspan>
  </text>

  <rect x="1045" y="150" width="310" height="210" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1069" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">CHECKED 16 OCT 2026</text>
  <text x="1069" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Old URL redirects</text>
  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">
    <tspan x="1069" y="266">The FAQ doc URL</tspan>
    <tspan x="1069" y="298">returns a 301 to</tspan>
    <tspan x="1069" y="330">the changelog</tspan>
  </text>
</svg>
