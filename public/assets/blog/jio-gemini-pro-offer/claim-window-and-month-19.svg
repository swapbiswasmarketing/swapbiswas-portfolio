<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <rect x="0" y="0" width="1400" height="800" fill="#f6f4ef"/>

  <text x="60" y="66" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Jio Gemini Pro offer: when to claim and when it ends</text>
  <text x="60" y="104" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Dates from Jio's terms, read 16 October 2026. End dates add 18 months to the activation date (my arithmetic).</text>

  <line x1="768" y1="136" x2="768" y2="448" stroke="#b53b15" stroke-width="3"/>
