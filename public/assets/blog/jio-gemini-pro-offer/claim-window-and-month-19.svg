  <rect x="390" y="272" width="569" height="48" rx="8" fill="#6a645c"/>
  <text x="406" y="303" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#ffffff">18 free months</text>
  <text x="975" y="303" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">free until about 30 Apr 2027</text>

  <text x="60" y="380" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#15130f">Claimed 29 Oct 2026</text>
  <text x="60" y="404" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">last day of the window</text>
  <rect x="768" y="362" width="570" height="48" rx="8" fill="#6a645c"/>
  <text x="784" y="393" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#ffffff">18 free months</text>
  <text x="1322" y="393" text-anchor="end" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#ffffff">free until about 29 Apr 2028</text>

