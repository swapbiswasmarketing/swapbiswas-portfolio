  <text x="60" y="752" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Prices from gemini.google/subscriptions and one.google.com/about/plans, logged out from India. Yearly: AI Pro Rs 19,500.</text>
