  <text x="782" y="174" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">unless Jio extends it</text>

  <text x="60" y="200" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#15130f">Offer period</text>
  <text x="60" y="224" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">30 Oct 2025 to 29 Oct 2026</text>
  <rect x="390" y="182" width="378" height="48" rx="8" fill="#15130f"/>
  <text x="406" y="213" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#ffffff">claim window</text>

