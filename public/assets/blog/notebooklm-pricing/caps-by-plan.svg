  <text x="48" y="762" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Prices: gemini.google US and India plan pages, read logged out on 25 October 2026. Ultra costs $99.99 or $199.99</text>
  <text x="48" y="792" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">(Rs 6,500 or Rs 19,500); the plan pages say storage starts at 20 TB and do not say which price carries 30 TB.</text>
