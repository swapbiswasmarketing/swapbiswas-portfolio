<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <rect x="0" y="0" width="1400" height="780" fill="#f6f4ef"/>

  <text x="700" y="70" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Excluded by 'noindex' tag under each Page indexing filter</text>
  <text x="700" y="110" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">The default view mixes two groups; the sitemap filter separates them.</text>

  <rect x="360" y="140" width="680" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="700" y="178" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">DEFAULT VIEW: ALL KNOWN PAGES</text>
  <text x="700" y="216" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Every noindexed URL Google knows, in one count</text>

  <line x1="700" y1="240" x2="700" y2="280" stroke="#15130f" stroke-width="2.5"/>
  <line x1="360" y1="280" x2="1040" y2="280" stroke="#15130f" stroke-width="2.5"/>
  <line x1="360" y1="280" x2="360" y2="316" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1040" y1="280" x2="1040" y2="316" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="353,316 367,316 360,330" fill="#15130f"/>
  <polygon points="1033,316 1047,316 1040,330" fill="#15130f"/>

  <rect x="60" y="330" width="600" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="360" y="368" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">FILTER: ALL SUBMITTED PAGES</text>
  <text x="360" y="404" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">URLs your sitemap asks Google to index</text>
  <text x="360" y="436" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#15130f">URLs to expect: 0</text>

  <rect x="740" y="330" width="600" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1040" y="368" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">FILTER: UNSUBMITTED PAGES ONLY</text>
  <text x="1040" y="404" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">URLs Google found outside your sitemaps</text>
  <text x="1040" y="436" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#15130f">URLs to expect: your inventory</text>

  <line x1="360" y1="450" x2="360" y2="486" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="353,486 367,486 360,500" fill="#15130f"/>

  <rect x="60" y="500" width="600" height="180" rx="12" fill="#ffffff" stroke="#b53b15" stroke-width="2"/>
  <text x="360" y="540" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#b53b15">ANY URL HERE IS A BUG</text>
  <text x="360" y="580" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">The sitemap says index; the page says noindex.</text>
  <text x="360" y="614" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Page wrong: remove noindex, then Validate fix.</text>
  <text x="360" y="648" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Sitemap wrong: drop the URL. Skip validation.</text>

  <line x1="1040" y1="450" x2="1040" y2="470" stroke="#15130f" stroke-width="2.5"/>
  <line x1="885" y1="470" x2="1195" y2="470" stroke="#15130f" stroke-width="2.5"/>
  <line x1="885" y1="470" x2="885" y2="486" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1195" y1="470" x2="1195" y2="486" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="878,486 892,486 885,500" fill="#15130f"/>
  <polygon points="1188,486 1202,486 1195,500" fill="#15130f"/>

  <rect x="740" y="500" width="290" height="180" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="885" y="540" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#2a7347">IN YOUR INVENTORY</text>
  <text x="885" y="580" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Working as intended.</text>
  <text x="885" y="614" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Leave the noindex</text>
  <text x="885" y="648" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">in place.</text>

  <rect x="1050" y="500" width="290" height="180" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1195" y="540" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">NOT IN YOUR INVENTORY</text>
  <text x="1195" y="580" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Open it in URL</text>
  <text x="1195" y="614" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Inspection; fix it if</text>
  <text x="1195" y="648" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">you want it indexed.</text>

  <text x="700" y="730" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">If your sitemap drops noindexed URLs on its own, an accidental noindex lands on the right.</text>
</svg>
