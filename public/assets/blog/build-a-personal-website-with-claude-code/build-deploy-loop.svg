<text x="754" y="506" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Build and hooks</text>
<text x="754" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">HTML, sitemap dates,</text>
<text x="754" y="572" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">IndexNow, Pagefind</text>

