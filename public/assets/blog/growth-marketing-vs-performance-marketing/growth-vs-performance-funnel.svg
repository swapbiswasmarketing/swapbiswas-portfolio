<svg width="1400" height="590" viewBox="0 0 1400 590" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="590" rx="24" fill="url(#bg)"/>

  <text x="700" y="60" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">Where Performance Marketing Fits Inside Growth</text>
  <text x="700" y="100" text-anchor="middle" fill="#9ca3af" font-size="24">Performance marketing is one engine; growth marketing is the whole funnel</text>

  <!-- Performance marketing bracket over Acquisition -->
  <text x="196" y="166" text-anchor="middle" fill="#fb923c" font-size="18" font-weight="700">PERFORMANCE MARKETING</text>
  <text x="196" y="190" text-anchor="middle" fill="#9ca3af" font-size="15">paid acquisition engine</text>
  <line x1="91" y1="212" x2="301" y2="212" stroke="#fb923c" stroke-width="2.5"/>
  <line x1="91" y1="212" x2="91" y2="226" stroke="#fb923c" stroke-width="2.5"/>
  <line x1="301" y1="212" x2="301" y2="226" stroke="#fb923c" stroke-width="2.5"/>

  <!-- Stage 1: Acquisition -->
  <rect x="91" y="230" width="210" height="200" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="113" y="258" width="40" height="6" rx="3" fill="#fb923c"/>
  <text x="113" y="302" fill="#fb923c" font-size="22" font-weight="700">Acquisition</text>
  <text x="113" y="342" fill="#9ca3af" font-size="17">New users enter</text>
  <text x="113" y="364" fill="#9ca3af" font-size="17">the funnel</text>

  <!-- Stage 2: Activation -->
  <rect x="343" y="230" width="210" height="200" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="365" y="258" width="40" height="6" rx="3" fill="#60a5fa"/>
  <text x="365" y="302" fill="#60a5fa" font-size="22" font-weight="700">Activation</text>
  <text x="365" y="342" fill="#9ca3af" font-size="17">First real</text>
  <text x="365" y="364" fill="#9ca3af" font-size="17">value moment</text>

  <!-- Stage 3: Retention -->
  <rect x="595" y="230" width="210" height="200" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="617" y="258" width="40" height="6" rx="3" fill="#5eead4"/>
  <text x="617" y="302" fill="#5eead4" font-size="22" font-weight="700">Retention</text>
  <text x="617" y="342" fill="#9ca3af" font-size="17">They keep</text>
  <text x="617" y="364" fill="#9ca3af" font-size="17">coming back</text>

  <!-- Stage 4: Referral -->
  <rect x="847" y="230" width="210" height="200" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="869" y="258" width="40" height="6" rx="3" fill="#c084fc"/>
  <text x="869" y="302" fill="#c084fc" font-size="22" font-weight="700">Referral</text>
  <text x="869" y="342" fill="#9ca3af" font-size="17">They bring</text>
  <text x="869" y="364" fill="#9ca3af" font-size="17">others in</text>

  <!-- Stage 5: Revenue -->
  <rect x="1099" y="230" width="210" height="200" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="1121" y="258" width="40" height="6" rx="3" fill="#f5a0a1"/>
  <text x="1121" y="302" fill="#f5a0a1" font-size="22" font-weight="700">Revenue</text>
  <text x="1121" y="342" fill="#9ca3af" font-size="17">Usage becomes</text>
  <text x="1121" y="364" fill="#9ca3af" font-size="17">revenue</text>

  <!-- Arrows between stages -->
  <line x1="307" y1="330" x2="331" y2="330" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="331,323 331,337 343,330" fill="#5eead4"/>
  <line x1="559" y1="330" x2="583" y2="330" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="583,323 583,337 595,330" fill="#5eead4"/>
  <line x1="811" y1="330" x2="835" y2="330" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="835,323 835,337 847,330" fill="#5eead4"/>
  <line x1="1063" y1="330" x2="1087" y2="330" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="1087,323 1087,337 1099,330" fill="#5eead4"/>

  <!-- Growth marketing bracket under all five -->
  <line x1="91" y1="450" x2="1309" y2="450" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="91" y1="436" x2="91" y2="450" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1309" y1="436" x2="1309" y2="450" stroke="#5eead4" stroke-width="2.5"/>
  <text x="700" y="484" text-anchor="middle" fill="#5eead4" font-size="20" font-weight="700">GROWTH MARKETING - the full funnel</text>

  <!-- Bottom summary -->
  <text x="700" y="540" text-anchor="middle" fill="#c8cfd8" font-size="21">Performance fills the top; growth compounds the whole loop - and retention funds more acquisition</text>
</svg>
