<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960">
  <rect x="0" y="0" width="1400" height="960" fill="#f6f4ef"/>

  <text x="60" y="66" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.02em" fill="#15130f">Claude Code picks one credential in this order</text>
  <text x="60" y="104" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Authentication precedence from Anthropic's Claude Code docs, checked 2 October 2026</text>

  <text x="250" y="146" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="0.12em" fill="#6a645c">CREDENTIAL</text>
  <text x="860" y="146" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="0.12em" fill="#6a645c">BILLS TO / FEATURES</text>

  <line x1="105" y1="170" x2="105" y2="768" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="98,768 112,768 105,782" fill="#15130f"/>
  <text x="78" y="476" transform="rotate(-90 78 476)" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="0.12em" fill="#6a645c">CHECKED TOP DOWN, HIGHER RANK WINS</text>

  <rect x="150" y="160" width="1190" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <circle cx="200" cy="200" r="26" fill="#15130f"/>
  <text x="200" y="209" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">1</text>
  <text x="250" y="194" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#15130f">CLAUDE_CODE_USE_BEDROCK / _VERTEX / _FOUNDRY</text>
  <text x="250" y="224" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Amazon Bedrock, Google Cloud, Microsoft Foundry</text>
  <text x="860" y="194" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Your cloud account, per token</text>
  <text x="860" y="224" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Loses every claude.ai-login feature</text>

  <rect x="150" y="252" width="1190" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <circle cx="200" cy="292" r="26" fill="#15130f"/>
  <text x="200" y="301" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">2</text>
  <text x="250" y="286" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#15130f">ANTHROPIC_AUTH_TOKEN</text>
  <text x="250" y="316" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">A bearer token for an LLM gateway or proxy</text>
  <text x="860" y="286" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Routed through your gateway</text>
  <text x="860" y="316" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Loses every claude.ai-login feature</text>

  <rect x="150" y="344" width="1190" height="80" rx="12" fill="#f3dcd2" stroke="#b53b15" stroke-width="2"/>
  <circle cx="200" cy="384" r="26" fill="#b53b15"/>
  <text x="200" y="393" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">3</text>
  <text x="250" y="378" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#15130f">ANTHROPIC_API_KEY</text>
  <text x="250" y="408" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Used once you approve it; -p runs always use it</text>
  <text x="860" y="378" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Your Console organization, per token</text>
  <text x="860" y="408" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Loses every claude.ai-login feature</text>

  <rect x="150" y="436" width="1190" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <circle cx="200" cy="476" r="26" fill="#15130f"/>
  <text x="200" y="485" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">4</text>
  <text x="250" y="470" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#15130f">apiKeyHelper</text>
  <text x="250" y="500" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">A settings script that prints a key</text>
  <text x="860" y="470" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">The account behind the key, per token</text>
  <text x="860" y="500" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Loses every claude.ai-login feature</text>

  <rect x="150" y="528" width="1190" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <circle cx="200" cy="568" r="26" fill="#15130f"/>
  <text x="200" y="577" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">5</text>
  <text x="250" y="562" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#15130f">CLAUDE_CODE_OAUTH_TOKEN</text>
  <text x="250" y="592" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">From claude setup-token, for CI and scripts</text>
  <text x="860" y="562" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Your Pro, Max, Team or Enterprise plan</text>
  <text x="860" y="592" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">No Remote Control, connectors or Chrome</text>

  <rect x="150" y="620" width="1190" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <circle cx="200" cy="660" r="26" fill="#15130f"/>
  <text x="200" y="669" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">6</text>
  <text x="250" y="654" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#15130f">ANTHROPIC_PROFILE or federation</text>
  <text x="250" y="684" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Keyless Console sign-in ranks here only if named</text>
  <text x="860" y="654" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Your Console organization, per token</text>
  <text x="860" y="684" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Loses every claude.ai-login feature</text>

  <rect x="150" y="712" width="1190" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <circle cx="200" cy="752" r="26" fill="#2a7347"/>
  <text x="200" y="761" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">7</text>
  <text x="250" y="746" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#15130f">/login with a claude.ai account</text>
  <text x="250" y="776" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">The default for Pro, Max, Team and Enterprise</text>
  <text x="860" y="746" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Your plan's usage limits</text>
  <text x="860" y="776" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#2a7347">Keeps every claude.ai-login feature</text>

  <rect x="150" y="826" width="1190" height="90" rx="12" fill="#eeebe4" stroke="#e4dfd6" stroke-width="1"/>
  <text x="182" y="864" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Cloud sessions run on your plan; a local key blocks claude --cloud and --teleport.</text>
  <text x="182" y="896" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Check which one is live with /status; when two rows show, the other is marked not in use.</text>
</svg>
