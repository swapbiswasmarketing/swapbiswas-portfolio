<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="712" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">Prioritizing ABM Accounts by Fit and Intent</text>
  <text x="712" y="102" text-anchor="middle" fill="#9ca3af" font-size="24">Score every account on ICP fit and buying intent, then match effort to the quadrant</text>

  <!-- Y axis label -->
  <text x="70" y="400" fill="#5eead4" font-size="22" font-weight="700" letter-spacing="0.08em" transform="rotate(-90 70 400)" text-anchor="middle">ICP FIT</text>
  <text x="150" y="168" fill="#9ca3af" font-size="20">High</text>
  <text x="150" y="628" fill="#9ca3af" font-size="20">Low</text>

  <!-- Top-left: High fit, Low intent -->
  <rect x="188" y="150" width="524" height="230" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="188" y="150" width="524" height="6" rx="3" fill="#c084fc"/>
  <text x="218" y="198" fill="#c084fc" font-size="20" font-weight="700" letter-spacing="0.06em">TIER 2</text>
  <text x="218" y="240" fill="#f0f6fc" font-size="27" font-weight="600">Nurture and wait</text>
  <text x="218" y="284" fill="#c8cfd8" font-size="22">Strong fit, not in-market yet.</text>
  <text x="218" y="316" fill="#c8cfd8" font-size="22">Build awareness. Watch for intent</text>
  <text x="218" y="356" fill="#9ca3af" font-size="20">One-to-few, light touch</text>

  <!-- Top-right: High fit, High intent -->
  <rect x="740" y="150" width="524" height="230" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="740" y="150" width="524" height="6" rx="3" fill="#f5a0a1"/>
  <text x="770" y="198" fill="#f5a0a1" font-size="20" font-weight="700" letter-spacing="0.06em">TIER 1</text>
  <text x="770" y="240" fill="#f0f6fc" font-size="27" font-weight="600">One-to-one</text>
  <text x="770" y="284" fill="#c8cfd8" font-size="22">Best fit and buying now.</text>
  <text x="770" y="316" fill="#c8cfd8" font-size="22">Deep, custom, exec-sponsored</text>
  <text x="770" y="356" fill="#9ca3af" font-size="20">Highest effort, fewest accounts</text>

  <!-- Bottom-left: Low fit, Low intent -->
  <rect x="188" y="396" width="524" height="230" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="188" y="396" width="524" height="6" rx="3" fill="#9ca3af"/>
  <text x="218" y="444" fill="#9ca3af" font-size="20" font-weight="700" letter-spacing="0.06em">DEPRIORITIZE</text>
  <text x="218" y="486" fill="#f0f6fc" font-size="27" font-weight="600">Leave out</text>
  <text x="218" y="530" fill="#c8cfd8" font-size="22">Neither fit nor intent.</text>
  <text x="218" y="562" fill="#c8cfd8" font-size="22">Keep out of the ABM program</text>
  <text x="218" y="602" fill="#9ca3af" font-size="20">No spend here</text>

  <!-- Bottom-right: Low fit, High intent -->
  <rect x="740" y="396" width="524" height="230" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="740" y="396" width="524" height="6" rx="3" fill="#60a5fa"/>
  <text x="770" y="444" fill="#60a5fa" font-size="20" font-weight="700" letter-spacing="0.06em">ONE-TO-MANY</text>
  <text x="770" y="486" fill="#f0f6fc" font-size="27" font-weight="600">Monitor lightly</text>
  <text x="770" y="530" fill="#c8cfd8" font-size="22">Active but off-ICP.</text>
  <text x="770" y="562" fill="#c8cfd8" font-size="22">Programmatic touch. Qualify hard</text>
  <text x="770" y="602" fill="#9ca3af" font-size="20">Automate, do not personalize</text>

  <!-- X axis label -->
  <text x="726" y="680" text-anchor="middle" fill="#5eead4" font-size="22" font-weight="700" letter-spacing="0.08em">BUYING INTENT</text>
  <text x="220" y="680" fill="#9ca3af" font-size="20">Low</text>
  <text x="1200" y="680" fill="#9ca3af" font-size="20">High</text>
</svg>
