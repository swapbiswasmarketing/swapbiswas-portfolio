<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <rect x="0" y="0" width="1400" height="760" fill="#f6f4ef"/>

  <text x="60" y="62" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.02em" fill="#15130f">What makes the next Claude Code turn slower</text>
  <text x="60" y="100" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Prompt cache rules from Anthropic's Claude Code docs, read 10 October 2026</text>

  <rect x="60" y="140" width="620" height="470" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">REBUILDS THE CACHE</text>
  <text x="88" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">One slower turn follows</text>
  <line x1="88" y1="244" x2="652" y2="244" stroke="#e4dfd6" stroke-width="1"/>

  <rect x="78" y="262" width="584" height="44" rx="8" fill="#f3dcd2"/>
  <circle cx="102" cy="284" r="6" fill="#b53b15"/>
  <text x="124" y="291" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Switch model with /model</text>
  <circle cx="102" cy="336" r="6" fill="#15130f"/>
  <text x="124" y="343" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Change effort level, on most models</text>
  <circle cx="102" cy="388" r="6" fill="#15130f"/>
  <text x="124" y="395" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Turn on fast mode, once per conversation</text>
  <circle cx="102" cy="440" r="6" fill="#15130f"/>
  <text x="124" y="447" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Add an MCP server while tools load upfront</text>
  <circle cx="102" cy="492" r="6" fill="#15130f"/>
  <text x="124" y="499" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Come back after the cache lifetime</text>
  <circle cx="102" cy="544" r="6" fill="#15130f"/>
  <text x="124" y="551" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Start a conversation after an upgrade</text>

  <rect x="720" y="140" width="620" height="470" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="748" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="0.12em" fill="#6a645c">KEEPS THE CACHE</text>
  <text x="748" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">No slowdown on the next turn</text>
  <line x1="748" y1="244" x2="1312" y2="244" stroke="#e4dfd6" stroke-width="1"/>

  <circle cx="762" cy="284" r="6" fill="#2a7347"/>
  <text x="784" y="291" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Edit files in your repository</text>
  <circle cx="762" cy="336" r="6" fill="#2a7347"/>
  <text x="784" y="343" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Change output style</text>
  <circle cx="762" cy="388" r="6" fill="#2a7347"/>
  <text x="784" y="395" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Run /rewind or /recap</text>
  <circle cx="762" cy="440" r="6" fill="#2a7347"/>
  <text x="784" y="447" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Spawn a subagent</text>
  <circle cx="762" cy="492" r="6" fill="#2a7347"/>
  <text x="784" y="499" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Edit CLAUDE.md mid-session</text>
  <circle cx="762" cy="544" r="6" fill="#2a7347"/>
  <text x="784" y="551" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Change effort on Opus 5.5 with a</text>
  <text x="784" y="583" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">subscription or an API key</text>

  <rect x="60" y="642" width="1280" height="68" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="88" y="684" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.12em" fill="#6a645c">THE DOCS' TIP</text>
  <text x="270" y="684" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">&quot;Pick your model and effort level at the top of a session&quot;</text>
</svg>
