  <text x="770" y="590" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">$100</text>
  <text x="890" y="590" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">$120</text>

