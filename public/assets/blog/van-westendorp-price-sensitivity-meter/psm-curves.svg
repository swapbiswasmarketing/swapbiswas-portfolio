  <line x1="416" y1="550" x2="416" y2="568" stroke="#b53b15" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="261" y="479" width="95" height="26" rx="4" fill="#ffffff"/>
  <text x="350" y="498" text-anchor="end" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" fill="#15130f">PMC $33</text>
  <rect x="430" y="407" width="76" height="26" fill="#f3dcd2"/>
  <rect x="506" y="407" width="19" height="26" fill="#ffffff"/>
  <text x="436" y="426" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" fill="#15130f">IPP $42</text>
  <rect x="514" y="501" width="95" height="26" rx="4" fill="#ffffff"/>
  <text x="520" y="520" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" fill="#15130f">PME $56</text>

  <line x1="980" y1="195" x2="980" y2="620" stroke="#e4dfd6" stroke-width="1"/>

  <text x="1015" y="212" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#b53b15" letter-spacing="0.12em">READOUT</text>

  <text x="1015" y="262" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">PMC $33</text>
  <text x="1015" y="290" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">too cheap crosses expensive</text>

  <text x="1015" y="342" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#b53b15">OPP $41</text>
  <text x="1015" y="370" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">too cheap crosses too expensive</text>

  <text x="1015" y="422" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">IPP $42</text>
  <text x="1015" y="450" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">cheap crosses expensive</text>

  <text x="1015" y="502" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">PME $56</text>
  <text x="1015" y="530" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">cheap crosses too expensive</text>

  <line x1="1015" y1="560" x2="1300" y2="560" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1015" y="595" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Acceptable range: <tspan font-weight="600" fill="#15130f">$33 to $56</tspan></text>

  <line x1="170" y1="626" x2="186" y2="626" stroke="#6a645c" stroke-width="2.5"/>
  <line x1="192" y1="626" x2="208" y2="626" stroke="#6a645c" stroke-width="2.5"/>
  <text x="222" y="633" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Too cheap (quality doubted)</text>
  <line x1="600" y1="626" x2="640" y2="626" stroke="#6a645c" stroke-width="2.5"/>
  <text x="654" y="633" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Cheap / bargain</text>

  <line x1="170" y1="662" x2="210" y2="662" stroke="#15130f" stroke-width="2.5"/>
  <text x="222" y="669" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Expensive (buyer hesitates)</text>
  <line x1="600" y1="662" x2="616" y2="662" stroke="#15130f" stroke-width="2.5"/>
  <line x1="622" y1="662" x2="638" y2="662" stroke="#15130f" stroke-width="2.5"/>
  <text x="654" y="669" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Too expensive (walks away)</text>

  <text x="60" y="740" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Shaded band is the range of acceptable prices, from the point of marginal cheapness to the point of marginal expensiveness.</text>
  <text x="60" y="770" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">At 20 responses each curve is a staircase, so every crossing is a short plateau. Each label sits at the lowest price on its plateau.</text>
</svg>
