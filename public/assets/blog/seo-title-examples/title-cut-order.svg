<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" width="1400" height="740">
  <rect x="0" y="0" width="1400" height="740" fill="#f6f4ef"/>
  <text x="80" y="72" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">The cut order for an over-long SEO title</text>
  <text x="80" y="112" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Run the steps in order and stop as soon as the title fits. Counts are from 87 real rewrites.</text>

  <rect x="80" y="144" width="380" height="226" rx="12" fill="#f3dcd2" stroke="#b53b15" stroke-width="2"/>
  <text x="108" y="186" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#b53b15">STEP 1 - KEEP</text>
  <text x="108" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Keep the keyword</text>
  <text x="108" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">72 of 78 titles kept every</text>
  <text x="108" y="304" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">word before the colon or</text>
  <text x="108" y="336" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">question mark.</text>

  <line x1="464" y1="257" x2="492" y2="257" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="492,250 506,257 492,264" fill="#15130f"/>

  <rect x="510" y="144" width="380" height="226" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="186" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">STEP 2 - CUT</text>
  <text x="538" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Drop the year</text>
  <text x="538" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Removed from 55 of 87.</text>
  <text x="538" y="304" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Kept in the 20 titles</text>
  <text x="538" y="336" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">where it still fit.</text>

  <line x1="894" y1="257" x2="922" y2="257" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="922,250 936,257 922,264" fill="#15130f"/>

  <rect x="940" y="144" width="380" height="226" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="968" y="186" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">STEP 3 - CUT</text>
  <text x="968" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Delete filler words</text>
  <text x="968" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Actually, Complete, Proven,</text>
  <text x="968" y="304" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Ultimate, and a Definition</text>
  <text x="968" y="336" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">the question implies.</text>

  <line x1="1130" y1="374" x2="1130" y2="410" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1131.25" y1="410" x2="268.75" y2="410" stroke="#15130f" stroke-width="2.5"/>
  <line x1="270" y1="408.75" x2="270" y2="436" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="263,436 277,436 270,450" fill="#15130f"/>

  <rect x="80" y="454" width="380" height="226" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="108" y="496" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">STEP 4 - CUT</text>
  <text x="108" y="540" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Unwrap the brackets</text>
  <text x="108" y="582" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">7 of 8 bracketed phrases</text>
  <text x="108" y="614" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">lost the brackets or</text>
  <text x="108" y="646" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">went entirely.</text>

  <line x1="464" y1="567" x2="492" y2="567" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="492,560 506,567 492,574" fill="#15130f"/>

  <rect x="510" y="454" width="380" height="226" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="538" y="496" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">STEP 5 - SWAP</text>
  <text x="538" y="540" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Swap vague for a count</text>
  <text x="538" y="582" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Step-by-Step became a count</text>
  <text x="538" y="614" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">such as 8-Step or 6-Phase</text>
  <text x="538" y="646" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">in all 5 titles that cut it.</text>

  <line x1="894" y1="567" x2="922" y2="567" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="922,560 936,567 922,574" fill="#15130f"/>

  <rect x="940" y="454" width="380" height="226" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="968" y="496" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">STEP 6 - REWRITE</text>
  <text x="968" y="540" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Rewrite the promise</text>
  <text x="968" y="582" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Shorter, never truncated</text>
  <text x="968" y="614" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">mid-phrase. 37 rewrites</text>
  <text x="968" y="646" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">needed new words.</text>
</svg>
