<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <rect x="0" y="0" width="1400" height="780" fill="#f6f4ef"/>
  <text x="60" y="72" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Claude plans: what each one meters</text>
  <text x="60" y="112" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Usage relative to Pro, from claude.com/pricing as of 31 October 2026</text>

  <g font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#6a645c" letter-spacing="1.5">
    <text x="60" y="203">PRICE</text>
    <text x="60" y="323">EVERY 5 HOURS</text>
    <text x="60" y="453">EVERY WEEK</text>
    <text x="60" y="573">API CREDITS</text>
    <text x="60" y="598">PER MONTH</text>
  </g>

  <g fill="#ffffff" stroke="#e4dfd6" stroke-width="1">
    <rect x="320" y="140" width="240" height="110" rx="12"/>
    <rect x="590" y="140" width="240" height="110" rx="12"/>
    <rect x="860" y="140" width="240" height="110" rx="12"/>
    <rect x="1130" y="140" width="240" height="110" rx="12"/>

    <rect x="320" y="270" width="240" height="110" rx="12"/>
    <rect x="590" y="270" width="240" height="110" rx="12"/>
    <rect x="860" y="270" width="240" height="110" rx="12"/>

    <rect x="320" y="400" width="240" height="110" rx="12"/>
    <rect x="590" y="400" width="240" height="110" rx="12"/>
    <rect x="860" y="400" width="240" height="110" rx="12"/>
    <rect x="1130" y="400" width="240" height="110" rx="12"/>

    <rect x="320" y="530" width="240" height="90" rx="12"/>
    <rect x="590" y="530" width="240" height="90" rx="12"/>
    <rect x="860" y="530" width="240" height="90" rx="12"/>
    <rect x="1130" y="530" width="240" height="90" rx="12"/>
  </g>
  <rect x="1130" y="270" width="240" height="110" rx="12" fill="#f3dcd2" stroke="#b53b15" stroke-width="2"/>

  <g font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f" text-anchor="middle">
    <text x="440" y="186">Free</text>
    <text x="710" y="186">Pro</text>
    <text x="980" y="186">Max</text>
    <text x="1250" y="186">Ultra</text>
  </g>
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632" text-anchor="middle">
    <text x="440" y="222">$0</text>
    <text x="710" y="216">$20 a month</text>
    <text x="980" y="222">$100 a month</text>
    <text x="1250" y="222">$200 a month</text>
  </g>
  <text x="710" y="240" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c" text-anchor="middle">or $200 billed yearly</text>

  <g font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f" text-anchor="middle">
    <text x="440" y="334">Limited</text>
    <text x="710" y="334">1x</text>
    <text x="980" y="334">5x Pro</text>
    <text x="440" y="464">Limited</text>
    <text x="710" y="464">1x</text>
    <text x="980" y="464">5x Pro</text>
    <text x="1250" y="464">10x Pro</text>
  </g>
  <text x="1250" y="322" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#b53b15" text-anchor="middle">No 5-hour limit</text>
  <text x="1250" y="354" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632" text-anchor="middle">for verified accounts</text>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#3a3632" text-anchor="middle">
    <text x="440" y="583">None</text>
    <text x="710" y="583">None</text>
    <text x="980" y="583">$100</text>
    <text x="1250" y="583">$200</text>
  </g>

  <line x1="60" y1="656" x2="1370" y2="656" stroke="#e4dfd6" stroke-width="1"/>
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">
    <text x="60" y="696">API credits cover the Claude API and the Agent SDK, not interactive Claude Code.</text>
    <text x="60" y="728">Prices are in US dollars, exclude tax, and Anthropic says they can change.</text>
  </g>
</svg>
