<text x="1044" y="560" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">Nothing to check</text>
<text x="1008" y="600" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No dot cites a source, and</text>
