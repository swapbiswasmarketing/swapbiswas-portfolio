<text x="1008" y="408" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Past the midline, each tool</text>
<text x="1008" y="440" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">further right sits lower:</text>
<text x="1008" y="472" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">r = -0.64 across four dots.</text>
<rect x="980" y="514" width="380" height="176" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
