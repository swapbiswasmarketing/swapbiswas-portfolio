<text x="66" y="626" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Published in Competitive Analysis Examples, March 2026. No dot cited a source.</text>
<text x="66" y="656" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Dashed line: least-squares fit through the four dots.</text>
