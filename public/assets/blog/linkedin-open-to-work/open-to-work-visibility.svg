<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <rect x="0" y="0" width="1400" height="800" fill="#f6f4ef"/>
  <text x="60" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">LinkedIn Open to Work: three audiences to choose from</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Who sees each option, per LinkedIn Help (a507508 and a510407), read 31 October 2026</text>

  <rect x="60" y="140" width="406" height="440" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" letter-spacing="2" fill="#6a645c">OPTION 1</text>
  <text x="90" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">All LinkedIn Members</text>
  <line x1="90" y1="244" x2="436" y2="244" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="280" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Who sees it</text>
  <text x="90" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">All members, recruiters and</text>
  <text x="90" y="344" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">people at your current company</text>
  <text x="90" y="394" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Photo frame</text>
  <text x="90" y="426" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Yes, #OpenToWork</text>
  <text x="90" y="476" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Recruiters at your company</text>
  <text x="90" y="508" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Included in the audience</text>

  <rect x="497" y="140" width="406" height="440" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="527" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" letter-spacing="2" fill="#6a645c">OPTION 2</text>
  <text x="527" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Recruiters only</text>
  <line x1="527" y1="244" x2="873" y2="244" stroke="#e4dfd6" stroke-width="1"/>
  <text x="527" y="280" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Who sees it</text>
  <text x="527" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">People using LinkedIn</text>
  <text x="527" y="344" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Recruiter only</text>
  <text x="527" y="394" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Photo frame</text>
  <text x="527" y="426" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No</text>
  <text x="527" y="476" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Recruiters at your company</text>
  <text x="527" y="508" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Hidden by a Company ID match,</text>
  <text x="527" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#b53b15">"can't guarantee complete privacy"</text>

  <rect x="934" y="140" width="406" height="440" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="964" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" letter-spacing="2" fill="#6a645c">OPTION 3</text>
  <text x="964" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Visible only to you</text>
  <line x1="964" y1="244" x2="1310" y2="244" stroke="#e4dfd6" stroke-width="1"/>
  <text x="964" y="280" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Who sees it</text>
  <text x="964" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">You; preferences tailor your</text>
  <text x="964" y="344" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">job recommendations</text>
  <text x="964" y="394" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Photo frame</text>
  <text x="964" y="426" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No</text>
  <text x="964" y="476" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Recruiters at your company</text>
  <text x="964" y="508" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No recruiter audience is</text>
  <text x="964" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">listed for this option</text>

  <rect x="60" y="610" width="1280" height="130" rx="12" fill="#eeebe4" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="650" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" letter-spacing="2" fill="#6a645c">INDIA ONLY, ANY OF THE THREE OPTIONS</text>
  <text x="90" y="686" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Notice period or availability to join, and expected annual salary</text>
  <text x="90" y="718" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">"visible to recruiters only, regardless of your Open To Work visibility setting"</text>
</svg>
