<text x="110" y="196"><tspan font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">220</tspan><tspan dx="12" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Profile headline: LinkedIn's Talent Blog (Feb 2025) and six current guides</tspan></text>
<rect x="110" y="210" width="1100" height="22" rx="3" fill="#b53b15"/>
<text x="110" y="268"><tspan font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">240</tspan><tspan dx="12" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Derrick's figure for mobile (Oct 2026); five other current guides give no separate mobile limit</tspan></text>
<rect x="110" y="282" width="1200" height="22" rx="3" fill="#6a645c"/>
<text x="110" y="340"><tspan font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">120</tspan><tspan dx="12" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Older figure: 2017 and 2018 pages, Copper (Sep 2025), Databox (Feb 2026)</tspan></text>
<rect x="110" y="354" width="600" height="22" rx="3" fill="#6a645c"/>
<text x="110" y="412"><tspan font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#15130f">60-80</tspan><tspan dx="12" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Shown before the cut, per four guides; no LinkedIn page I read prints one</tspan></text>
