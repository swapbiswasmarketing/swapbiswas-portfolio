<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="730" rx="24" fill="url(#bg)"/>

  <text x="700" y="62" text-anchor="middle" fill="#f0f6fc" font-size="42" font-weight="700">The Brand Messaging Framework</text>
  <text x="700" y="100" text-anchor="middle" fill="#9ca3af" font-size="24">Five layers, built bottom-up, activated by a matrix and a hierarchy</text>

  <!-- Row 1 -->
  <!-- Card 1: Audience Insight -->
  <g filter="url(#shadow)">
    <rect x="80" y="140" width="380" height="200" rx="16" fill="#151b23" stroke="#30363d"/>
  </g>
  <text x="270" y="185" text-anchor="middle" fill="#5eead4" font-size="21" font-weight="700" letter-spacing="0.08em">LAYER 1</text>
  <text x="270" y="230" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="600">Audience Insight</text>
  <text x="270" y="272" text-anchor="middle" fill="#c8cfd8" font-size="22">Who you serve and</text>
  <text x="270" y="302" text-anchor="middle" fill="#c8cfd8" font-size="22">what they struggle with</text>

  <!-- Card 2: Value Proposition -->
  <g filter="url(#shadow)">
    <rect x="510" y="140" width="380" height="200" rx="16" fill="#151b23" stroke="#30363d"/>
  </g>
  <text x="700" y="185" text-anchor="middle" fill="#60a5fa" font-size="21" font-weight="700" letter-spacing="0.08em">LAYER 2</text>
  <text x="700" y="230" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="600">Value Proposition</text>
  <text x="700" y="272" text-anchor="middle" fill="#c8cfd8" font-size="22">The one reason you are</text>
  <text x="700" y="302" text-anchor="middle" fill="#c8cfd8" font-size="22">the better choice</text>

  <!-- Card 3: Messaging Pillars -->
  <g filter="url(#shadow)">
    <rect x="940" y="140" width="380" height="200" rx="16" fill="#151b23" stroke="#30363d"/>
  </g>
  <text x="1130" y="185" text-anchor="middle" fill="#c084fc" font-size="21" font-weight="700" letter-spacing="0.08em">LAYER 3</text>
  <text x="1130" y="230" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="600">Messaging Pillars</text>
  <text x="1130" y="272" text-anchor="middle" fill="#c8cfd8" font-size="22">3-4 themes that carry</text>
  <text x="1130" y="302" text-anchor="middle" fill="#c8cfd8" font-size="22">the value proposition</text>

  <!-- Row 2 -->
  <!-- Card 4: Proof Points -->
  <g filter="url(#shadow)">
    <rect x="80" y="470" width="380" height="200" rx="16" fill="#151b23" stroke="#30363d"/>
  </g>
  <text x="270" y="515" text-anchor="middle" fill="#f5a0a1" font-size="21" font-weight="700" letter-spacing="0.08em">LAYER 4</text>
  <text x="270" y="560" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="600">Proof Points</text>
  <text x="270" y="602" text-anchor="middle" fill="#c8cfd8" font-size="22">Evidence under each</text>
  <text x="270" y="632" text-anchor="middle" fill="#c8cfd8" font-size="22">pillar claim</text>

  <!-- Card 5: Messaging Matrix -->
  <g filter="url(#shadow)">
    <rect x="510" y="470" width="380" height="200" rx="16" fill="#151b23" stroke="#30363d"/>
  </g>
  <text x="700" y="515" text-anchor="middle" fill="#fb923c" font-size="21" font-weight="700" letter-spacing="0.08em">LAYER 5A</text>
  <text x="700" y="560" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="600">Messaging Matrix</text>
  <text x="700" y="602" text-anchor="middle" fill="#c8cfd8" font-size="22">Message by audience</text>
  <text x="700" y="632" text-anchor="middle" fill="#c8cfd8" font-size="22">and journey stage</text>

  <!-- Card 6: Messaging Hierarchy -->
  <g filter="url(#shadow)">
    <rect x="940" y="470" width="380" height="200" rx="16" fill="#151b23" stroke="#30363d"/>
  </g>
  <text x="1130" y="515" text-anchor="middle" fill="#b388f2" font-size="21" font-weight="700" letter-spacing="0.08em">LAYER 5B</text>
  <text x="1130" y="560" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="600">Messaging Hierarchy</text>
  <text x="1130" y="602" text-anchor="middle" fill="#c8cfd8" font-size="22">Top-line message down</text>
  <text x="1130" y="632" text-anchor="middle" fill="#c8cfd8" font-size="22">to the proof</text>

  <!-- Arrows row 1 -->
  <line x1="466" y1="240" x2="496" y2="240" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="496,233 510,240 496,247" fill="#5eead4"/>
  <line x1="896" y1="240" x2="926" y2="240" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="926,233 940,240 926,247" fill="#5eead4"/>

  <!-- Row transition: layer 3 bottom -> layer 4 top -->
  <line x1="1130" y1="340" x2="1130" y2="405" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1130" y1="405" x2="270" y2="405" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="270" y1="405" x2="270" y2="456" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="263,456 277,456 270,470" fill="#5eead4"/>

  <!-- Arrows row 2 -->
  <line x1="466" y1="570" x2="496" y2="570" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="496,563 510,570 496,577" fill="#5eead4"/>
  <line x1="896" y1="570" x2="926" y2="570" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="926,563 940,570 926,577" fill="#5eead4"/>
</svg>
