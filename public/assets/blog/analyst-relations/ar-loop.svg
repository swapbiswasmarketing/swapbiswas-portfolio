<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="880" rx="24" fill="url(#bg)"/>

  <text x="700" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc">The Analyst Relations Loop</text>
  <text x="700" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="25" fill="#9ca3af">The report is the artifact. The buyer inquiry is the point.</text>

  <!-- Card 1 -->
  <rect x="90" y="150" width="560" height="250" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="122" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#c084fc" letter-spacing="0.08em">STEP 1</text>
  <text x="122" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">You brief the analyst</text>
  <text x="122" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">Positioning, what changed, and customer</text>
  <text x="122" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">proof. Roughly 30 minutes, vendor-led.</text>
  <text x="122" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#c084fc">Reuses assets a PMM already owns</text>

  <!-- Card 2 -->
  <rect x="750" y="150" width="560" height="250" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="782" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#60a5fa" letter-spacing="0.08em">STEP 2</text>
  <text x="782" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">The analyst forms a view</text>
  <text x="782" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">They update their model of the category</text>
  <text x="782" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">and decide where you actually fit.</text>
  <text x="782" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#60a5fa">Formed months before any report</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="662" y1="275" x2="724" y2="275" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="724,268 738,275 724,282" fill="#5eead4"/>

  <!-- Row transition 2 -> 3 -->
  <line x1="1030" y1="400" x2="1030" y2="445" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1030" y1="445" x2="370" y2="445" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="370" y1="445" x2="370" y2="476" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="363,476 377,476 370,490" fill="#5eead4"/>

  <!-- Card 3 -->
  <rect x="90" y="500" width="560" height="250" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="122" y="546" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#fb923c" letter-spacing="0.08em">STEP 3</text>
  <text x="122" y="590" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">The analyst advises buyers</text>
  <text x="122" y="638" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">Gartner logged 510,000+ direct client</text>
  <text x="122" y="670" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">interactions in 2025. You are not on them.</text>
  <text x="122" y="716" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#fb923c">Where deals are actually influenced</text>

  <!-- Card 4 -->
  <rect x="750" y="500" width="560" height="250" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="782" y="546" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#5eead4" letter-spacing="0.08em">STEP 4</text>
  <text x="782" y="590" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="600" fill="#f0f6fc">Market intel returns</text>
  <text x="782" y="638" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">Competitor moves, buyer language, and</text>
  <text x="782" y="670" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">how the market reframes the problem.</text>
  <text x="782" y="716" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#5eead4">Feeds competitive intelligence</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="662" y1="625" x2="724" y2="625" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="724,618 738,625 724,632" fill="#5eead4"/>

  <!-- Footer -->
  <rect x="90" y="790" width="1220" height="60" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
  <text x="700" y="828" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8cfd8">Step 4 feeds Step 1: every cycle sharpens the positioning you brief next quarter.</text>
</svg>
