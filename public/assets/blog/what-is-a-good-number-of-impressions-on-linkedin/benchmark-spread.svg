<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 868" width="1400" height="868">
  <rect x="0" y="0" width="1400" height="868" fill="#f6f4ef"/>

  <text x="60" y="78" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Eight sources, one 1,000-person LinkedIn account</text>
  <text x="60" y="116" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">What each source calls good, solid or average, in impressions per post</text>

  <g stroke="#e4dfd6" stroke-width="1">
    <line x1="450" y1="148" x2="450" y2="698"/>
    <line x1="659.9" y1="148" x2="659.9" y2="698"/>
    <line x1="890" y1="148" x2="890" y2="698"/>
    <line x1="1099.9" y1="148" x2="1099.9" y2="698"/>
    <line x1="1330" y1="148" x2="1330" y2="698"/>
  </g>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif">
    <text x="60" y="177" font-size="20" fill="#15130f">OutX</text>
    <text x="60" y="201" font-size="18" fill="#6a645c">500-1,000 connections tier</text>
    <rect x="659.9" y="171" width="97.7" height="18" rx="9" fill="#6a645c"/>
    <text x="771.6" y="188" font-size="22" fill="#15130f">300-500</text>

    <text x="60" y="247" font-size="20" fill="#15130f">Kwanzoo</text>
    <text x="60" y="271" font-size="18" fill="#6a645c">no audience size given</text>
    <rect x="757.6" y="241" width="132.4" height="18" rx="9" fill="#6a645c"/>
    <text x="904" y="258" font-size="22" fill="#15130f">500-1,000</text>

    <text x="60" y="317" font-size="20" font-weight="600" fill="#15130f">MagicPost, good (p75)</text>
    <text x="60" y="341" font-size="18" fill="#6a645c">566,957 posts, sample disclosed</text>
    <rect x="767.9" y="311" width="153.4" height="18" rx="9" fill="#b53b15"/>
    <text x="935.3" y="328" font-size="22" font-weight="600" fill="#15130f">528-1,178</text>

    <text x="60" y="387" font-size="20" fill="#15130f">ContentIn, format averages</text>
    <text x="60" y="411" font-size="18" fill="#6a645c">text 800, image 1,200, video 2,000</text>
    <rect x="847.4" y="381" width="175" height="18" rx="9" fill="#6a645c"/>
    <text x="1036.4" y="398" font-size="22" fill="#15130f">800-2,000</text>

    <text x="60" y="457" font-size="20" fill="#15130f">HyperClapper</text>
    <text x="60" y="481" font-size="18" fill="#6a645c">no audience size given</text>
    <circle cx="890" cy="460" r="9" fill="#6a645c"/>
    <text x="908" y="468" font-size="22" fill="#15130f">about 1,000</text>

    <text x="60" y="527" font-size="20" fill="#15130f">Linkboost</text>
    <text x="60" y="551" font-size="18" fill="#6a645c">no audience size given</text>
    <circle cx="890" cy="530" r="9" fill="#6a645c"/>
    <text x="908" y="538" font-size="22" fill="#15130f">1,000</text>

    <text x="60" y="597" font-size="20" fill="#15130f">ContentRadar</text>
    <text x="60" y="621" font-size="18" fill="#6a645c">hundreds to thousands of connections</text>
    <rect x="890" y="591" width="307.6" height="18" rx="9" fill="#6a645c"/>
    <text x="1211.6" y="608" font-size="22" fill="#15130f">1,000-5,000</text>

    <text x="60" y="667" font-size="20" fill="#15130f">Bluecast</text>
    <text x="60" y="691" font-size="18" fill="#6a645c">1,000+ connections</text>
    <rect x="1022.4" y="661" width="175.2" height="18" rx="9" fill="#6a645c"/>
    <text x="1211.6" y="678" font-size="22" fill="#15130f">2,000-5,000</text>
  </g>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c" text-anchor="middle">
    <text x="450" y="726">100</text>
    <text x="659.9" y="726">300</text>
    <text x="890" y="726">1,000</text>
    <text x="1099.9" y="726">3,000</text>
    <text x="1320" y="726">10,000</text>
    <text x="890" y="758">Impressions per post, log scale</text>
  </g>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">
    <text x="60" y="806">Sources: outx.ai, kwanzoo.com, magicpost.in, contentin.io, hyperclapper.com, linkboost.co,</text>
    <text x="60" y="832">contentradar.ai and bluecast.ai, checked 30 September 2026</text>
  </g>
</svg>
