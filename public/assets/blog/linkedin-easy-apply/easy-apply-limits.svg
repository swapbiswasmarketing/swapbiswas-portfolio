<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <rect x="0" y="0" width="1400" height="800" fill="#f6f4ef"/>
  <text x="60" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">The three Easy Apply limits LinkedIn documents</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Per LinkedIn Help, Easy Apply limits (a8068422), read 4 November 2026</text>

  <rect x="60" y="140" width="406" height="430" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">LIMIT 1</text>
  <text x="90" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Daily limit</text>
  <line x1="90" y1="244" x2="436" y2="244" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="282" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">What triggers it</text>
  <text x="90" y="314" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">A set number of Easy Apply</text>
  <text x="90" y="346" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">applications in one day</text>
  <text x="90" y="396" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">What happens</text>
  <text x="90" y="428" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">You wait for the reset</text>
  <text x="90" y="478" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">When it ends</text>
  <text x="90" y="512" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#b53b15">At the end of the day (UTC)</text>

  <rect x="497" y="140" width="406" height="430" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="527" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">LIMIT 2</text>
  <text x="527" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Speed limit</text>
  <line x1="527" y1="244" x2="873" y2="244" stroke="#e4dfd6" stroke-width="1"/>
  <text x="527" y="282" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">What triggers it</text>
  <text x="527" y="314" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Rapidly submitting</text>
  <text x="527" y="346" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">applications in a short time</text>
  <text x="527" y="396" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">What happens</text>
  <text x="527" y="428" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">A temporary pause on</text>
  <text x="527" y="460" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Easy Apply</text>
  <text x="527" y="510" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">When it ends</text>
  <text x="527" y="542" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">LinkedIn gives no duration</text>

  <rect x="934" y="140" width="406" height="430" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="964" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">LIMIT 3</text>
  <text x="964" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Inauthentic activity</text>
  <line x1="964" y1="244" x2="1310" y2="244" stroke="#e4dfd6" stroke-width="1"/>
  <text x="964" y="282" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">What triggers it</text>
  <text x="964" y="314" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Activity that seems</text>
  <text x="964" y="346" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">inauthentic to LinkedIn</text>
  <text x="964" y="396" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">What happens</text>
  <text x="964" y="428" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">LinkedIn may lower your</text>
  <text x="964" y="460" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">daily limit</text>
  <text x="964" y="510" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">If flagged by mistake</text>
  <text x="964" y="542" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Verify your account</text>

  <rect x="60" y="600" width="1280" height="140" rx="12" fill="#eeebe4" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="642" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#6a645c">WHAT LINKEDIN DOES NOT PUBLISH</text>
  <text x="90" y="680" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">No number for the daily limit. Auto-apply vendor guides claim about 50 (LoopCV),</text>
  <text x="90" y="712" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">60 (FastApply) or 100 (AutoApplyMax) a day. None of those figures is on LinkedIn's page.</text>
</svg>
