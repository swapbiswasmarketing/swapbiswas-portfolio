<text x="88" y="524" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Google's Article doc recommends 16:9, 4:3 and 1:1 images; its Discover page recommends 16:9.</text>
<text x="88" y="558" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">With 64 px side margins, this card keeps every word only in the 16:9 frame; 4:3 and 1:1 need their own images.</text>
