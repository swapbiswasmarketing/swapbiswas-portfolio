<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <rect x="0" y="0" width="1400" height="760" fill="#f6f4ef"/>

  <text x="60" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">What one marketing job costs on each Claude model</text>
  <text x="60" y="110" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">API list prices as of October 2026, visible text only, thinking tokens excluded</text>

  <!-- Card 1: blog draft -->
  <rect x="60" y="140" width="620" height="520" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="192" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">One 2,000-word blog draft</text>
  <text x="90" y="226" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">6,000 words in, 2,000 words out</text>
  <line x1="90" y1="250" x2="650" y2="250" stroke="#e4dfd6" stroke-width="1"/>

  <text x="90" y="307" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Haiku 4.5</text>
  <rect x="250" y="282" width="22" height="36" rx="4" fill="#15130f"/>
  <text x="286" y="307" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#15130f">$0.02</text>

  <text x="90" y="387" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Sonnet 5.5</text>
  <rect x="250" y="362" width="60" height="36" rx="4" fill="#b53b15"/>
  <text x="324" y="387" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#b53b15">$0.06</text>

  <text x="90" y="467" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Opus 5.5</text>
  <rect x="250" y="442" width="120" height="36" rx="4" fill="#15130f"/>
  <text x="384" y="467" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#15130f">$0.12</text>

  <text x="90" y="547" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Fable 5.1</text>
  <rect x="250" y="522" width="300" height="36" rx="4" fill="#15130f"/>
  <text x="564" y="547" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#15130f">$0.29</text>

  <line x1="90" y1="592" x2="650" y2="592" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="630" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Cents per draft on every tier</text>

  <!-- Card 2: tagging -->
  <rect x="720" y="140" width="620" height="520" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="750" y="192" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Tag 10,000 customer reviews</text>
  <text x="750" y="226" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">150 words in, 10 words out, per review</text>
  <line x1="750" y1="250" x2="1310" y2="250" stroke="#e4dfd6" stroke-width="1"/>

  <text x="750" y="307" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Haiku 4.5</text>
  <rect x="910" y="282" width="22" height="36" rx="4" fill="#15130f"/>
  <text x="946" y="307" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#15130f">$2.66</text>

  <text x="750" y="387" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Sonnet 5.5</text>
  <rect x="910" y="362" width="60" height="36" rx="4" fill="#b53b15"/>
  <text x="984" y="387" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#b53b15">$7.20</text>

  <text x="750" y="467" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Opus 5.5</text>
  <rect x="910" y="442" width="120" height="36" rx="4" fill="#15130f"/>
  <text x="1044" y="467" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#15130f">$14.40</text>

  <text x="750" y="547" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Fable 5.1</text>
  <rect x="910" y="522" width="300" height="36" rx="4" fill="#15130f"/>
  <text x="1224" y="547" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" fill="#15130f">$36.00</text>

  <line x1="750" y1="592" x2="1310" y2="592" stroke="#e4dfd6" stroke-width="1"/>
  <text x="750" y="630" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Same ratios, now in dollars</text>

  <text x="60" y="712" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Calculated, not measured: 1.8 tokens per word on Fable, Opus and Sonnet; 1.33 on Haiku 4.5</text>
</svg>
