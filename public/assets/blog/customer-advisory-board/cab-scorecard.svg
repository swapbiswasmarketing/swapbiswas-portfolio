<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" width="1400" height="1090">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="1090" rx="24" fill="url(#bg)"/>

  <text x="700" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc">The CAB Scorecard</text>
  <text x="700" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="24" fill="#9ca3af">Four leading numbers read inside one cycle. Three lagging ones that survive a budget review.</text>

  <!-- Section 1 header -->
  <text x="90" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#5eead4" letter-spacing="0.08em">LEADING - READ INSIDE ONE CYCLE</text>
  <text x="940" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">HEALTHY READ</text>

  <!-- Row 1 -->
  <rect x="70" y="182" width="1260" height="96" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="106" cy="230" r="7" fill="#5eead4"/>
  <text x="136" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Seat fill rate</text>
  <text x="136" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9ca3af">Confirmed attendees over invited members, logged every session</text>
  <text x="940" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">75% or higher, every session</text>

  <!-- Row 2 -->
  <rect x="70" y="292" width="1260" height="96" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="106" cy="340" r="7" fill="#60a5fa"/>
  <text x="136" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Member-sourced agenda share</text>
  <text x="136" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9ca3af">Agenda minutes traced back to member pre-interviews</text>
  <text x="940" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Half the agenda or more</text>

  <!-- Row 3 -->
  <rect x="70" y="402" width="1260" height="96" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="106" cy="450" r="7" fill="#c084fc"/>
  <text x="136" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Roadmap items traceable to the board</text>
  <text x="136" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9ca3af">Tag CAB-origin tickets in the roadmap tool at intake</text>
  <text x="940" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Two or more shipped per cycle</text>

  <!-- Row 4 -->
  <rect x="70" y="512" width="1260" height="96" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="106" cy="560" r="7" fill="#fb923c"/>
  <text x="136" y="552" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Median time to close the loop</text>
  <text x="136" y="586" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9ca3af">Days from a member's ask to a written answer sent back</text>
  <text x="940" y="568" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Under 30 days, median</text>

  <!-- Section 2 header -->
  <text x="90" y="658" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f5a0a1" letter-spacing="0.08em">LAGGING - SURVIVES A BUDGET REVIEW</text>
  <text x="940" y="658" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">HEALTHY READ</text>

  <!-- Row 5 -->
  <rect x="70" y="678" width="1260" height="96" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="106" cy="726" r="7" fill="#f5a0a1"/>
  <text x="136" y="718" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Member NRR against a matched cohort</text>
  <text x="136" y="752" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9ca3af">Members versus non-members matched on ARR band and tenure</text>
  <text x="940" y="734" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Positive gap, two cycles running</text>

  <!-- Row 6 -->
  <rect x="70" y="788" width="1260" height="96" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="106" cy="836" r="7" fill="#d98ee0"/>
  <text x="136" y="828" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">References and stories sourced</text>
  <text x="136" y="862" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9ca3af">Case studies, reviews and reference calls credited to members</text>
  <text x="940" y="844" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">One per member per year</text>

  <!-- Row 7 -->
  <rect x="70" y="898" width="1260" height="96" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="106" cy="946" r="7" fill="#b388f2"/>
  <text x="136" y="938" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Competitive intel surfaced</text>
  <text x="136" y="972" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9ca3af">Named displacement threats logged and routed to battlecards</text>
  <text x="940" y="954" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#c8cfd8">Logged, dated, and assigned</text>

  <text x="700" y="1046" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#9ca3af">Leading numbers tell you the board is alive. Lagging numbers tell finance it paid for itself.</text>
</svg>
