<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880">
  <rect x="0" y="0" width="1400" height="880" fill="#f6f4ef"/>

  <text x="40" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">One Claude Code SEO audit, four layers</text>
  <text x="40" y="110" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">swapbiswas.com on 30 September 2026: what each layer read, and the count it returned</text>

  <rect x="40" y="150" width="400" height="420" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="72" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.92" fill="#6a645c">01  SOURCE</text>
  <text x="72" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">170 Markdown files</text>
  <text x="72" y="270" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Titles, descriptions, links,</text>
  <text x="72" y="302" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">alt text, image attributes</text>
  <line x1="72" y1="328" x2="408" y2="328" stroke="#e4dfd6" stroke-width="1"/>
  <text x="72" y="398" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="60" font-weight="600" fill="#15130f">29</text>
  <text x="72" y="438" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">internal links without the</text>
  <text x="72" y="470" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">trailing slash, in 6 posts,</text>
  <text x="72" y="502" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">each answered with a 308</text>
  <text x="72" y="546" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.92" fill="#6a645c">8 CHECKS</text>

  <line x1="446" y1="360" x2="480" y2="360" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="480,353 494,360 480,367" fill="#15130f"/>

  <rect x="500" y="150" width="400" height="420" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="532" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.92" fill="#6a645c">02  BUILD</text>
  <text x="532" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">The dist/ folder</text>
  <text x="532" y="270" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Sitemap, canonicals, H1s,</text>
  <text x="532" y="302" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">images, JSON-LD, lastmod</text>
  <line x1="532" y1="328" x2="868" y2="328" stroke="#e4dfd6" stroke-width="1"/>
  <text x="532" y="398" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="60" font-weight="600" fill="#b53b15">0</text>
  <text x="532" y="438" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">of 1,046 images ship without</text>
  <text x="532" y="470" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">width and height; the source</text>
  <text x="532" y="502" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">check had flagged 142</text>
  <text x="532" y="546" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.92" fill="#6a645c">6 CHECKS</text>

  <line x1="906" y1="360" x2="940" y2="360" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="940,353 954,360 940,367" fill="#15130f"/>

  <rect x="960" y="150" width="400" height="420" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="992" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.92" fill="#6a645c">03  LIVE SITE</text>
  <text x="992" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Production, via curl</text>
  <text x="992" y="270" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Redirects, exported URLs,</text>
  <text x="992" y="302" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">the blog index order</text>
  <line x1="992" y1="328" x2="1328" y2="328" stroke="#e4dfd6" stroke-width="1"/>
  <text x="992" y="398" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="60" font-weight="600" fill="#15130f">8</text>
  <text x="992" y="438" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">URLs that earned impressions</text>
  <text x="992" y="470" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">now return 404, all from</text>
  <text x="992" y="502" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">the old WordPress site</text>
  <text x="992" y="546" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.92" fill="#6a645c">3 CHECKS</text>

  <line x1="1160" y1="570" x2="1160" y2="602" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1161.25" y1="602" x2="700" y2="602" stroke="#15130f" stroke-width="2.5"/>
  <line x1="700" y1="600.75" x2="700" y2="618" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="693,618 707,618 700,632" fill="#15130f"/>

  <rect x="40" y="636" width="1320" height="194" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="72" y="676" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.92" fill="#6a645c">04  SEARCH CONSOLE JOIN</text>
  <text x="72" y="714" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">157 URLs with impressions, May 2025 to August 2026, matched to each finding</text>
  <line x1="72" y1="738" x2="1328" y2="738" stroke="#e4dfd6" stroke-width="1"/>
  <text x="72" y="776" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">227 impressions sat on</text>
  <text x="72" y="806" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">the 8 URLs that now 404</text>
  <text x="512" y="776" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">16,629 sat on the 11 posts</text>
  <text x="512" y="806" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">the slashless links point to</text>
  <text x="952" y="776" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">90% of post impressions sat on</text>
  <text x="952" y="806" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">pages the image check misread</text>
</svg>
