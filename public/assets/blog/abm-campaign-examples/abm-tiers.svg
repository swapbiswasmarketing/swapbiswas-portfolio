<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="700" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">The Three Tiers of ABM</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="22">Effort per account decreases and account count grows as you move across the tiers</text>

  <!-- TIER 1: One-to-One -->
  <rect x="40" y="140" width="410" height="500" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="40" y="140" width="410" height="6" rx="3" fill="#f5a0a1"/>
  <text x="70" y="190" fill="#f5a0a1" font-size="21" font-weight="700" letter-spacing="0.08em">TIER 1</text>
  <text x="70" y="234" fill="#f0f6fc" font-size="30" font-weight="600">One-to-One</text>
  <text x="70" y="272" fill="#9ca3af" font-size="19">5-20 strategic accounts</text>
  <text x="70" y="296" fill="#9ca3af" font-size="19">deep, custom effort</text>
  <text x="70" y="346" fill="#f5a0a1" font-size="17" font-weight="700" letter-spacing="0.06em">EXAMPLE PLAYS</text>
  <text x="70" y="388" fill="#c8cfd8" font-size="22">Exec-sponsored account plan</text>
  <text x="70" y="434" fill="#c8cfd8" font-size="22">Champion-changed-jobs play</text>
  <text x="70" y="602" fill="#9ca3af" font-size="19">Deepest effort, fewest accounts</text>

  <!-- TIER 2: One-to-Few -->
  <rect x="495" y="140" width="410" height="500" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="495" y="140" width="410" height="6" rx="3" fill="#c084fc"/>
  <text x="525" y="190" fill="#c084fc" font-size="21" font-weight="700" letter-spacing="0.08em">TIER 2</text>
  <text x="525" y="234" fill="#f0f6fc" font-size="30" font-weight="600">One-to-Few</text>
  <text x="525" y="272" fill="#9ca3af" font-size="19">10-50 similar accounts</text>
  <text x="525" y="296" fill="#9ca3af" font-size="19">light personalization</text>
  <text x="525" y="346" fill="#c084fc" font-size="17" font-weight="700" letter-spacing="0.06em">EXAMPLE PLAYS</text>
  <text x="525" y="388" fill="#c8cfd8" font-size="22">Industry vertical play</text>
  <text x="525" y="434" fill="#c8cfd8" font-size="22">Competitor displacement</text>
  <text x="525" y="480" fill="#c8cfd8" font-size="22">Use-case cluster</text>
  <text x="525" y="602" fill="#9ca3af" font-size="19">Cluster-level relevance</text>

  <!-- TIER 3: One-to-Many -->
  <rect x="950" y="140" width="410" height="500" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="950" y="140" width="410" height="6" rx="3" fill="#60a5fa"/>
  <text x="980" y="190" fill="#60a5fa" font-size="21" font-weight="700" letter-spacing="0.08em">TIER 3</text>
  <text x="980" y="234" fill="#f0f6fc" font-size="30" font-weight="600">One-to-Many</text>
  <text x="980" y="272" fill="#9ca3af" font-size="19">Hundreds of accounts</text>
  <text x="980" y="296" fill="#9ca3af" font-size="19">programmatic, intent-driven</text>
  <text x="980" y="346" fill="#60a5fa" font-size="17" font-weight="700" letter-spacing="0.06em">EXAMPLE PLAYS</text>
  <text x="980" y="388" fill="#c8cfd8" font-size="22">Intent-surge play</text>
  <text x="980" y="434" fill="#c8cfd8" font-size="22">Product-signal play</text>
  <text x="980" y="480" fill="#c8cfd8" font-size="22">Retargeting + nurture</text>
  <text x="980" y="602" fill="#9ca3af" font-size="19">Widest reach, intent-driven</text>

  <text x="700" y="702" text-anchor="middle" fill="#9ca3af" font-size="21">Run all three at once and promote accounts up the tiers as intent rises</text>
</svg>
