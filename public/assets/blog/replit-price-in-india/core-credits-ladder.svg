<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650">
  <rect x="0" y="0" width="1400" height="650" fill="#f6f4ef"/>
  <text x="60" y="74" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" fill="#15130f" letter-spacing="-0.76">What a Replit Core plan draws on, from free to billed</text>
  <text x="60" y="114" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="400" fill="#6a645c">Steps 1 and 2 come with the plan price. Steps 3 and 4 are billed on top. Replit docs, read 10 October 2026.</text>
  <rect x="60" y="150" width="280" height="300" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="84" y="194" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c" letter-spacing="2">STEP 1</text>
  <text x="84" y="236" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Free Mode</text>
  <text x="84" y="290" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">Agent work only, at</text>
  <text x="84" y="324" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">no cost within an</text>
  <text x="84" y="358" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">allowance that resets</text>
  <text x="84" y="392" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">every five hours, with</text>
  <text x="84" y="426" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">weekly limits</text>
  <line x1="348" y1="300" x2="373.3" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="371.3,293 385.3,300 371.3,307" fill="#15130f"/>
  <rect x="393.3" y="150" width="280" height="300" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="417.3" y="194" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c" letter-spacing="2">STEP 2</text>
  <text x="417.3" y="236" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">$20 of credits</text>
  <text x="417.3" y="290" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">Power and Max modes,</text>
  <text x="417.3" y="324" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">publishing, databases</text>
  <text x="417.3" y="358" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">and AI integrations;</text>
  <text x="417.3" y="392" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">no rollover on Core</text>
  <line x1="681.3" y1="300" x2="706.7" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="704.7,293 718.7,300 704.7,307" fill="#15130f"/>
  <rect x="726.7" y="150" width="280" height="300" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="750.7" y="194" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#6a645c" letter-spacing="2">STEP 3</text>
  <text x="750.7" y="236" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Credit packs</text>
  <text x="750.7" y="290" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">Optional: $100 to</text>
  <text x="750.7" y="324" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">$1,000 of credits,</text>
  <text x="750.7" y="358" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">up to $50 off; they</text>
  <text x="750.7" y="392" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">expire in six months</text>
  <line x1="1014.7" y1="300" x2="1040" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="1038,293 1052,300 1038,307" fill="#15130f"/>
  <rect x="1060" y="150" width="280" height="300" rx="12" fill="#ffffff" stroke="#b53b15" stroke-width="2.5"/>
  <text x="1084" y="194" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#b53b15" letter-spacing="2">STEP 4</text>
  <text x="1084" y="236" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#b53b15">Pay-as-you-go</text>
  <text x="1084" y="290" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">Billed at each</text>
  <text x="1084" y="324" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">threshold, priced by</text>
  <text x="1084" y="358" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">effort, up to the</text>
  <text x="1084" y="392" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">usage limit you set</text>
  <line x1="60" y1="484" x2="673.3" y2="484" stroke="#15130f" stroke-width="2.5"/>
  <line x1="60" y1="472" x2="60" y2="484" stroke="#15130f" stroke-width="2.5"/>
  <line x1="673.3" y1="472" x2="673.3" y2="484" stroke="#15130f" stroke-width="2.5"/>
  <text x="366.7" y="520" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#15130f" text-anchor="middle">Included in the Core price</text>
  <line x1="726.7" y1="484" x2="1340" y2="484" stroke="#15130f" stroke-width="2.5"/>
  <line x1="726.7" y1="472" x2="726.7" y2="484" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1340" y1="472" x2="1340" y2="484" stroke="#15130f" stroke-width="2.5"/>
  <text x="1033.3" y="520" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#15130f" text-anchor="middle">Billed on top of the Core price</text>
  <text x="60" y="600" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="400" fill="#6a645c">Sources: replit.com/pricing FAQ; Replit docs: Pricing and plans, Free Mode help, Managing your spend, Billing and refunds.</text>
</svg>
