<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="700" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">The Messaging House</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="22">Positioning is the roof. Pillars hold it up. Proof holds up the pillars.</text>

  <!-- Roof: positioning statement -->
  <polygon points="700,140 1150,248 250,248" fill="#151b23" stroke="#5eead4" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="700" y="228" text-anchor="middle" fill="#5eead4" font-size="22" font-weight="700" letter-spacing="0.06em">POSITIONING STATEMENT</text>

  <!-- Pillar 1 -->
  <rect x="290" y="278" width="250" height="272" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="290" y="278" width="250" height="6" rx="3" fill="#f5a0a1"/>
  <text x="316" y="322" fill="#f5a0a1" font-size="21" font-weight="700">Kill the status</text>
  <text x="316" y="348" fill="#f5a0a1" font-size="21" font-weight="700">meeting</text>
  <text x="316" y="396" fill="#f5a0a1" font-size="15" font-weight="700" letter-spacing="0.06em">PROOF</text>
  <text x="316" y="428" fill="#9ca3af" font-size="18">Automated PR rollups</text>
  <text x="316" y="460" fill="#9ca3af" font-size="18">Daily digest</text>
  <text x="316" y="492" fill="#9ca3af" font-size="18">Customer proof</text>

  <!-- Pillar 2 -->
  <rect x="575" y="278" width="250" height="272" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="575" y="278" width="250" height="6" rx="3" fill="#c084fc"/>
  <text x="601" y="322" fill="#c084fc" font-size="21" font-weight="700">Onboard in an</text>
  <text x="601" y="348" fill="#c084fc" font-size="21" font-weight="700">afternoon</text>
  <text x="601" y="396" fill="#c084fc" font-size="15" font-weight="700" letter-spacing="0.06em">PROOF</text>
  <text x="601" y="428" fill="#9ca3af" font-size="18">Two-way tool sync</text>
  <text x="601" y="460" fill="#9ca3af" font-size="18">Auto-import projects</text>
  <text x="601" y="492" fill="#9ca3af" font-size="18">Workflow templates</text>

  <!-- Pillar 3 -->
  <rect x="860" y="278" width="250" height="272" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="860" y="278" width="250" height="6" rx="3" fill="#60a5fa"/>
  <text x="886" y="322" fill="#60a5fa" font-size="21" font-weight="700">Scale without</text>
  <text x="886" y="348" fill="#60a5fa" font-size="21" font-weight="700">new process</text>
  <text x="886" y="396" fill="#60a5fa" font-size="15" font-weight="700" letter-spacing="0.06em">PROOF</text>
  <text x="886" y="428" fill="#9ca3af" font-size="18">Leadership dashboards</text>
  <text x="886" y="460" fill="#9ca3af" font-size="18">Deep integrations</text>
  <text x="886" y="492" fill="#9ca3af" font-size="18">Usage benchmarks</text>

  <!-- Foundation -->
  <rect x="250" y="580" width="900" height="86" rx="14" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="250" y="580" width="8" height="86" rx="4" fill="#5eead4"/>
  <text x="286" y="620" fill="#5eead4" font-size="20" font-weight="700" letter-spacing="0.08em">PROOF POINTS</text>
  <text x="286" y="650" fill="#c8cfd8" font-size="20">Customer results · specific capabilities · third-party validation</text>

  <text x="700" y="712" text-anchor="middle" fill="#9ca3af" font-size="21">Three or four outcome-led pillars, each provable, carrying one positioning statement</text>
</svg>
