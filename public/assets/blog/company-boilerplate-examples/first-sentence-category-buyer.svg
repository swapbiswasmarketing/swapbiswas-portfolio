<text x="60" y="752" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Category: a product type tied to a job, or a field narrow enough to name the product.</text>
<text x="60" y="782" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Buyer: a named customer group, team or department, or a "for [market]" phrase.</text>
<text x="60" y="812" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Sector labels and generic words (organizations, customers) do not count. swapbiswas.com</text>
