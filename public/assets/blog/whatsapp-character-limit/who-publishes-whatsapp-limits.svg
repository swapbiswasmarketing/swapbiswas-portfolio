    <text x="650" y="508" font-size="26" font-weight="600" text-anchor="end" fill="#15130f">1,024</text>
    <line x1="90" y1="545" x2="650" y2="545" stroke="#e4dfd6" stroke-width="1"/>

    <text x="90" y="577" font-size="20" fill="#15130f">Group subject (Groups API)</text>
