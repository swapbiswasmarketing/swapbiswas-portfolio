    <text x="650" y="348" font-size="26" font-weight="600" text-anchor="end" fill="#15130f">512</text>
    <line x1="90" y1="385" x2="650" y2="385" stroke="#e4dfd6" stroke-width="1"/>

    <text x="90" y="417" font-size="20" fill="#15130f">Text message body (API)</text>
