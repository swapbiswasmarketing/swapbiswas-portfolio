    <text x="650" y="428" font-size="26" font-weight="600" text-anchor="end" fill="#15130f">4,096</text>
    <line x1="90" y1="465" x2="650" y2="465" stroke="#e4dfd6" stroke-width="1"/>

    <text x="90" y="497" font-size="20" fill="#15130f">Image or video caption (API)</text>
