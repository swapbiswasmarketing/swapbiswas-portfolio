<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <rect x="0" y="0" width="1400" height="820" fill="#f6f4ef"/>
  <text x="60" y="72" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Who publishes each WhatsApp character limit</text>
  <text x="60" y="110" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Checked 5 November 2026. Meta's figures are WhatsApp Business Platform (Cloud API) limits.</text>

