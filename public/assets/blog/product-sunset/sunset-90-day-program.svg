<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 845" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="845" fill="url(#bg)" rx="24"/>

  <text x="40" y="64" fill="#f0f6fc" font-size="42" font-weight="700">The 90-Day Product Sunset Program</text>
  <text x="40" y="104" fill="#9ca3af" font-size="24">Six phases, one named owner each, from locked plan to shutdown</text>

  <!-- Row 1 -->
  <rect x="40" y="150" width="620" height="165" rx="16" fill="#151b23" stroke="#30363d" filter="url(#cardShadow)"/>
  <rect x="62" y="182" width="6" height="100" rx="3" fill="#f5a0a1"/>
  <text x="86" y="198" fill="#f0f6fc" font-size="26" font-weight="600">Days -30 to -1: Lock the plan</text>
  <text x="86" y="238" fill="#f5a0a1" font-size="21" font-weight="600">Owner: PMM + Legal</text>
  <text x="86" y="274" fill="#c8cfd8" font-size="21">Contracts read, notice set per tier</text>

  <rect x="740" y="150" width="620" height="165" rx="16" fill="#151b23" stroke="#30363d" filter="url(#cardShadow)"/>
  <rect x="762" y="182" width="6" height="100" rx="3" fill="#fb923c"/>
  <text x="786" y="198" fill="#f0f6fc" font-size="26" font-weight="600">Day 0: Announce everywhere</text>
  <text x="786" y="238" fill="#fb923c" font-size="21" font-weight="600">Owner: PMM</text>
  <text x="786" y="274" fill="#c8cfd8" font-size="21">Email, in-app, docs, status page</text>

  <line x1="670" y1="232" x2="724" y2="232" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="724,225 738,232 724,239" fill="#5eead4"/>

  <!-- Row 1 to Row 2 transition -->
  <line x1="1050" y1="315" x2="1050" y2="350" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1050" y1="350" x2="350" y2="350" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="350" y1="350" x2="350" y2="371" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="343,371 357,371 350,385" fill="#5eead4"/>

  <!-- Row 2 -->
  <rect x="40" y="385" width="620" height="165" rx="16" fill="#151b23" stroke="#30363d" filter="url(#cardShadow)"/>
  <rect x="62" y="417" width="6" height="100" rx="3" fill="#60a5fa"/>
  <text x="86" y="433" fill="#f0f6fc" font-size="26" font-weight="600">Days 1-14: Personal outreach</text>
  <text x="86" y="473" fill="#60a5fa" font-size="21" font-weight="600">Owner: CSM + AE</text>
  <text x="86" y="509" fill="#c8cfd8" font-size="21">Top-ARR accounts get a human call</text>

  <rect x="740" y="385" width="620" height="165" rx="16" fill="#151b23" stroke="#30363d" filter="url(#cardShadow)"/>
  <rect x="762" y="417" width="6" height="100" rx="3" fill="#c084fc"/>
  <text x="786" y="433" fill="#f0f6fc" font-size="26" font-weight="600">Days 15-60: Migration push</text>
  <text x="786" y="473" fill="#c084fc" font-size="21" font-weight="600">Owner: PMM + Support</text>
  <text x="786" y="509" fill="#c8cfd8" font-size="21">Weekly cohort targets, office hours</text>

  <line x1="670" y1="467" x2="724" y2="467" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="724,460 738,467 724,474" fill="#5eead4"/>

  <!-- Row 2 to Row 3 transition -->
  <line x1="1050" y1="550" x2="1050" y2="585" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="1050" y1="585" x2="350" y2="585" stroke="#5eead4" stroke-width="2.5"/>
  <line x1="350" y1="585" x2="350" y2="606" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="343,606 357,606 350,620" fill="#5eead4"/>

  <!-- Row 3 -->
  <rect x="40" y="620" width="620" height="165" rx="16" fill="#151b23" stroke="#30363d" filter="url(#cardShadow)"/>
  <rect x="62" y="652" width="6" height="100" rx="3" fill="#b388f2"/>
  <text x="86" y="668" fill="#f0f6fc" font-size="26" font-weight="600">Days 61-85: Last-call sequence</text>
  <text x="86" y="708" fill="#b388f2" font-size="21" font-weight="600">Owner: Lifecycle marketing</text>
  <text x="86" y="744" fill="#c8cfd8" font-size="21">Three reminders to non-migrated</text>

  <rect x="740" y="620" width="620" height="165" rx="16" fill="#151b23" stroke="#5eead4" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="762" y="652" width="6" height="100" rx="3" fill="#5eead4"/>
  <text x="786" y="668" fill="#f0f6fc" font-size="26" font-weight="600">Day 90: Shutdown + data window</text>
  <text x="786" y="708" fill="#5eead4" font-size="21" font-weight="600">Owner: Engineering + PMM</text>
  <text x="786" y="744" fill="#c8cfd8" font-size="21">Read-only, then 30-day export</text>

  <line x1="670" y1="702" x2="724" y2="702" stroke="#5eead4" stroke-width="2.5"/>
  <polygon points="724,695 738,702 724,709" fill="#5eead4"/>
</svg>
