<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <rect x="0" y="0" width="1400" height="780" fill="#f6f4ef"/>

  <text x="60" y="62" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" fill="#15130f" letter-spacing="-0.02em">Scoring One Message Across Two Audiences</text>
  <text x="60" y="102" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Weighted composite per cell, then the split check before anything is published</text>

  <rect x="60" y="140" width="300" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="84" y="182" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Clarity</text>
  <text x="84" y="214" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">3 items, weight 0.35</text>

  <rect x="386" y="140" width="300" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="410" y="182" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Relevance</text>
  <text x="410" y="214" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">3 items, weight 0.25</text>

  <rect x="712" y="140" width="300" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="736" y="182" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Differentiation</text>
  <text x="736" y="214" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">3 items, weight 0.25</text>

  <rect x="1038" y="140" width="300" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1062" y="182" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Believability</text>
  <text x="1062" y="214" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#6a645c">3 items, weight 0.15</text>

  <text x="60" y="288" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="19" font-weight="500" fill="#6a645c">Every cell scores all four axes on the same 12 five-point items</text>

  <rect x="60" y="330" width="290" height="140" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="84" y="374" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Variant A</text>
  <text x="84" y="406" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">Headline plus one</text>
  <text x="84" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" fill="#3a3632">proof line, unbranded</text>

  <line x1="350" y1="400" x2="395" y2="400" stroke="#15130f" stroke-width="2.5"/>
  <line x1="395" y1="350" x2="395" y2="450" stroke="#15130f" stroke-width="2.5"/>
  <line x1="395" y1="350" x2="430" y2="350" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="430,343 444,350 430,357" fill="#15130f"/>
  <line x1="395" y1="450" x2="430" y2="450" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="430,443 444,450 430,457" fill="#15130f"/>

  <rect x="445" y="310" width="360" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="469" y="347" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Economic buyer</text>
  <text x="469" y="374" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#6a645c">n = 20</text>

  <rect x="445" y="410" width="360" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="469" y="447" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#15130f">Technical evaluator</text>
  <text x="469" y="474" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#6a645c">n = 20</text>

  <line x1="805" y1="350" x2="865" y2="350" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="865,343 879,350 865,357" fill="#15130f"/>
  <line x1="805" y1="450" x2="865" y2="450" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="865,443 879,450 865,457" fill="#15130f"/>

  <rect x="880" y="310" width="460" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="904" y="347" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Composite 3.81 / 5</text>
  <text x="904" y="374" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Clarity 4.2, Differentiation 3.2</text>

  <rect x="880" y="410" width="460" height="80" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="904" y="447" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Composite 2.47 / 5</text>
  <text x="904" y="474" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Clarity 3.0, Differentiation 1.9</text>

  <rect x="60" y="550" width="1280" height="170" rx="12" fill="#f3dcd2" stroke="#b53b15" stroke-width="2"/>
  <text x="88" y="592" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#b53b15" letter-spacing="0.12em">SPLIT CHECK</text>
  <text x="88" y="634" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Buyer 3.81 minus evaluator 2.47 is a 1.34 gap</text>
  <text x="88" y="670" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Past the 0.62 that 20 per cell can resolve, so the pooled 3.14 is not publishable</text>
  <text x="88" y="700" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Report both cells; variant A is already out on the floor rule, evaluator differentiation 1.9</text>
</svg>
