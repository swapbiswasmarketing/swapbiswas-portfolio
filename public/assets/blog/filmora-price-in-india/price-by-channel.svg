<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920">
  <rect x="0" y="0" width="1400" height="920" fill="#f6f4ef"/>
  <text x="60" y="72" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Filmora price in India by where you buy</text>
  <text x="60" y="112" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Listed prices on 4 November 2026. Stores differ in the version they name, tax line and refund route.</text>

  <rect x="60" y="140" width="625" height="340" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">APPLE APP STORE, INDIA</text>
  <text x="90" y="226" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#15130f">Mac app: Rs 4,999 a year</text>
  <text x="90" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Basic Annual Plan Rs 4,999, Lifetime License Rs 7,900</text>
  <text x="90" y="308" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">iPhone app: Filmora Pro (1 Year) Rs 4,999</text>
  <text x="90" y="344" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Mac listing version: 15.0.14, dated 18 Dec 2025</text>
  <line x1="90" y1="380" x2="655" y2="380" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="416" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Tax: included, per Apple</text>
  <text x="90" y="450" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Refunds: through Apple</text>

  <rect x="715" y="140" width="625" height="340" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="745" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">TECHJOCKEY, RESELLER</text>
  <text x="745" y="226" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#15130f">Perpetual: Rs 3,800 before tax</text>
  <text x="745" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Starting price Rs 4,484 incl. GST</text>
  <text x="745" y="308" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Advanced Annual Plan: starting at Rs 2,570</text>
  <text x="745" y="344" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Page text still names Filmora 15</text>
  <line x1="745" y1="380" x2="1310" y2="380" stroke="#e4dfd6" stroke-width="1"/>
  <text x="745" y="416" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Tax: shown both ways, GST invoice offered</text>
  <text x="745" y="450" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Refunds: through the reseller</text>

  <rect x="60" y="510" width="625" height="340" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="552" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">FLIPKART, THIRD-PARTY SELLER</text>
  <text x="90" y="596" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#b53b15">Rs 854 for a 1-year Windows key</text>
  <text x="90" y="642" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Filmora 15, activation details only</text>
  <text x="90" y="678" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Listing: no premium creative assets</text>
  <text x="90" y="714" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Struck-through price Rs 2,999</text>
  <line x1="90" y1="750" x2="655" y2="750" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="786" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Listing says: No Refund Policy, no returns</text>
  <text x="90" y="820" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Wondershare: refunds through the seller</text>

  <rect x="715" y="510" width="625" height="340" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="745" y="552" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">WONDERSHARE STORE</text>
  <text x="745" y="596" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#15130f">No rupee price on the page I read</text>
  <text x="745" y="642" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Plans: Basic, Advanced, Perpetual</text>
  <text x="745" y="678" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Perpetual: Filmora 16 updates only</text>
  <text x="745" y="714" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">It showed US dollars, not India prices</text>
  <line x1="745" y1="750" x2="1310" y2="750" stroke="#e4dfd6" stroke-width="1"/>
  <text x="745" y="786" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Page offers a switch to regional currency</text>
  <text x="745" y="820" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Refunds: up to 30 days, most direct orders</text>
</svg>
