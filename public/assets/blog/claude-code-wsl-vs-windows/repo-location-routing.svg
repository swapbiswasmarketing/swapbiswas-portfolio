<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830">
<rect width="1400" height="830" fill="#f6f4ef"/>
<text x="60" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Run Claude Code in the filesystem where the repo lives</text>
<text x="60" y="110" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">Claude Code on Windows, as of September 2026: direct paths vs cross-filesystem paths</text>
<text x="60" y="164" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">WINDOWS FILESYSTEM (C:)</text>
<text x="900" y="164" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">WSL 2 LINUX FILESYSTEM</text>
<rect x="60" y="180" width="440" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
<text x="90" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Claude Code, native</text>
<text x="90" y="268" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Shell: PowerShell or Git Bash</text>
<rect x="900" y="180" width="440" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
<text x="930" y="230" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Repo in /home/you/site</text>
<text x="930" y="268" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Cloned inside the distribution</text>
<line x1="500" y1="240" x2="886" y2="240" stroke="#6a645c" stroke-width="2.5" stroke-dasharray="10 8"/>
<polygon points="886,233 900,240 886,247" fill="#6a645c"/>
<text x="700" y="222" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#6a645c">Through \\wsl.localhost</text>
<text x="700" y="270" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Slow, breaks file watching</text>
<line x1="280" y1="300" x2="280" y2="416" stroke="#b53b15" stroke-width="3"/>
<polygon points="273,416 280,430 287,416" fill="#b53b15"/>
<text x="300" y="372" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="500" fill="#15130f">Direct access</text>
<line x1="1120" y1="430" x2="1120" y2="314" stroke="#15130f" stroke-width="2.5"/>
<polygon points="1113,314 1120,300 1127,314" fill="#15130f"/>
<text x="1140" y="372" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="500" fill="#15130f">Direct access</text>
<rect x="60" y="430" width="440" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
<text x="90" y="480" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Repo in C:\Users\you\site</text>
<text x="90" y="518" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Opened by Windows apps and tools</text>
<rect x="900" y="430" width="440" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
<text x="930" y="480" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Claude Code in WSL 2</text>
<text x="930" y="518" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Shell: bash; sandbox supported</text>
<line x1="900" y1="490" x2="514" y2="490" stroke="#6a645c" stroke-width="2.5" stroke-dasharray="10 8"/>
<polygon points="514,483 500,490 514,497" fill="#6a645c"/>
<text x="700" y="472" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#6a645c">Through /mnt/c</text>
<text x="700" y="520" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Slower reads, fewer search matches</text>
<rect x="60" y="600" width="1280" height="124" rx="12" fill="#eeebe4" stroke="#e4dfd6" stroke-width="1"/>
<text x="90" y="638" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="1.9" fill="#6a645c">ON A MANAGED WORK LAPTOP</text>
<text x="90" y="676" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">IT can switch WSL off for every user, and installing it needs an administrator PowerShell.</text>
<text x="90" y="708" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Claude Desktop also turns WSL sessions off by default on devices it detects as managed.</text>
<text x="60" y="780" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Sources: Claude Code docs (Desktop in WSL, troubleshooting, admin setup) and Microsoft Learn, 30 September 2026</text>
</svg>
