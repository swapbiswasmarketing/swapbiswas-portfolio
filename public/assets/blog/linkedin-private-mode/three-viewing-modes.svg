<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" width="1400" height="750">
  <rect x="0" y="0" width="1400" height="750" fill="#f6f4ef"/>
  <text x="60" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">LinkedIn's three profile viewing modes</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">What the profile owner sees, and whether the viewer keeps their own viewer list</text>

  <rect x="60" y="140" width="400" height="510" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">MODE 1</text>
  <text x="90" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Your name and headline</text>
  <text x="90" y="300" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">THE OWNER SEES</text>
  <rect x="90" y="318" width="340" height="120" rx="8" fill="#eeebe4"/>
  <text x="110" y="366" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">Your name, headline,</text>
  <text x="110" y="398" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">location and industry</text>
  <text x="90" y="490" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">YOUR OWN VIEWER LIST</text>
  <text x="90" y="530" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Free: 3 most recent, 90 days</text>
  <text x="90" y="568" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Premium: full list, 365 days</text>

  <rect x="500" y="140" width="400" height="510" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="530" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">MODE 2 (SEMI-PRIVATE)</text>
  <text x="530" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Private profile</text>
  <text x="530" y="254" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">characteristics</text>
  <text x="530" y="300" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">THE OWNER SEES</text>
  <rect x="530" y="318" width="340" height="120" rx="8" fill="#eeebe4"/>
  <text x="550" y="362" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">"Someone at Accenture"</text>
  <text x="550" y="396" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">job title, company, school</text>
  <text x="550" y="426" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">or industry, no name</text>
  <text x="530" y="490" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">YOUR OWN VIEWER LIST</text>
  <text x="530" y="530" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Free: none</text>
  <text x="530" y="568" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Premium: list not stated;</text>
  <text x="530" y="600" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">a548046: insights need "public"</text>

  <rect x="940" y="140" width="400" height="510" rx="12" fill="#ffffff" stroke="#b53b15" stroke-width="2.5"/>
  <text x="970" y="182" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#b53b15">MODE 3</text>
  <text x="970" y="222" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Private mode</text>
  <text x="970" y="300" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">THE OWNER SEES</text>
  <rect x="970" y="318" width="340" height="120" rx="8" fill="#eeebe4"/>
  <text x="990" y="366" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">"LinkedIn Member"</text>
  <text x="990" y="398" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">nothing else is shared</text>
  <text x="970" y="490" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#6a645c">YOUR OWN VIEWER LIST</text>
  <text x="970" y="530" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Free: none</text>
  <text x="970" y="568" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Premium: kept, per a567226;</text>
  <text x="970" y="600" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">a548046: insights need "public"</text>

  <text x="60" y="702" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Source: LinkedIn Help answers a568195, a567226, a548046 and a568149, read logged out on 25 October 2026.</text>
</svg>
