<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="700" fill="url(#bg2)" rx="24"/>

  <text x="60" y="62" fill="#f0f6fc" font-size="42" font-weight="700">The Concession Ceiling on a Price Increase</text>
  <text x="60" y="104" fill="#9ca3af" font-size="24">Baseline: a $2M renewal book, a 12% list increase, $240K of gross uplift</text>

  <!-- Scenario A -->
  <rect x="60" y="140" width="390" height="330" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="88" y="185" fill="#5eead4" font-size="21" font-weight="700" letter-spacing="0.08em">SCENARIO A</text>
  <text x="88" y="228" fill="#f0f6fc" font-size="27" font-weight="600">Narrow concession</text>
  <text x="88" y="278" fill="#c8cfd8" font-size="21">10% of ARR discounted</text>
  <text x="88" y="310" fill="#c8cfd8" font-size="21">Half the increase waived</text>
  <text x="88" y="392" fill="#5eead4" font-size="46" font-weight="700">11.4%</text>
  <text x="88" y="428" fill="#9ca3af" font-size="21">realized uplift on the book</text>

  <!-- Scenario B -->
  <rect x="505" y="140" width="390" height="330" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="533" y="185" fill="#fb923c" font-size="21" font-weight="700" letter-spacing="0.08em">SCENARIO B</text>
  <text x="533" y="228" fill="#f0f6fc" font-size="27" font-weight="600">Wide concession</text>
  <text x="533" y="278" fill="#c8cfd8" font-size="21">30% of ARR discounted</text>
  <text x="533" y="310" fill="#c8cfd8" font-size="21">Half the increase waived</text>
  <text x="533" y="392" fill="#fb923c" font-size="46" font-weight="700">10.2%</text>
  <text x="533" y="428" fill="#9ca3af" font-size="21">realized uplift on the book</text>

  <!-- Scenario C -->
  <rect x="950" y="140" width="390" height="330" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="978" y="185" fill="#f5a0a1" font-size="21" font-weight="700" letter-spacing="0.08em">SCENARIO C</text>
  <text x="978" y="228" fill="#f0f6fc" font-size="27" font-weight="600">Full deferral</text>
  <text x="978" y="278" fill="#c8cfd8" font-size="21">30% of ARR held flat</text>
  <text x="978" y="310" fill="#c8cfd8" font-size="21">Increase fully waived</text>
  <text x="978" y="392" fill="#f5a0a1" font-size="46" font-weight="700">8.4%</text>
  <text x="978" y="428" fill="#9ca3af" font-size="21">realized uplift on the book</text>

  <!-- Footer rule -->
  <rect x="60" y="510" width="1280" height="140" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="92" y="556" fill="#c084fc" font-size="21" font-weight="700" letter-spacing="0.08em">THE RULE I USE</text>
  <text x="92" y="598" fill="#c8cfd8" font-size="22">Every point of realized uplift handed back at the save desk is permanent.</text>
  <text x="92" y="630" fill="#c8cfd8" font-size="22">Next year's increase compounds off the lower base. Set the ceiling with finance, not per rep.</text>
</svg>
