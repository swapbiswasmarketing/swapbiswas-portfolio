<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="sharedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="950" fill="url(#bg)" rx="24"/>

  <text x="700" y="66" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700">SEO vs AEO vs GEO: Where They Actually Differ</text>
  <text x="700" y="110" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="23">Most of the work is shared. The edges move; the foundation does not.</text>

  <!-- SHARED FOUNDATION, full width -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="150" width="1320" height="280" rx="16" fill="#1a1f26" stroke="#30363d" stroke-width="2"/>
    <rect x="40" y="150" width="1320" height="6" rx="3" fill="url(#sharedGrad)"/>
    <text x="700" y="200" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="0.08em">SHARED FOUNDATION</text>
    <text x="700" y="244" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">What All Three Depend On</text>
    <text x="76" y="296" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="22">&#8226; Quality content and primary sources</text>
    <text x="76" y="332" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="22">&#8226; E-E-A-T signals (author, trust, updates)</text>
    <text x="76" y="368" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="22">&#8226; Crawlability and clean indexing</text>
    <text x="730" y="296" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="22">&#8226; Topical depth and cluster structure</text>
    <text x="730" y="332" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="22">&#8226; H2-as-question, lead-with-answer format</text>
    <text x="730" y="368" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="22">&#8226; Internal linking and natural anchors</text>
    <text x="700" y="410" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700">Roughly 80% of the work, identical for all three</text>
  </g>

  <!-- SEO ONLY -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="460" width="420" height="310" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
    <rect x="40" y="460" width="420" height="6" rx="3" fill="#60a5fa"/>
    <text x="250" y="508" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="0.08em">SEO ONLY</text>
    <text x="250" y="550" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">What SEO Uniquely Adds</text>
    <text x="76" y="600" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Rank-position tracking</text>
    <text x="76" y="636" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; SERP feature operations</text>
    <text x="76" y="672" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Click-through rate</text>
    <text x="76" y="708" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Backlink campaigns</text>
    <text x="250" y="748" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="20" font-style="italic">the thin edge, not the base</text>
  </g>

  <!-- AEO ONLY -->
  <g filter="url(#cardShadow)">
    <rect x="490" y="460" width="420" height="310" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
    <rect x="490" y="460" width="420" height="6" rx="3" fill="#fb923c"/>
    <text x="700" y="508" text-anchor="middle" fill="#fb923c" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="0.08em">AEO ONLY</text>
    <text x="700" y="550" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">What AEO Adds On Top</text>
    <text x="526" y="600" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Citation tracking</text>
    <text x="526" y="636" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Passage-level tuning</text>
    <text x="526" y="672" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Zero-click adaptation</text>
    <text x="526" y="708" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Answer-completeness QA</text>
    <text x="700" y="748" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="20" font-style="italic">the thin edge, not the base</text>
  </g>

  <!-- GEO ONLY -->
  <g filter="url(#cardShadow)">
    <rect x="940" y="460" width="420" height="310" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/>
    <rect x="940" y="460" width="420" height="6" rx="3" fill="#c084fc"/>
    <text x="1150" y="508" text-anchor="middle" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="0.08em">GEO ONLY</text>
    <text x="1150" y="550" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">What GEO Adds On Top</text>
    <text x="976" y="600" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Generative engine citations</text>
    <text x="976" y="636" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Quotations and statistics</text>
    <text x="976" y="672" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Non-Google LLM surfaces</text>
    <text x="976" y="708" fill="#c8cfd8" font-family="Segoe UI, sans-serif" font-size="21">&#8226; Brand mention monitoring</text>
    <text x="1150" y="748" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="20" font-style="italic">the thin edge, not the base</text>
  </g>

  <!-- Footer quote bar -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="800" width="1280" height="130" rx="16" fill="#1a1f26" stroke="#30363d" stroke-width="2"/>
    <text x="700" y="843" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">"There are no additional requirements to appear in AI Overviews or AI Mode,</text>
    <text x="700" y="875" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">nor other special optimizations necessary."</text>
    <text x="700" y="912" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="20">Source: Google Search Central, AI Features and Your Website</text>
  </g>
</svg>
