<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>

  <text x="700" y="64" text-anchor="middle" fill="#f0f6fc" font-size="40" font-weight="700">How Product Reviews Feed AI Search Visibility</text>
  <text x="700" y="102" text-anchor="middle" fill="#9ca3af" font-size="24">Your reviews are the raw material AI reads before it decides what to say about you</text>

  <!-- Stage 1: Sources -->
  <rect x="40" y="170" width="380" height="430" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="40" y="170" width="380" height="6" rx="3" fill="#c084fc"/>
  <text x="70" y="220" fill="#c084fc" font-size="22" font-weight="700" letter-spacing="0.08em">SOURCE</text>
  <text x="70" y="262" fill="#f0f6fc" font-size="26" font-weight="600">Where reviews live</text>
  <circle cx="82" cy="316" r="5" fill="#c084fc"/><text x="104" y="323" fill="#c8cfd8" font-size="22">G2, Trustpilot, Capterra</text>
  <circle cx="82" cy="366" r="5" fill="#c084fc"/><text x="104" y="373" fill="#c8cfd8" font-size="22">Amazon and app stores</text>
  <circle cx="82" cy="416" r="5" fill="#c084fc"/><text x="104" y="423" fill="#c8cfd8" font-size="22">Reddit and forums</text>
  <circle cx="82" cy="466" r="5" fill="#c084fc"/><text x="104" y="473" fill="#c8cfd8" font-size="22">Your own product pages</text>
  <text x="70" y="558" fill="#9ca3af" font-size="20">Ratings, volume, recency</text>

  <!-- Arrow 1 -->
  <line x1="428" y1="385" x2="502" y2="385" stroke="#5eead4" stroke-width="3"/>
  <polygon points="498,377 514,385 498,393" fill="#5eead4"/>

  <!-- Stage 2: Process -->
  <rect x="510" y="170" width="380" height="430" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="510" y="170" width="380" height="6" rx="3" fill="#60a5fa"/>
  <text x="540" y="220" fill="#60a5fa" font-size="22" font-weight="700" letter-spacing="0.08em">PROCESS</text>
  <text x="540" y="262" fill="#f0f6fc" font-size="26" font-weight="600">How AI ingests them</text>
  <circle cx="552" cy="316" r="5" fill="#60a5fa"/><text x="574" y="323" fill="#c8cfd8" font-size="22">Crawled and indexed</text>
  <circle cx="552" cy="366" r="5" fill="#60a5fa"/><text x="574" y="373" fill="#c8cfd8" font-size="22">Retrieved at query time</text>
  <circle cx="552" cy="416" r="5" fill="#60a5fa"/><text x="574" y="423" fill="#c8cfd8" font-size="22">Weighted by rating/volume</text>
  <circle cx="552" cy="466" r="5" fill="#60a5fa"/><text x="574" y="473" fill="#c8cfd8" font-size="22">Freshness is rewarded</text>
  <text x="540" y="558" fill="#9ca3af" font-size="20">Sentiment is summarized</text>

  <!-- Arrow 2 -->
  <line x1="898" y1="385" x2="972" y2="385" stroke="#5eead4" stroke-width="3"/>
  <polygon points="968,377 984,385 968,393" fill="#5eead4"/>

  <!-- Stage 3: Result -->
  <rect x="980" y="170" width="380" height="430" rx="16" fill="#151b23" stroke="#30363d" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="980" y="170" width="380" height="6" rx="3" fill="#fb923c"/>
  <text x="1010" y="220" fill="#fb923c" font-size="22" font-weight="700" letter-spacing="0.08em">RESULT</text>
  <text x="1010" y="262" fill="#f0f6fc" font-size="26" font-weight="600">AI search visibility</text>
  <circle cx="1022" cy="316" r="5" fill="#fb923c"/><text x="1044" y="323" fill="#c8cfd8" font-size="22">Cited in AI answers</text>
  <circle cx="1022" cy="366" r="5" fill="#fb923c"/><text x="1044" y="373" fill="#c8cfd8" font-size="22">Recommended by assistants</text>
  <circle cx="1022" cy="416" r="5" fill="#fb923c"/><text x="1044" y="423" fill="#c8cfd8" font-size="22">Sentiment summarized</text>
  <circle cx="1022" cy="466" r="5" fill="#fb923c"/><text x="1044" y="473" fill="#c8cfd8" font-size="22">In the answer, or absent</text>
  <text x="1010" y="558" fill="#9ca3af" font-size="20">You are named, or you are not</text>

  <text x="700" y="700" text-anchor="middle" fill="#9ca3af" font-size="22">More reviews, higher ratings, and fresher dates give AI more reasons to surface you</text>
</svg>
