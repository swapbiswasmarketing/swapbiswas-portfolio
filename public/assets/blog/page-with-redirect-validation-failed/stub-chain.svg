<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <rect x="0" y="0" width="1400" height="760" fill="#f6f4ef"/>

  <text x="60" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">Where a header-only check stops</text>
  <text x="60" y="110" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">/redesign/arcade on swapbiswas.com, measured with curl on 1 October 2026</text>

  <rect x="60" y="150" width="960" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="190" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">REQUEST</text>
  <text x="90" y="236" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="22" fill="#15130f">/redesign/arcade</text>
  <text x="990" y="200" text-anchor="end" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">308 Permanent Redirect</text>
  <text x="990" y="238" text-anchor="end" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">Location: /redesign/arcade/</text>

  <line x1="540" y1="270" x2="540" y2="316" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="533,316 547,316 540,330" fill="#15130f"/>
  <text x="566" y="308" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">308 in the headers: curl -L follows it</text>

  <rect x="60" y="332" width="960" height="150" rx="12" fill="#f3dcd2" stroke="#b53b15" stroke-width="2"/>
  <text x="90" y="372" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">LANDS ON A 200 PAGE</text>
  <text x="90" y="418" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="22" fill="#15130f">/redesign/arcade/</text>
  <text x="990" y="382" text-anchor="end" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#b53b15">200 OK</text>
  <text x="990" y="420" text-anchor="end" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">meta refresh after 0 seconds</text>
  <text x="990" y="454" text-anchor="end" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#15130f">robots noindex, canonical to the target</text>

  <line x1="1020" y1="407" x2="1066" y2="407" stroke="#6a645c" stroke-width="2.5"/>
  <text x="1082" y="398" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" fill="#15130f">curl -sIL stops here:</text>
  <text x="1082" y="430" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#3a3632">1 hop, ending in a 200</text>

  <line x1="540" y1="482" x2="540" y2="528" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="533,528 547,528 540,542" fill="#15130f"/>
  <text x="566" y="520" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">meta refresh in the HTML: browsers and Google follow it</text>

  <rect x="60" y="544" width="960" height="120" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="90" y="584" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">THE DEMO PAGE</text>
  <text x="90" y="630" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="22" fill="#15130f">/personal-website-examples/arcade/</text>
  <text x="990" y="594" text-anchor="end" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">200 OK</text>

  <text x="60" y="712" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">Google's redirects guide treats a 0-second meta refresh as a permanent redirect.</text>
</svg>
