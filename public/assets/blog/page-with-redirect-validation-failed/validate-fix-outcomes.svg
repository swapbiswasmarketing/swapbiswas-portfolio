<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 870" width="1400" height="870">
  <rect x="0" y="0" width="1400" height="870" fill="#f6f4ef"/>

  <text x="700" y="70" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.76" fill="#15130f">What Validate fix finds on each redirecting URL</text>
  <text x="700" y="110" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" fill="#6a645c">The sample decides whether the attempt runs; what each URL returns decides its state.</text>

  <rect x="150" y="140" width="650" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="475" y="178" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">YOU CLICK VALIDATE FIX</text>
  <text x="475" y="216" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Search Console checks a few URLs first</text>

  <line x1="800" y1="190" x2="884" y2="190" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="884,183 884,197 898,190" fill="#15130f"/>

  <rect x="900" y="140" width="450" height="100" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1125" y="178" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">IF THE SAMPLE STILL REDIRECTS</text>
  <text x="1125" y="216" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">The attempt stops, state unchanged</text>

  <line x1="475" y1="240" x2="475" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <text x="495" y="280" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" fill="#6a645c">Sample clean: listed URLs are queued for re-crawl</text>
  <line x1="250" y1="300" x2="1150" y2="300" stroke="#15130f" stroke-width="2.5"/>
  <line x1="250" y1="300" x2="250" y2="334" stroke="#15130f" stroke-width="2.5"/>
  <line x1="700" y1="300" x2="700" y2="334" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1150" y1="300" x2="1150" y2="334" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="243,334 257,334 250,348" fill="#15130f"/>
  <polygon points="693,334 707,334 700,348" fill="#15130f"/>
  <polygon points="1143,334 1157,334 1150,348" fill="#15130f"/>

  <rect x="50" y="350" width="400" height="150" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="250" y="390" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">IT STILL REDIRECTS</text>
  <text x="250" y="432" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">301, 308, 302 or 307</text>
  <text x="250" y="466" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">with a Location header</text>

  <rect x="500" y="350" width="400" height="150" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="700" y="390" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">IT SERVES ITS OWN PAGE</text>
  <text x="700" y="432" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">200 with its own content</text>
  <text x="700" y="466" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">and a self-canonical</text>

  <rect x="950" y="350" width="400" height="150" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1150" y="390" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#6a645c">IT IS GONE</text>
  <text x="1150" y="432" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">404, 410 or a login</text>
  <text x="1150" y="466" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">wall in front of it</text>

  <line x1="250" y1="500" x2="250" y2="536" stroke="#15130f" stroke-width="2.5"/>
  <line x1="700" y1="500" x2="700" y2="536" stroke="#15130f" stroke-width="2.5"/>
  <line x1="1150" y1="500" x2="1150" y2="536" stroke="#15130f" stroke-width="2.5"/>
  <polygon points="243,536 257,536 250,550" fill="#15130f"/>
  <polygon points="693,536 707,536 700,550" fill="#15130f"/>
  <polygon points="1143,536 1157,536 1150,550" fill="#15130f"/>

  <rect x="50" y="552" width="400" height="150" rx="12" fill="#f3dcd2" stroke="#b53b15" stroke-width="2"/>
  <text x="250" y="600" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="32" font-weight="600" fill="#b53b15">Failed</text>
  <text x="250" y="640" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#15130f">Google checked and the</text>
  <text x="250" y="674" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#15130f">issue is still there</text>

  <rect x="500" y="552" width="400" height="150" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="700" y="600" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="32" font-weight="600" fill="#15130f">Passed</text>
  <text x="700" y="640" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">The issue is no longer</text>
  <text x="700" y="674" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">found on the URL</text>

  <rect x="950" y="552" width="400" height="150" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
  <text x="1150" y="600" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="32" font-weight="600" fill="#15130f">Other</text>
  <text x="1150" y="640" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Google counts it as</text>
  <text x="1150" y="674" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">equivalent to Passed</text>

  <text x="250" y="746" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#15130f">Expected for a redirect</text>
  <text x="250" y="778" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#15130f">you keep</text>

  <text x="700" y="746" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Right only when the</text>
  <text x="700" y="778" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">redirect was a mistake</text>

  <text x="1150" y="746" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">Also breaks every link</text>
  <text x="1150" y="778" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#3a3632">that still uses the URL</text>

  <line x1="50" y1="804" x2="1350" y2="804" stroke="#e4dfd6" stroke-width="1"/>
  <text x="700" y="834" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="#6a645c">States paraphrased from Google's Page indexing help.</text>
</svg>
