<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
<rect x="0" y="0" width="1400" height="780" fill="#f6f4ef"/>
<text x="60" y="70" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="600" fill="#15130f" letter-spacing="-0.02em">What 24 SEO agency pages in India showed</text>
<text x="60" y="112" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="400" fill="#6a645c">One square per agency, opened logged out from an Indian connection on 16 October 2026</text>
<text x="60" y="174" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Rupee price for its own SEO</text>
<text x="60" y="202" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#6a645c">a rupee sign or INR beside the figure</text>
<rect x="520" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="570" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="620" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="670" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="720" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="770" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="820" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="870" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="920" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<rect x="970" y="154" width="40" height="40" rx="6" fill="#15130f"/>
<text x="1034" y="186" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="32" font-weight="600" fill="#15130f">10</text>
<text x="60" y="266" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">A figure with no currency sign</text>
<text x="60" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#6a645c">"8000 - 1 month" and "29999/-"</text>
<rect x="520" y="246" width="40" height="40" rx="6" fill="#6a645c"/>
<rect x="570" y="246" width="40" height="40" rx="6" fill="#6a645c"/>
<text x="634" y="278" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="32" font-weight="600" fill="#15130f">2</text>
<text x="60" y="358" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">No price for its own SEO</text>
<text x="60" y="386" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#6a645c">an enquiry button, or no price page at all</text>
<rect x="520" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="570" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="620" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="670" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="720" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="800" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="850" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="900" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="950" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="1000" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="1050" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<rect x="1100" y="338" width="40" height="40" rx="6" fill="#b53b15"/>
<text x="1164" y="370" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="32" font-weight="600" fill="#15130f">12</text>
<path d="M520 392 L520 400 L760 400 L760 392" fill="none" stroke="#6a645c" stroke-width="2"/>
<path d="M800 392 L800 400 L1140 400 L1140 392" fill="none" stroke="#6a645c" stroke-width="2"/>
<text x="520" y="430" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">5 plan pages that ask</text>
<text x="520" y="456" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">you to enquire for a price</text>
<text x="800" y="430" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">7 with no plan or price page;</text>
<text x="800" y="456" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">their ranking pages are articles</text>
<rect x="60" y="510" width="620" height="220" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
<rect x="720" y="510" width="620" height="220" rx="12" fill="#ffffff" stroke="#e4dfd6" stroke-width="1"/>
<text x="92" y="560" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Tax: 3 of 10 rupee price lists mention it</text>
<text x="92" y="602" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">All three add it on top of the price:</text>
<text x="92" y="636" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">"+18% GST" on one page and</text>
<text x="92" y="670" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">"EXCLUSIVE OF ALL TAXES" on two.</text>
<text x="92" y="704" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">The other seven say nothing about tax.</text>
<text x="752" y="560" font-family="Bricolage Grotesque, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#15130f">Submissions: 9 of 17 plan pages</text>
<text x="752" y="602" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">list directory, bookmarking, classified,</text>
<text x="752" y="636" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">article, slide or search engine submissions</text>
<text x="752" y="670" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">as line items, and 8 of the 9 print a count</text>
<text x="752" y="704" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#3a3632">for at least one line (all but Webnox).</text>
</svg>
